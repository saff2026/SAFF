/* =================== الاستحواذ (Possession Play) — لاعبان على نفس الجهاز =================== */
const POSS={
  CLOCK:180,multi:true,
  start(){this.st=null;this.setup();},
  stop(){clearInterval(this._iv);},
  setup(){
    screen('الاستحواذ','poss','<div class="stack" style="margin-top:14px"><div class="card"><h3 class="disp">لاعبان على نفس الجهاز</h3><p class="muted small">تبادلا الجهاز. لكل لاعب ساعة ٣ دقائق تعمل في دوره فقط.</p><label class="small muted">اسم اللاعب الأخضر</label><input class="field" id="pa" value="اللاعب ١" style="margin:4px 0 10px"><label class="small muted">اسم اللاعب الأحمر</label><input class="field" id="pb" value="اللاعب ٢" style="margin-top:4px"><button class="btn block" style="margin-top:14px" onclick="POSS.begin()">ابدأ المباراة</button></div></div>');
  },
  begin(){
    const names=[$('#pa').value.trim()||'اللاعب ١',$('#pb').value.trim()||'اللاعب ٢'];
    this.st={names,cats:HEX.board(rng(Math.floor(Math.random()*4e9))),own:{},turn:0,clock:[this.CLOCK,this.CLOCK],used:[],done:false,last:Date.now()};
    this.draw();this.loop();
  },
  loop(){clearInterval(this._iv);this._iv=setInterval(()=>{const st=this.st;if(!st||st.done)return;const now=Date.now();st.clock[st.turn]-=(now-st.last)/1000;st.last=now;if(st.clock[st.turn]<=0){st.clock[st.turn]=0;toast('انتهى وقت '+st.names[st.turn]);this.pass();}const e=$('#pc'+st.turn);if(e)e.textContent=this.fmt(st.clock[st.turn]);},250);},
  tickReset(){if(this.st)this.st.last=Date.now();},
  fmt(s){s=Math.max(0,Math.ceil(s));return AR(Math.floor(s/60))+':'+AR(String(s%60).padStart(2,'0'));},
  pass(){closeSheet();const st=this.st;const o=1-st.turn;if(st.clock[o]>0)st.turn=o;else if(st.clock[st.turn]<=0)return this.end();st.last=Date.now();this.draw();},
  draw(){
    const st=this.st,cnt=[0,0];Object.values(st.own).forEach(o=>cnt[o]++);
    const board=HEX.html(i=>st.own[i]===0?'a':st.own[i]===1?'b':'',i=>shortCat(st.cats[i]),'POSS.pick',HEX.width());
    const side=k=>'<div style="flex:1;text-align:center;border-radius:14px;padding:8px;background:'+(k===0?'rgba(46,169,106,.15)':'rgba(210,82,75,.15)')+(st.turn===k&&!st.done?';box-shadow:0 0 0 2.5px '+(k===0?'#2EA96A':'#D2524B'):'')+'"><b>'+esc(st.names[k])+'</b><div class="big-num num">'+AR(cnt[k])+'</div><div class="small num" id="pc'+k+'">'+this.fmt(st.clock[k])+'</div></div>';
    let msg;
    if(st.done){const w=cnt[0]===cnt[1]?null:(cnt[0]>cnt[1]?0:1);msg='<div class="card result pop"><div class="em">🏆</div><h3>'+(w==null?'تعادل!':'فاز '+esc(st.names[w]))+'</h3><p>'+AR(cnt[0])+' – '+AR(cnt[1])+'</p><button class="btn block" onclick="POSS.setup()">مباراة جديدة</button></div>';}
    else msg='<div class="muted small" style="text-align:center">دور <b style="color:var(--fg)">'+esc(st.names[st.turn])+'</b>: اختر خلية محايدة</div>';
    screen('الاستحواذ','poss','<div class="stack" style="margin-top:12px"><div style="display:flex;gap:8px">'+side(0)+side(1)+'</div>'+msg+'<div class="card" style="padding:10px">'+board+'</div></div>');
  },
  pick(i){
    const st=this.st;if(st.done)return;if(st.own[i]!==undefined){toast('اختر خلية محايدة');return;}
    pickPlayerSheet(shortCat(st.cats[i]),'دور '+esc(st.names[st.turn])+': اذكر لاعبًا يحقق الفئة.',p=>this.play(i,p),{isUsed:p=>st.used.includes(p.q)});
  },
  play(i,p){
    const st=this.st,cells=HEX.cells();st.last=Date.now();
    if(!catTest(st.cats[i])(p)){toast('✗ خطأ، الدور ينتقل');this.pass();return;}
    st.used.push(p.q);let n=1;st.own[i]=st.turn;
    for(const x of cells[i].nb){if(st.own[x]!==st.turn&&catTest(st.cats[x])(p)){if(st.own[x]!==undefined)toast('🔁 استحواذ على خلية من الخصم');st.own[x]=st.turn;n++;}}
    if(n>1)toast('+'+AR(n)+' خلايا');
    if(Object.keys(st.own).length===31)return this.end();
    this.pass();
  },
  end(){this.st.done=true;clearInterval(this._iv);this.draw();}
};

/* =================== المعرفة الكروية (General Ball Knowledge) =================== */
const QUIZ={
  TOPICS:null,
  topics(){
    if(this.TOPICS)return this.TOPICS;
    const C=allCats();
    const clubs=C.club.slice().sort((a,b)=>b.n-a.n).slice(0,14).map(c=>({k:'club',v:c.v,n:tName(c.v)}));
    const nats=C.nat.slice().sort((a,b)=>b.n-a.n).slice(0,10).map(c=>({k:'nat',v:c.v,n:cName(c.v)}));
    const arab=Object.keys(D.C).filter(q=>ARAB.has(q)&&C.nat.some(c=>c.v===q)).map(q=>({k:'nat',v:q,n:cName(q)}));
    const seen=new Set();return this.TOPICS=[{k:'all',n:'عام'}].concat(arab,clubs,nats).filter(t=>{const k=t.k+t.v;if(seen.has(k))return false;seen.add(k);return true;});
  },
  subjects(topic){
    if(!topic||topic.k==='all')return D.famous;
    const t=catTest(topic);return D.famous.filter(t);
  },
  gen(r,i,topic){
    const S=this.subjects(topic);const span=[60,60,150,150,300,300,600,600,1200,1200][i];
    const pool=S.slice(Math.floor(span/6),span).length>=8?S.slice(0,span):S;
    const pick=()=>pool[Math.floor(r()*pool.length)];
    const opts=(right,wrongs)=>{const w=[...new Set(wrongs.filter(x=>x!==right))];if(w.length<3)return null;return {o:shuffled([right].concat(pickN(w,3,r)),r),a:right};};
    for(let t=0;t<200;t++){
      const kind=Math.floor(r()*8),p=pick();if(!p)continue;let q=null,o=null;
      if(kind===0){q='ما جنسية '+p.n+'؟';o=opts(cName(p.nat),Object.keys(D.C).filter(c=>(D.C[c][2]===(D.C[p.nat]||[])[2])&&c!==p.nat).map(cName));}
      else if(kind===1){const mine=[...p.clubs];const c=mine[Math.floor(r()*mine.length)];q='أي نادٍ من هذه لعب له '+p.n+'؟';o=opts(tName(c),allCats().club.filter(x=>!p.clubs.has(x.v)&&(D.T[x.v]||[])[1]===(D.T[c]||[])[1]).map(x=>tName(x.v)).concat(allCats().club.filter(x=>!p.clubs.has(x.v)).slice(0,30).map(x=>tName(x.v))));}
      else if(kind===2&&p.by){q='في أي سنة وُلد '+p.n+'؟';o=opts(AR(p.by),[-3,-2,-1,1,2,3].map(d=>AR(p.by+d)));}
      else if(kind===3&&p.nt&&p.nt[1]>=10){q='كم مباراة دولية لعب '+p.n+' مع المنتخب الأول (حسب آخر تحديث)؟';const v=p.nt[1];o=opts(AR(v),[Math.round(v*0.6),Math.round(v*0.8),Math.round(v*1.25),Math.round(v*1.5)].map(AR));}
      else if(kind===4&&p.car.length>=2){q='ما أول نادٍ لعب له '+p.n+' في مسيرته الاحترافية؟';const first=p.car[0][0];o=opts(tName(first),p.car.slice(1).map(c=>tName(c[0])).concat(allCats().club.slice(0,40).map(x=>tName(x.v))));}
      else if(kind===5){const club=p.mainClub,T=D.T[club];if(!T||!T[2])continue;q='في أي سنة تأسس '+T[0]+'؟';o=opts(AR(T[2]),[-12,-6,-3,3,7,11].map(d=>AR(T[2]+d)));}
      else if(kind===6){const club=p.mainClub;const ins=D.famous.slice(0,span*2).filter(x=>x.clubs.has(club)&&x!==p);const outs=D.famous.slice(0,span*2).filter(x=>!x.clubs.has(club)&&x.nat===p.nat);if(ins.length<3||!outs.length)continue;const odd=outs[Math.floor(r()*Math.min(outs.length,30))];q='أي لاعب من هؤلاء لم يلعب لـ'+tName(club)+'؟';o={o:shuffled([odd.n].concat(pickN(ins,3,r).map(x=>x.n)),r),a:odd.n};}
      else if(kind===7){const W=Object.values(D.W).filter(w=>w.w.length>=10);if(!W.length)continue;const comp=W[Math.floor(r()*W.length)];const e=comp.w[Math.floor(r()*comp.w.length)];if(!e[1]||!D.T[e[0]])continue;q='من فاز بـ'+comp.n+' في نسخة '+AR(e[1])+'؟';o=opts(tName(e[0]),comp.w.filter(x=>x[0]!==e[0]&&D.T[x[0]]).map(x=>tName(x[0])));}
      if(q&&o&&o.o.length===4)return {q,o:o.o,a:o.a};
    }
    return null;
  },
  start(mode,topicIdx){
    mode=mode||this.mode||'daily';this.mode=mode;if(topicIdx!==undefined)this.ti=topicIdx;const ti=this.ti||0;
    const topic=this.topics()[ti];
    const r=rng(seedFor('quiz-'+ti,mode));const qs=[];
    for(let i=0;i<10;i++){const q=this.gen(r,i,topic);if(q)qs.push(q);}
    const key='quiz-'+ti;
    const fresh=()=>({qs,i:0,ans:[],done:false});
    this.st=mode==='daily'?(()=>{let s=store.get('day:'+key,null);if(!s||s.day!==DAY)s=Object.assign({day:DAY},fresh());return s;})():fresh();
    this.key=key;this.draw();
  },
  save(){if(this.mode==='daily'){store.set('day:'+this.key,this.st);if(this.st.done)store.set('day:quiz',{day:DAY,done:true});}},
  draw(){
    const st=this.st,score=st.ans.filter(Boolean).length;
    const topics='<div class="chips" style="margin:10px 0;flex-wrap:nowrap;overflow-x:auto">'+this.topics().map((t,i)=>'<button class="chip '+(i===(this.ti||0)?'on':'')+'" style="flex:none" onclick="QUIZ.start(QUIZ.mode,'+i+')">'+esc(t.n)+'</button>').join('')+'</div>';
    let body;
    if(st.done)body=resultCard({em:score>=8?'🧠':score>=5?'👏':'📚',title:AR(score)+' / '+AR(st.qs.length),sub:score>=8?'معرفة كروية ممتازة!':'جرّب موضوعًا آخر',daily:this.mode==='daily',game:'quiz',share:'QUIZ.share()',again:"QUIZ.start('free')",againLabel:'أسئلة جديدة'});
    else{
      const q=st.qs[st.i],a=st.picked;
      body='<div class="card"><div class="tagrow"><span class="pill a num">السؤال '+AR(st.i+1)+' / '+AR(st.qs.length)+'</span><span class="muted small">'+(st.i<3?'سهل':st.i<6?'متوسط':st.i<8?'صعب':'صعب جدًا')+'</span></div><h3 style="font-size:1.1rem;font-weight:800;margin:12px 0">'+esc(q.q)+'</h3>'+
        q.o.map((o,k)=>'<button class="opt '+(a!=null?(o===q.a?'ok':(k===a?'bad':'')):'')+'" '+(a!=null?'disabled':'')+' onclick="QUIZ.pick('+k+')">'+esc(o)+'</button>').join('')+
        (a!=null?'<button class="btn block" style="margin-top:12px" onclick="QUIZ.next()">'+(st.i+1<st.qs.length?'التالي':'النتيجة')+'</button>':'')+'</div>'+
        '<div class="tagrow">'+st.qs.map((x,k)=>'<i style="flex:1;height:6px;border-radius:3px;background:'+(k<st.ans.length?(st.ans[k]?'var(--ok)':'var(--bad)'):'var(--fill2)')+'"></i>').join('')+'</div>';
    }
    screen('المعرفة الكروية','quiz',modeSeg('QUIZ',this.mode)+topics+'<div class="stack">'+body+'</div>');
  },
  pick(k){const st=this.st;if(st.picked!=null)return;st.picked=k;const q=st.qs[st.i];st.ans.push(q.o[k]===q.a);this.save();this.draw();},
  next(){const st=this.st;st.picked=null;st.i++;if(st.i>=st.qs.length){st.done=true;if(this.mode==='daily')recordResult('quiz',st.ans.filter(Boolean).length>=7);}this.save();this.draw();},
  share(){const st=this.st;share('تحدّي الكورة · المعرفة الكروية #'+DAYNO+' ('+this.topics()[this.ti||0].n+')\n'+st.ans.filter(Boolean).length+'/'+st.qs.length+' '+st.ans.map(x=>x?'🟩':'🟥').join(''));}
};

 help:'<h3>طريقة لعب «المعرفة الكروية»</h3><ol><li>١٠ أسئلة اختيار من متعدد، تبدأ سهلة وتصعب تدريجيًا.</li><li>اختر موضوعًا: عام، أو منتخب، أو نادٍ.</li><li>الأسئلة مولّدة من بيانات اللاعبين والأندية والبطولات.</li></ol>'});

/* =================== التشكيلة الحلم (SuperDraft) =================== */
const DRAFT={
  F:[['GK','حارس',50,88,'حارس'],['RB','ظهير أيمن',85,68,'دفاع'],['CB','قلب دفاع',62,72,'دفاع'],['CB','قلب دفاع',38,72,'دفاع'],['LB','ظهير أيسر',15,68,'دفاع'],['CM','وسط',72,46,'وسط'],['CM','وسط',50,50,'وسط'],['CM','وسط',28,46,'وسط'],['RW','جناح أيمن',82,20,'هجوم'],['ST','مهاجم',50,15,'هجوم'],['LW','جناح أيسر',18,20,'هجوم']],
  LINKS:[[0,2],[0,3],[1,2],[2,3],[3,4],[1,5],[2,6],[3,6],[4,7],[5,6],[6,7],[5,8],[6,9],[7,10],[8,9],[9,10]],
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    const r=rng(seedFor('draft',mode));
    const byPos={};D.famous.slice(0,1500).forEach(p=>{if(p.pos)(byPos[p.pos]=byPos[p.pos]||[]).push(p.q);});
    const offers=this.F.map(f=>pickN(byPos[f[4]],4,r));
    const fresh=()=>({offers,team:new Array(11).fill(null),done:false});
    this.st=mode==='daily'?dayState('draft',fresh):fresh();this.draw();
  },
  save(){if(this.mode==='daily')saveDay('draft',this.st);},
  rating(p){return Math.round(Math.min(99,55+Math.log2(1+p.fame)*5));},
  chem(){
    const t=this.st.team;let c=0;const det=[];
    for(const [a,b] of this.LINKS){const A=D.byQ[t[a]],B=D.byQ[t[b]];if(!A||!B)continue;let v=0;
      if([...A.clubs].some(x=>B.clubs.has(x)))v+=2;if(A.nat===B.nat)v+=1;if([...A.leagues].some(x=>B.leagues.has(x)))v+=1;c+=Math.min(3,v);det.push(v);}
    return c;
  },
  draw(){
    const st=this.st;const slot=st.team.findIndex(x=>!x);
    const toks=this.F.map((f,i)=>{const p=D.byQ[st.team[i]];return '<button class="tok '+(p?'ok':'')+(i===slot&&!st.done?' sel':'')+'" style="left:'+f[2]+'%;top:'+f[3]+'%" onclick="DRAFT.focus('+i+')"><span class="sh num">'+(p?AR(this.rating(p)):'+')+'</span><span class="nm">'+(p?esc(p.n.split(/\s+/).slice(-1)[0]):esc(f[1]))+'</span></button>';}).join('');
    const lines=this.LINKS.map(([a,b])=>{const A=D.byQ[st.team[a]],B=D.byQ[st.team[b]];if(!A||!B)return '';let v=0;if([...A.clubs].some(x=>B.clubs.has(x)))v+=2;if(A.nat===B.nat)v+=1;if([...A.leagues].some(x=>B.leagues.has(x)))v+=1;const col=v>=3?'#2EB866':v>=1?'#E3B523':'#D93A3A';const fa=this.F[a],fb=this.F[b];return '<line x1="'+fa[2]+'" y1="'+fa[3]+'" x2="'+fb[2]+'" y2="'+fb[3]+'" stroke="'+col+'" stroke-width="0.8" stroke-linecap="round"/>';}).join('');
    const filled=st.team.filter(Boolean).map(q=>D.byQ[q]);const avg=filled.length?Math.round(filled.reduce((a,p)=>a+this.rating(p),0)/filled.length):0;const chem=this.chem();
    let panel;
    if(slot<0||st.done){if(!st.done){st.done=true;if(this.mode==='daily')recordResult('draft',true,avg+chem);this.save();}panel=resultCard({em:'📋',title:'تقييم فريقك: '+AR(avg+chem),sub:'متوسط اللاعبين '+AR(avg)+' + الانسجام '+AR(chem)+' من '+AR(this.LINKS.length*3),daily:this.mode==='daily',game:'draft',share:'DRAFT.share()',again:"DRAFT.start('free')",againLabel:'مسودة جديدة'});}
    else{const f=this.F[slot];panel='<div class="card"><div class="tagrow"><b class="disp">اختر '+esc(f[1])+'</b><span class="pill num">'+AR(st.team.filter(Boolean).length)+' / ١١</span></div>'+st.offers[slot].map(q=>{const p=D.byQ[q];return '<button class="opt" onclick="DRAFT.choose('+slot+',\''+q+'\')"><span class="tagrow"><span>'+flag(p.nat)+' '+esc(p.n)+'<br><span class="muted small">'+esc(tName(p.mainClub))+'</span></span><b class="num" style="font-family:var(--f-display);font-size:1.2rem">'+AR(this.rating(p))+'</b></span></button>';}).join('')+'</div>';}
    screen('التشكيلة الحلم','draft',modeSeg('DRAFT',this.mode)+'<div class="stack" style="margin-top:12px"><div class="tagrow"><span class="pill a num">التقييم '+AR(avg)+'</span><span class="pill g num">الانسجام '+AR(chem)+'</span></div><div class="pitch"><div class="ln mid"></div><div class="ln circ"></div><div class="ln box"></div><div class="ln six"></div><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">'+lines+'</svg>'+toks+'</div>'+panel+'</div>');
  },
  focus(i){},
  choose(i,q){this.st.team[i]=q;this.save();this.draw();},
  share(){const f=this.st.team.map(q=>D.byQ[q]);const avg=Math.round(f.reduce((a,p)=>a+this.rating(p),0)/11);share('تحدّي الكورة · التشكيلة الحلم #'+DAYNO+'\n📋 '+(avg+this.chem())+' (تقييم '+avg+' + انسجام '+this.chem()+')');}
};
registerGame({id:'draft',name:'التشكيلة الحلم',desc:'اختر ١١ لاعبًا وابنِ أكثر فريق انسجامًا',color:'linear-gradient(160deg,#0F4636,#06231B)',ic:'📋',obj:DRAFT,group:'more',
 help:'<h3>طريقة لعب «التشكيلة الحلم»</h3><ol><li>لكل مركز في خطة ٤-٣-٣ يُعرض عليك ٤ لاعبين، اختر واحدًا.</li><li>تقييم اللاعب محسوب من شهرته.</li><li><b>الانسجام</b> بين كل لاعبين متجاورين: نادٍ مشترك +٢، نفس الجنسية +١، نفس الدوري +١ (بحد أقصى ٣ لكل رابط).</li><li>الخطوط الخضراء انسجام قوي، والصفراء متوسط، والحمراء ضعيف.</li><li>النتيجة = متوسط التقييم + الانسجام.</li></ol>'});

/* =================== إكس-أو الكورة (Tiki-Taka-Toe) =================== */
const TTT={
  multi:true,
  start(){this.setup();},
  setup(){
    screen('إكس-أو الكورة','ttt','<div class="stack" style="margin-top:14px"><div class="card"><h3 class="disp">لاعبان على نفس الجهاز</h3><label class="small muted">اسم لاعب ✕</label><input class="field" id="ta" value="اللاعب ١" style="margin:4px 0 10px"><label class="small muted">اسم لاعب ◯</label><input class="field" id="tb" value="اللاعب ٢" style="margin-top:4px"><label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700"><input type="checkbox" id="tsteal"> وضع الاستحواذ (٣ سرقات لكل لاعب)</label><button class="btn block" style="margin-top:14px" onclick="TTT.begin()">ابدأ</button></div></div>');
  },
  begin(){
    const g=buildGrid(rng(Math.floor(Math.random()*4e9)),3,3,{minFame:30});
    this.st={names:[$('#ta').value.trim()||'اللاعب ١',$('#tb').value.trim()||'اللاعب ٢'],rows:g.rows,cols:g.cols,cell:{},turn:0,steal:$('#tsteal').checked?[3,3]:null,done:false,win:null};
    this.sets=gridSets(this.st);this.draw();
  },
  line(){const c=this.st.cell,L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const l of L){const o=l.map(i=>c[i]&&c[i].o);if(o[0]!=null&&o[0]===o[1]&&o[1]===o[2])return o[0];}return null;},
  draw(){
    const st=this.st,mk=['✕','◯'];
    let h='<div class="bx"><div></div>'+st.cols.map(c=>'<div class="hd">'+catHead(c)+'</div>').join('');
    for(let i=0;i<3;i++){h+='<div class="hd">'+catHead(st.rows[i])+'</div>';for(let j=0;j<3;j++){const k=i*3+j,c=st.cell[k];h+='<button class="cl '+(c?'ok':'empty')+'" style="'+(c?'background:'+(c.o===0?'#2EA96A':'#D2524B')+';color:#fff':'')+'" onclick="TTT.open('+k+')">'+(c?'<div><div style="font-size:1.4rem">'+mk[c.o]+'</div>'+esc(D.byQ[c.q].n)+'</div>':'+')+'</button>';}}
    h+='</div>';
    const msg=st.done?'<div class="card result pop"><div class="em">🏆</div><h3>'+(st.win==null?'تعادل!':'فاز '+esc(st.names[st.win]))+'</h3><button class="btn block" onclick="TTT.setup()">مباراة جديدة</button></div>':
      '<div class="card tagrow"><b>دور '+mk[st.turn]+' '+esc(st.names[st.turn])+'</b>'+(st.steal?'<span class="pill g">سرقات: '+AR(st.steal[st.turn])+'</span>':'')+'<button class="btn ghost small" onclick="TTT.pass()">تمرير الدور</button></div>';
    screen('إكس-أو الكورة','ttt','<div class="stack" style="margin-top:12px">'+msg+'<div class="card" style="padding:12px">'+h+'</div></div>');
  },
  open(k){
    const st=this.st;if(st.done)return;const c=st.cell[k];
    if(c){if(c.o===st.turn){toast('هذه خانتك');return;}if(!st.steal||!st.steal[st.turn]){toast('الخانة محجوزة');return;}}
    const a=st.rows[Math.floor(k/3)],b=st.cols[k%3];
    pickPlayerSheet(esc(catLabel(a))+' × '+esc(catLabel(b)),c?'سرقة: اذكر لاعبًا مختلفًا عن '+esc(D.byQ[c.q].n):'دور '+esc(st.names[st.turn]),p=>this.play(k,p),{isUsed:p=>c&&c.q===p.q});
  },
  play(k,p){
    const st=this.st,c=st.cell[k];
    if(this.sets[k].includes(p.q)){if(c)st.steal[st.turn]--;st.cell[k]={o:st.turn,q:p.q};toast('✓ '+p.n);}
    else toast('✗ '+p.n+' لا يحقق الشرطين، الدور ينتقل');
    const w=this.line();if(w!=null){st.done=true;st.win=w;}else if(Object.keys(st.cell).length===9&&!(st.steal&&(st.steal[0]||st.steal[1]))){st.done=true;}
    if(!st.done)st.turn=1-st.turn;this.draw();
  },
  pass(){this.st.turn=1-this.st.turn;this.draw();}
};
registerGame({id:'ttt',name:'إكس-أو الكورة',desc:'إكس-أو بأسئلة كرة قدم ضد صديقك',color:'linear-gradient(160deg,#0EA5E9,#075985)',ic:'✕◯',obj:TTT,multi:true,
 help:'<h3>طريقة لعب «إكس-أو الكورة»</h3><ol><li>لاعبان على نفس الجهاز. الشبكة ٣×٣، وكل صف وعمود شرط.</li><li>في دورك اختر خانة واذكر لاعبًا يحقق شرطيها لتضع علامتك.</li><li>الخطأ ينقل الدور لخصمك.</li><li>أول من يكمل ثلاثًا في صف أو عمود أو قطر يفوز.</li><li>في <b>وضع الاستحواذ</b> لكل لاعب ٣ سرقات: يأخذ خانة خصمه بلاعب مختلف.</li></ol>'});

/* =================== الدخيل (Rondo Ringer) — تمرير الجوال =================== */
const RING={
  multi:true,
  start(){this.setup();},
  setup(){
    const saved=store.get('ringer:names',['','','','']);
    screen('الدخيل','ringer','<div class="stack" style="margin-top:14px"><div class="card"><h3 class="disp">لعبة جماعية بتمرير الجوال</h3><p class="muted small">من ٣ إلى ١٠ لاعبين. اكتب الأسماء.</p><div id="rnames">'+saved.map((n,i)=>'<input class="field rn" style="margin-top:6px" placeholder="اسم اللاعب '+AR(i+1)+'" value="'+esc(n)+'">').join('')+'</div><div class="btns" style="margin-top:8px"><button class="btn sec" onclick="RING.addName()">+ لاعب</button></div><button class="btn block" style="margin-top:12px" onclick="RING.begin()">ابدأ الجولة</button></div></div>');
  },
  addName(){if($$('.rn').length>=10)return;const i=document.createElement('input');i.className='field rn';i.style.marginTop='6px';i.placeholder='اسم اللاعب';$('#rnames').appendChild(i);i.focus();},
  begin(){
    const names=$$('.rn').map(i=>i.value.trim()).filter(Boolean);
    if(names.length<3){toast('تحتاج ٣ لاعبين على الأقل');return;}
    store.set('ringer:names',names);
    const score=this.st&&this.st.names.join()===names.join()?this.st.score:names.map(()=>0);
    const pool=D.famous.slice(0,400);const p=pool[Math.floor(Math.random()*pool.length)];
    this.st={names,score,secret:p.q,ringer:Math.floor(Math.random()*names.length),step:'reveal',i:0,shown:false,votes:[],vi:0};
    this.draw();
  },
  draw(){
    const st=this.st,p=D.byQ[st.secret];let body='';
    if(st.step==='reveal'){
      if(st.i>=st.names.length){st.step='clues';return this.draw();}
      body=!st.shown?'<div class="card result"><div class="em">📱</div><h3>سلّم الجوال إلى '+esc(st.names[st.i])+'</h3><p>لا تدع أحدًا يرى الشاشة.</p><button class="btn block" onclick="RING.st.shown=true;RING.draw()">أنا '+esc(st.names[st.i])+'، اكشف</button></div>':
        (st.i===st.ringer?'<div class="card result"><div class="em">🕵️</div><h3>أنت الدخيل!</h3><p>لا تعرف اللاعب. اندمج مع الآخرين وحاول معرفته من تلميحاتهم.</p><button class="btn block" onclick="RING.nextReveal()">تم، أخفِ الشاشة</button></div>':
         '<div class="card result"><div class="em">⚽</div><p>اللاعب السري:</p><h3>'+flag(p.nat)+' '+esc(p.n)+'</h3><p>'+esc(tName(p.mainClub))+'</p><button class="btn block" onclick="RING.nextReveal()">حفظته، أخفِ الشاشة</button></div>');
    } else if(st.step==='clues'){
      const start=Math.floor(Math.random()*st.names.length);
      body='<div class="card"><h3 class="disp">جولة التلميحات</h3><p class="muted">كل لاعب يقول تلميحًا قصيرًا عن اللاعب السري بالترتيب، بدون أن يجعله واضحًا جدًا. الدخيل يحاول أن يندمج.</p><ol>'+st.names.map((n,k)=>'<li>'+esc(st.names[(start+k)%st.names.length])+'</li>').join('')+'</ol><p class="muted small">يمكنكم عمل جولتين من التلميحات قبل التصويت.</p><button class="btn block" onclick="RING.st.step=\'vote\';RING.st.shown=false;RING.draw()">انتقلوا للتصويت</button></div>';
    } else if(st.step==='vote'){
      if(st.vi>=st.names.length){this.tally();return;}
      const v=st.names[st.vi];
      body=!st.shown?'<div class="card result"><div class="em">🗳️</div><h3>سلّم الجوال إلى '+esc(v)+'</h3><button class="btn block" onclick="RING.st.shown=true;RING.draw()">أنا '+esc(v)+'</button></div>':
        '<div class="card"><h3 class="disp">'+esc(v)+': من الدخيل؟</h3>'+st.names.map((n,k)=>k===st.vi?'':'<button class="opt" onclick="RING.vote('+k+')">'+esc(n)+'</button>').join('')+'</div>';
    } else if(st.step==='guess'){
      body='<div class="card"><h3 class="disp">انكشف الدخيل: '+esc(st.names[st.ringer])+'</h3><p class="muted">آخر فرصة: إذا عرف اللاعب السري يفوز بـ٣ نقاط.</p>'+acHTML('rg','من هو اللاعب السري؟')+'<button class="btn danger block" style="margin-top:10px" onclick="RING.guess(null)">لا أعرف</button></div>';
    } else if(st.step==='result'){
      body='<div class="card result pop"><div class="em">'+(st.rw?'🕵️':'🛡️')+'</div><h3>'+esc(st.msg)+'</h3><p>اللاعب السري كان: <b>'+esc(p.n)+'</b></p></div><div class="card"><h3 class="disp" style="margin-bottom:6px">النقاط</h3>'+st.names.map((n,k)=>'<div class="tagrow" style="padding:4px 0"><span>'+esc(n)+'</span><b class="num">'+AR(st.score[k])+'</b></div>').join('')+'<button class="btn block" style="margin-top:12px" onclick="RING.begin2()">جولة جديدة</button></div>';
    }
    screen('الدخيل','ringer','<div class="stack" style="margin-top:12px">'+body+'</div>');
    if(st.step==='guess')bindAC($('#rg'),$('#rgL'),x=>this.guess(x));
  },
  begin2(){const st=this.st;const pool=D.famous.slice(0,400);st.secret=pool[Math.floor(Math.random()*pool.length)].q;st.ringer=Math.floor(Math.random()*st.names.length);st.step='reveal';st.i=0;st.shown=false;st.votes=[];st.vi=0;this.draw();},
  nextReveal(){this.st.i++;this.st.shown=false;this.draw();},
  vote(k){this.st.votes.push(k);this.st.vi++;this.st.shown=false;this.draw();},
  tally(){
    const st=this.st,cnt=st.names.map((n,k)=>st.votes.filter(v=>v===k).length),mx=Math.max(...cnt);
    const top=cnt.map((c,k)=>c===mx?k:-1).filter(k=>k>=0);
    if(top.length===1&&top[0]===st.ringer){st.step='guess';}
    else{const missed=st.votes.filter((v,k)=>k!==st.ringer&&v!==st.ringer).length;st.score[st.ringer]+=missed;st.rw=true;st.msg='الدخيل '+st.names[st.ringer]+' نجا! +'+missed;st.step='result';}
    this.draw();
  },
  guess(p){
    const st=this.st;
    if(p&&p.q===st.secret){st.score[st.ringer]+=3;st.rw=true;st.msg='الدخيل عرف اللاعب وخطف الفوز! +٣';}
    else{st.rw=false;st.msg='فاز الفريق!';st.votes.forEach((v,k)=>{if(v===st.ringer)st.score[k]+=1;});}
    st.step='result';this.draw();
  },
};
registerGame({id:'ringer',name:'الدخيل',desc:'لعبة جماعية: اكتشفوا من لا يعرف اللاعب السري',color:'linear-gradient(160deg,#6366F1,#312E81)',ic:'🕵',obj:RING,multi:true,
 help:'<h3>طريقة لعب «الدخيل»</h3><ol><li>من ٣ إلى ١٠ لاعبين بتمرير الجوال.</li><li>كل لاعب يرى اللاعب السري سرًّا، إلا واحدًا: <b>الدخيل</b>.</li><li>تتبادلون تلميحات قصيرة عن اللاعب. الفريق يحاول كشف الدخيل دون أن يجعل اللاعب واضحًا جدًا.</li><li>بعدها يصوّت كل لاعب سرًّا على الدخيل.</li><li>إذا لم يحصل الدخيل على أكثر الأصوات (أو تعادلت) يفوز ويأخذ نقطة عن كل من لم يصوّت عليه.</li><li>إذا كُشف، له فرصة أخيرة لتخمين اللاعب: إن أصاب أخذ ٣ نقاط، وإن أخطأ أخذ كل من صوّت عليه نقطة.</li></ol>'});

/* =================== باك 11 (بطاقات المقارنة) =================== */
const PACK={
  STATS:[['apps','مباريات مع الأندية',p=>totals(p).apps],['goals','أهداف مع الأندية',p=>totals(p).goals],['caps','مباريات دولية',p=>p.nt?p.nt[1]:null],['ig','أهداف دولية',p=>p.nt?p.nt[2]:null],['h','الطول (سم)',p=>p.h],['nc','عدد الأندية',p=>new Set(p.car.map(c=>c[0])).size]],
  pool(){return D.famous.slice(0,1200).filter(p=>this.STATS.every(s=>s[2](p)!=null));},
  start(mode,hard){
    mode=mode||this.mode||'daily';this.mode=mode;if(hard!==undefined)this.hard=hard;
    const r=rng(seedFor('pack'+(this.hard?'h':''),mode));
    const pool=this.pool();const cards=pickN(this.hard?pool.slice(300):pool.slice(0,500),12,r).map(p=>p.q);
    const statIdx=cards.map(()=>pickN([0,1,2,3,4,5],5,r));
    const fresh=()=>({cards,statIdx,i:0,yellow:false,done:false,win:false,hist:[]});
    const key='pack'+(this.hard?'h':'');
    this.st=mode==='daily'?(()=>{let s=store.get('day:'+key,null);if(!s||s.day!==DAY)s=Object.assign({day:DAY},fresh());return s;})():fresh();
    this.key=key;this.sel=null;this.draw();
  },
  save(){if(this.mode==='daily'){store.set('day:'+this.key,this.st);store.set('day:pack',{day:DAY,done:this.st.done});}},
  card(q,si,show,gold,mark){
    const p=D.byQ[q];
    return '<div class="tcard'+(gold?' gold':'')+'"><div class="mt">'+esc(p.pos||'')+' · '+flag(p.nat)+'</div><div class="nm">'+esc(p.n)+'</div><div class="mt">'+esc(tName(p.mainClub))+'</div>'+
      si.map(k=>{const s=this.STATS[k],v=s[2](p);const cls=mark&&mark.k===k?mark.c:(show&&this.sel===k?'sel':'');return '<button class="st '+cls+'" '+(show?'onclick="PACK.sel='+k+';PACK.draw()"':'disabled')+'><span>'+s[1]+'</span><b class="num">'+(show||mark?AR(v):'؟')+'</b></button>';}).join('')+'</div>';
  },
  draw(){
    const st=this.st;
    let body;
    if(st.done){
      body=resultCard({em:st.win?'🥇':'🟥',title:st.win?'أكملت البطاقات الـ١١!':'طُردت!',sub:'وصلت إلى البطاقة '+AR(Math.min(st.i+1,11))+' من ١١',daily:this.mode==='daily',game:'pack',share:'PACK.share()',again:"PACK.start('free')",againLabel:'رزمة جديدة'});
    } else {
      const a=st.cards[st.i],b=st.cards[st.i+1],si=st.statIdx[st.i];
      body='<div class="tagrow"><span class="pill a num">البطاقة '+AR(st.i+1)+' / ١١</span><span>'+(st.yellow?'<span class="yc"></span> إنذار':'')+'</span></div>'+
        '<div class="cards2">'+this.card(a,si,true,false,st.lastMark)+this.card(b,si,false,st.i===10)+'</div>'+
        '<p class="muted small" style="text-align:center;margin:0">اختر رقمًا من البطاقة اليمنى تتوقع أنه أكبر من أو يساوي الرقم نفسه في البطاقة اليسرى.</p>'+
        '<button class="btn block" '+(this.sel==null?'disabled':'')+' onclick="PACK.go()">تأكيد الاختيار</button>';
    }
    const modes='<div class="chips" style="margin:10px 0"><button class="chip '+(!this.hard?'on':'')+'" onclick="PACK.start(PACK.mode,false)">عادي</button><button class="chip '+(this.hard?'on':'')+'" onclick="PACK.start(PACK.mode,true)">صعب</button></div>';
    screen('باك 11','pack',modeSeg('PACK',this.mode)+modes+'<div class="stack">'+body+'</div>');
  },
  go(){
    const st=this.st,k=this.sel;if(k==null)return;const s=this.STATS[k];
    const va=s[2](D.byQ[st.cards[st.i]]),vb=s[2](D.byQ[st.cards[st.i+1]]);
    const ok=va>=vb;st.hist.push(ok?1:0);
    toast((ok?'✓ صح: ':'✗ خطأ: ')+AR(va)+' مقابل '+AR(vb));
    if(!ok){if(st.yellow){st.done=true;st.win=false;}else st.yellow=true;}
    if(!st.done){st.i++;if(st.i>=11){st.done=true;st.win=true;}}
    if(st.done&&this.mode==='daily')recordResult('pack',st.win);
    st.lastMark=null;this.sel=null;this.save();this.draw();
  },
  share(){share('تحدّي الكورة · باك 11 #'+DAYNO+'\n'+this.st.hist.map(x=>x?'🟩':'🟨').join('')+(this.st.win?' 🥇':' 🟥'));}
};
registerGame({id:'pack',name:'باك 11',desc:'بطاقات مقارنة أرقام اللاعبين',color:'linear-gradient(160deg,#C9A24A,#6b4f12)',ic:'🃏',obj:PACK,
 help:'<h3>طريقة لعب «باك 11»</h3><ol><li>أمامك بطاقتا لاعبين، الأولى أرقامها ظاهرة والثانية مخفية.</li><li>اختر رقمًا من البطاقة الأولى تتوقع أنه <b>أكبر من أو يساوي</b> الرقم نفسه في البطاقة الثانية.</li><li>إذا أصبت تنتقل للبطاقة التالية.</li><li>أول خطأ = إنذار 🟨، والثاني = طرد 🟥.</li><li>تجاوز ١١ بطاقة والبطاقة الذهبية لتفوز.</li></ol><p class="muted small">الأرقام لمسيرة اللاعب كاملة من صندوق معلوماته في ويكيبيديا: مباريات الدوري وأهدافه، والمباريات الدولية مع المنتخب الأول.</p>'});

const ORDER=['m11','who','grid','career','tena','word','conn','pies','mines','rare','fans','lista','ctx','bingo','gegen','heat','pack','quiz','ttt','poss','ringer','draft'];

/* Layout: a match-report ledger — a filterable stack of case sheets, each with crests, a fact grid and its sources */
:root{

}

:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201b; --fg:#e7ece8; --muted:#9aa69e; --line:#2b352f;
  --accent:#6cc795; --accent-soft:#1d3327; --warn:#f0b75a; --warn-soft:#3a2c14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.75;direction:rtl}
.wrap{max-width:1040px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.lede{color:var(--muted);max-width:68ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.85rem}
.legend b{color:var(--warn);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.filters button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:.85rem}
.cases{display:flex;flex-direction:column;gap:16px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.crests{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.crest{width:46px;height:52px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem;
  clip-path:polygon(50% 0,100% 12%,100% 62%,50% 100%,0 62%,0 12%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.title{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.meta{color:var(--muted);font-size:.88rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.when{background:var(--warn-soft);color:var(--warn)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 22px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.facts dd{margin:0}
.note{font-size:.85rem;color:var(--warn)}
.src{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
.src span{color:var(--muted)}
a{color:var(--accent);text-underline-offset:3px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.9rem}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-weight:600;font-size:.85rem;color:var(--muted)}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.case{transition:border-color .15s}.case:hover{border-color:var(--accent)}}
</style>
</head>

];

const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const fmt = s => esc(s).replace(/\(؟\)/g,'<b class="note">(؟)</b>');

function card(c){
  const names = c.clubs.map(k=>esc(k.n)).join("، ");
  const tags = `<span class="tag when">${esc(c.when)}</span>` + c.sol.map(s=>`<span class="tag">${esc(SOL[s].n)}</span>`).join("");
  const src = c.src.map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("");
  return `<article class="case">
    <div class="head">
      <div class="title">
        <h3>${names}</h3>
        <p class="meta">${esc(c.league)} · <span class="num">${esc(c.season)}</span></p>
        <div class="tags">${tags}</div>
      </div>
    </div>
    <dl class="facts">
      <div><dt>سبب عدم اللعب</dt><dd>${fmt(c.cause)}</dd></div>
      <div><dt>المباريات المتأثرة</dt><dd>${fmt(c.affected)}</dd></div>
      <div><dt>ما قررته الجهة المنظمة</dt><dd>${fmt(c.decision)}</dd></div>
      <div><dt>ماذا حدث للنادي في النهاية</dt><dd>${fmt(c.outcome)}</dd></div>
    </dl>
    <div class="src"><span>المصادر:</span>${src}</div>
  </article>`;
}

let active = "all";
function render(){
  const list = active==="all" ? CASES : CASES.filter(c=>c.sol.includes(active));
  document.getElementById("cases").innerHTML = list.map(card).join("");
  document.getElementById("count").textContent = `الحالات المعروضة: ${list.length} من ${CASES.length}`;
  document.querySelectorAll("#filters button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.k===active ? "true":"false"));
}
const PRIORITY = ["hibernate","without","forfeit"];
const used = [...PRIORITY, ...Object.keys(SOL).filter(k=>!PRIORITY.includes(k))].filter(k=>CASES.some(c=>c.sol.includes(k)));
document.getElementById("filters").innerHTML =
  `<button type="button" data-k="all">الكل</button>` + used.map(k=>`<button type="button" data-k="${k}">${esc(SOL[k].n)}</button>`).join("");
document.getElementById("filters").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  active = b.dataset.k; render();
});
render();
</script>
</body>
</html>

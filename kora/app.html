<title>تحدّي الكورة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ألعاب ألغاز كرة القدم بالعربي: الناقص 11، من اللاعب؟، شبكة الكورة، الروابط، كلمة اللاعب، وغيرها.">
<meta name="theme-color" content="#F2F4F3">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Alexandria:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: iOS-style single column (max 680px) — large title, grouped cards, bottom sheets; pitch green and gold borrowed from مركز التمرين */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface2:#F6F8F7; --fill:rgba(16,40,30,.06); --fill2:rgba(16,40,30,.10);
  --fg:#0E1A15; --fg2:rgba(14,26,21,.62); --fg3:rgba(14,26,21,.38); --sep:rgba(14,26,21,.10);
  --accent:#10654F; --accent-fg:#FFFFFF; --accent-soft:rgba(16,101,79,.10);
  --gold:#B48A2C; --gold-soft:rgba(201,162,74,.16);
  --ok:#1F9D55; --ok-fg:#FFFFFF; --near:#D9A514; --near-fg:#1A1405; --miss:#8E9692; --miss-fg:#FFFFFF; --bad:#D93A3A;
  --pitch1:#17775A; --pitch2:#136B51; --line:rgba(255,255,255,.55);
  --shadow:0 1px 2px rgba(10,30,20,.06),0 8px 24px rgba(10,30,20,.06);
  --blur:rgba(242,244,243,.82);
  --f-display:'Alexandria','Tajawal',system-ui,sans-serif; --f-body:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px; --r-sm:13px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#111614; --surface2:#1A201D; --fill:rgba(220,240,230,.07); --fill2:rgba(220,240,230,.12);
  --fg:#F3F7F5; --fg2:rgba(243,247,245,.64); --fg3:rgba(243,247,245,.38); --sep:rgba(243,247,245,.10);
  --accent:#2EA96A; --accent-fg:#04140D; --accent-soft:rgba(46,169,106,.16);
  --gold:#E6CC78; --gold-soft:rgba(230,204,120,.14);
  --ok:#2EB866; --ok-fg:#04140D; --near:#E3B523; --near-fg:#1A1405; --miss:#3B423F; --miss-fg:#F3F7F5; --bad:#F26B6B;
  --pitch1:#0F5A43; --pitch2:#0C503B; --line:rgba(255,255,255,.42);
  --shadow:none; --blur:rgba(0,0,0,.72); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111614; --surface2:#1A201D; --fill:rgba(220,240,230,.07); --fill2:rgba(220,240,230,.12);
  --fg:#F3F7F5; --fg2:rgba(243,247,245,.64); --fg3:rgba(243,247,245,.38); --sep:rgba(243,247,245,.10);
  --accent:#2EA96A; --accent-fg:#04140D; --accent-soft:rgba(46,169,106,.16);
  --gold:#E6CC78; --gold-soft:rgba(230,204,120,.14);
  --ok:#2EB866; --ok-fg:#04140D; --near:#E3B523; --near-fg:#1A1405; --miss:#3B423F; --miss-fg:#F3F7F5; --bad:#F26B6B;
  --pitch1:#0F5A43; --pitch2:#0C503B; --line:rgba(255,255,255,.42);
  --shadow:none; --blur:rgba(0,0,0,.72); color-scheme:dark;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{direction:rtl}
body{direction:rtl;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--blur)}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3,.disp{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* nav bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--blur);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:.5px solid var(--sep)}
.nav .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:36px}
.nav .t{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:2px;padding:6px 4px;min-width:64px}
.nbtn.end{justify-content:flex-end}
.nbtn svg{width:20px;height:20px}
.ibtn{width:34px;height:34px;border-radius:50%;background:var(--fill);border:0;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--f-display)}

/* home */
.hero{padding:28px 0 6px}
.hero .date{font-size:.82rem;font-weight:700;color:var(--fg2);letter-spacing:.2px}
.hero h1{font-size:2.15rem;font-weight:800;line-height:1.25;margin-top:2px}
.hero p{margin:6px 0 0;color:var(--fg2);font-size:.98rem}
.grp-t{font-size:.8rem;font-weight:800;color:var(--fg2);margin:26px 4px 8px}
.feature{display:block;width:100%;text-align:right;border:0;border-radius:24px;overflow:hidden;position:relative;padding:20px 20px 20px 116px;color:#fff;
  background:radial-gradient(420px 220px at 15% 0%,rgba(255,255,255,.16),transparent 60%),linear-gradient(160deg,#17775A,#0A3528 70%);box-shadow:var(--shadow)}
.feature .k{font-size:.78rem;font-weight:800;color:#E6CC78}
.feature h2{font-size:1.6rem;font-weight:800;margin:4px 0 4px;color:#fff}
.feature p{margin:0;color:rgba(255,255,255,.78);font-size:.92rem;max-width:34ch}
.feature .go{margin-top:14px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#0A3528;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.9rem}
.feature .mini{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:80px;aspect-ratio:68/100;border:1.5px solid rgba(255,255,255,.45);border-radius:10px;max-width:30%}
.feature .mini i{position:absolute;width:9px;height:9px;border-radius:50%;background:#E6CC78;transform:translate(-50%,-50%)}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;background:none;border:0;text-align:right;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:0;right:70px;border-top:.5px solid var(--sep)}
.app-ic{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:800;font-size:1.02rem;font-family:var(--f-display)}
.row .tx span{display:block;color:var(--fg2);font-size:.86rem;line-height:1.45}
.row .st{font-size:.76rem;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--fill);color:var(--fg2)}
.row .st.done{background:var(--accent-soft);color:var(--accent)}
.row .chev{color:var(--fg3);flex:none}
.foot{color:var(--fg3);font-size:.78rem;text-align:center;margin-top:28px;line-height:1.8}

/* generic */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin:14px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-weight:700;font-size:.88rem;color:var(--fg)}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:1rem;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--fill);color:var(--accent)}
.btn.ghost{background:none;color:var(--accent);padding:10px 12px}
.btn.danger{background:none;color:var(--bad);padding:10px 12px}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:120px}
.muted{color:var(--fg2)}
.small{font-size:.84rem}
.field{width:100%;border:0;background:var(--fill);border-radius:12px;padding:12px 14px;font-size:1rem;outline:none;color:var(--fg)}
.field:focus{box-shadow:0 0 0 2.5px var(--accent-soft) inset,0 0 0 1.5px var(--accent) inset}
.field::placeholder{color:var(--fg3)}
.lives{display:flex;gap:5px;align-items:center}
.lives i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.lives i.off{background:var(--fill2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--fill);color:var(--fg2)}
.pill.g{background:var(--gold-soft);color:var(--gold)}
.pill.a{background:var(--accent-soft);color:var(--accent)}

/* autocomplete */
.ac{position:relative}
.ac-list{margin-top:6px;background:var(--surface);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.14);overflow:hidden;max-height:260px;overflow-y:auto}
.ac-list:empty{display:none}
.ac-it{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;background:none;text-align:right;font-weight:700}
.ac-it+.ac-it{border-top:.5px solid var(--sep)}
.ac-it small{color:var(--fg2);font-weight:500;margin-inline-start:auto}
.ac-it:hover,.ac-it.hl{background:var(--fill)}
.ac-it.used{opacity:.4}

/* match header */
.match{display:flex;align-items:center;gap:10px;justify-content:space-between}
.match .tm{flex:1;text-align:center;font-weight:800;font-family:var(--f-display);font-size:.98rem;min-width:0}
.match .tm .fl{font-size:1.7rem;display:block;line-height:1.2}
.match .tm.me{color:var(--accent)}
.match .sc{font-family:var(--f-display);font-weight:800;font-size:1.7rem;direction:ltr;white-space:nowrap}
.match-sub{text-align:center;color:var(--fg2);font-size:.84rem;margin-top:6px}

/* pitch */
.pitch{position:relative;width:100%;max-width:100%;aspect-ratio:68/92;border-radius:18px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch1) 0 9.09%,var(--pitch2) 9.09% 18.18%)}
.pitch .ln{position:absolute;border:2px solid var(--line);pointer-events:none}
.pitch .mid{left:-2px;right:-2px;top:0;border-width:0 0 2px 0}
.pitch .circ{width:28%;aspect-ratio:1;border-radius:50%;left:36%;top:0;transform:translateY(-50%)}
.pitch .box{left:20%;right:20%;bottom:-2px;height:16%}
.pitch .six{left:36%;right:36%;bottom:-2px;height:6%}
.pitch .arc{width:16%;aspect-ratio:1;border-radius:50%;left:42%;bottom:12%;clip-path:inset(0 0 60% 0)}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:22%;max-width:96px;border:0;background:none;padding:0;color:#fff}
.tok .sh{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;
  background:rgba(0,0,0,.28);border:2px dashed rgba(255,255,255,.7);transition:transform .15s}
.tok.sel .sh{background:#fff;color:#0A3528;border:2px solid #E6CC78;transform:scale(1.12);box-shadow:0 0 0 4px rgba(230,204,120,.45)}
.tok.ok .sh{background:#fff;color:var(--ok);border:2px solid #fff}
.tok.rev .sh{background:rgba(255,255,255,.75);color:#5b625f;border:2px solid transparent}
.tok .nm{font-size:.7rem;font-weight:800;background:rgba(0,0,0,.5);padding:1px 7px;border-radius:7px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1px}
.tok.ok .nm,.tok.rev .nm{letter-spacing:0}
.tok .ps{font-size:.6rem;opacity:.85;font-weight:700}

/* tiles */
.tiles{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;direction:rtl}
.tile{width:34px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:1.08rem;background:var(--fill);color:var(--fg)}
.tile.empty{background:none;border:2px solid var(--fill2)}
.tile.k{background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
.tile.ok{background:var(--ok);color:var(--ok-fg)}
.tile.near{background:var(--near);color:var(--near-fg)}
.tile.miss{background:var(--miss);color:var(--miss-fg)}
.tiles.sm .tile{width:26px;height:30px;font-size:.88rem;border-radius:7px}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}

/* who table */
.mystery{display:flex;align-items:center;gap:14px}
.mystery .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(160deg,var(--pitch1),#0A3528);color:#E6CC78;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:1.8rem;flex:none}
.gtab{overflow-x:auto;margin:0 -4px;padding:0 4px}
.grow{display:grid;grid-template-columns:minmax(58px,1.15fr) repeat(5,minmax(0,1fr));gap:4px;margin-top:4px}
.grow.h div{font-size:.7rem;color:var(--fg2);font-weight:800;text-align:center;padding:2px}
.grow .nmc{font-weight:800;font-size:.78rem;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;padding:0 4px;line-height:1.3}
.cell{border-radius:10px;min-height:52px;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.66rem;font-weight:800;line-height:1.25;padding:4px 3px;background:var(--miss);color:var(--miss-fg)}
.cell .big{font-size:1.2rem;line-height:1.1}
.cell.ok{background:var(--ok);color:var(--ok-fg)}
.cell.near{background:var(--near);color:var(--near-fg)}

/* grid game */
.bx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bx .hd{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.74rem;line-height:1.3;padding:4px 2px;min-height:64px}
.bx .hd .em{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:#fff;font-family:var(--f-display);margin-bottom:3px}
.bx .cl{aspect-ratio:1;max-width:100%;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.76rem;line-height:1.3;padding:4px;color:var(--fg)}
.bx .cl.empty{color:var(--fg3);font-size:1.4rem;font-weight:500}
.bx .cl.ok{background:var(--ok);color:var(--ok-fg)}
.bx .cl.rev{background:var(--fill2);color:var(--fg2)}
.bx .cl.sel{box-shadow:0 0 0 2.5px var(--accent)}

/* career */
.path{display:flex;flex-direction:column;gap:0;position:relative;padding-inline-start:26px}
.path::before{content:"";position:absolute;right:9px;top:10px;bottom:10px;width:2px;background:var(--fill2)}
.stop{position:relative;padding:8px 0;font-weight:800;font-family:var(--f-display)}
.stop::before{content:"";position:absolute;right:-22px;top:50%;width:12px;height:12px;border-radius:50%;transform:translateY(-50%);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stop.hid{color:var(--fg3);font-weight:600}
.stop.hid::before{background:var(--fill2);box-shadow:none}
.stop .i{font-size:.72rem;color:var(--fg3);font-weight:700;margin-inline-start:6px;font-family:var(--f-body)}
.hints{display:flex;flex-wrap:wrap;gap:6px}
.wrong{display:flex;flex-wrap:wrap;gap:6px}
.wrong span{font-size:.82rem;font-weight:700;color:var(--bad);background:rgba(217,58,58,.1);border-radius:999px;padding:3px 10px;text-decoration:line-through}

/* top list */
.ans{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ans div{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:9px 10px;font-weight:800;font-size:.9rem;min-height:42px}
.ans div b{width:22px;height:22px;border-radius:50%;background:var(--fill2);color:var(--fg2);display:flex;align-items:center;justify-content:center;font-size:.72rem;flex:none;font-family:var(--f-display)}
.ans div.f{background:var(--accent-soft);color:var(--accent)}
.ans div.f b{background:var(--accent);color:var(--accent-fg)}
.ans div.m{color:var(--fg2)}
.ans div.m b{background:var(--miss);color:var(--miss-fg)}
@media(max-width:380px){.ans{grid-template-columns:1fr}}

/* result */
.result{text-align:center}
.result .em{font-size:2.6rem;line-height:1}
.result h3{font-size:1.35rem;font-weight:800;margin-top:6px}
.result p{margin:4px 0 12px;color:var(--fg2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 14px}
.stats div{background:var(--fill);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-family:var(--f-display);font-size:1.3rem;font-weight:800}
.stats span{font-size:.7rem;color:var(--fg2);font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{width:100%;max-width:680px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:8px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .25s}
.scrim.show .sheet{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 10px}
.sheet h3{font-size:1.2rem;font-weight:800;margin-bottom:8px}
.sheet ol,.sheet ul{padding-inline-start:20px;margin:6px 0;color:var(--fg2)}
.sheet li{margin:4px 0}
@media(min-width:720px){.scrim{align-items:center}.sheet{border-radius:22px}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:.9rem;opacity:0;transition:.25s;z-index:99;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- v2: shared ---------- */
.sec-t{font-size:.8rem;font-weight:800;color:var(--fg2);margin:22px 4px 8px}
.timer{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.timer.warn i{background:var(--bad)}
.big-num{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.84rem;background:var(--fill);color:var(--fg)}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.loading{text-align:center;padding:80px 10px;color:var(--fg2)}
.spin{width:34px;height:34px;border:3px solid var(--fill2);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.photo{width:110px;height:130px;border-radius:16px;object-fit:cover;object-position:top;background:var(--fill);flex:none;transition:filter .4s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv b{color:var(--fg2);font-weight:700}
.opt{display:block;width:100%;text-align:right;border:0;border-radius:14px;padding:13px 14px;background:var(--fill);font-weight:800;font-size:.98rem;color:var(--fg)}
.opt+.opt{margin-top:8px}
.opt.ok{background:var(--ok);color:var(--ok-fg)}
.opt.bad{background:var(--bad);color:#fff}
.opt:disabled{opacity:1}

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =================== أدوات عامة =================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* توحيد الكتابة العربية للمقارنة */
function norm(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[ً-ٰٟـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/گ/g,'ك').replace(/پ/g,'ب').replace(/ڤ/g,'ف').replace(/چ/g,'تش').replace(/ژ/g,'ج')
    .replace(/[\s\-_.'’"،,()]/g,'');
}
const noAl=s=>s.startsWith('ال')&&s.length>4?s.slice(2):s;
function same(a,b){const x=norm(a),y=norm(b);return !!x&&(x===y||noAl(x)===noAl(y));}
function letters(s){return [...String(s).replace(/[ً-ٰٟـ]/g,'').replace(/[\s\-_.'’"]/g,'')];}
const store={
  get(k,d){try{const v=localStorage.getItem('kora:'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('kora:'+k,JSON.stringify(v));}catch(e){}}
};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2000);}
function shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
const fmt=n=>n==null?'—':AR(n);

/* اليوم والبذور */
const START=Date.UTC(2026,0,1);
function todayKey(){const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());}
const DAY=Math.floor((todayKey()-START)/864e5);
const DAYNO=DAY+1;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickN(arr,n,r){return shuffled(arr,r).slice(0,n);}
/* بذرة لعبة: اليومية ثابتة لكل لعبة ويوم، والحرة عشوائية */
function seedFor(game,mode){return mode==='daily'?hashStr(game+':'+DAY):Math.floor(Math.random()*4e9);}
/* اختيار اليوم من قائمة: يمر على الكل قبل أن يكرر */
function dailyPick(list,salt){const n=list.length,cyc=Math.floor(DAY/n),pos=((DAY%n)+n)%n;return shuffled(list,rng(hashStr(salt)+cyc))[pos];}

async function share(text){
  text+='\n'+(location.href.split('#')[0]);
  try{await navigator.clipboard.writeText(text);toast('تم نسخ النتيجة، الصقها لأصدقائك');}
  catch(e){openSheet('<h3>انسخ نتيجتك</h3><textarea class="field" id="shareTxt" rows="7" readonly style="resize:none">'+esc(text)+'</textarea><p class="muted small">اضغط على النص مطوّلًا ثم اختر «نسخ».</p>');const ta=$('#shareTxt');if(ta){ta.focus();ta.select();}}
}

/* إحصاءات التحدي اليومي لكل لعبة */
function recordResult(game,win,score){
  const s=store.get('stats:'+game,{p:0,w:0,cur:0,best:0,last:-1});
  if(s.last===DAY)return s;
  s.p++; if(win){s.w++;s.cur=(s.last===DAY-1?s.cur:0)+1;s.best=Math.max(s.best,s.cur);}else s.cur=0;
  s.last=DAY; if(score!=null)s.score=score; store.set('stats:'+game,s); return s;
}
function statsHTML(game){
  const s=store.get('stats:'+game,{p:0,w:0,cur:0,best:0});
  return '<div class="stats num"><div><b>'+AR(s.p)+'</b><span>لعبت</span></div><div><b>'+AR(s.p?Math.round(s.w*100/s.p):0)+'٪</b><span>فوز</span></div><div><b>'+AR(s.cur)+'</b><span>سلسلة</span></div><div><b>'+AR(s.best)+'</b><span>أفضل سلسلة</span></div></div>';
}
function dayState(game,fresh){
  let st=store.get('day:'+game,null);
  if(!st||st.day!==DAY){st=Object.assign({day:DAY},fresh());}
  return st;
}
function saveDay(game,st){store.set('day:'+game,st);}
function dailyDone(id){const s=store.get('day:'+id,null);return !!(s&&s.day===DAY&&s.done);}

/* النافذة السفلية */
function openSheet(html,onOpen,opts){
  closeSheet();
  const s=document.createElement('div');s.className='scrim';s.id='scrim';
  s.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+((opts&&opts.noClose)?'':'<button class="btn sec block" style="margin-top:14px" data-close>إغلاق</button>')+'</div>';
  s.addEventListener('click',e=>{if((e.target===s&&!(opts&&opts.noClose))||e.target.closest('[data-close]'))closeSheet();});
  document.body.appendChild(s);requestAnimationFrame(()=>s.classList.add('show'));
  if(onOpen)onOpen(s);
}
function closeSheet(){const s=$('#scrim');if(s)s.remove();}
function confirmSheet(title,msg,btn,fn){
  openSheet('<h3>'+esc(title)+'</h3><p class="muted">'+esc(msg)+'</p><button class="btn block" style="background:var(--bad);color:#fff" id="cfOk">'+esc(btn)+'</button>',s=>{$('#cfOk',s).onclick=()=>{closeSheet();fn();};});
}

/* =================== البيانات =================== */
const D={P:[],byQ:{},T:{},C:{},A:{},M:[],W:{},L:[],ready:false};
const ARAB=new Set();
async function loadData(){
  if(D.ready)return;
  const r=await fetch('data/kora.json',{cache:'no-cache'});
  if(!r.ok)throw new Error('data '+r.status);
  const j=await r.json();
  D.v=j.v; D.T=j.T; D.C=j.C; D.A=j.A||{}; D.M=j.M||[]; D.W=j.W||{}; D.L=j.L||[];
  (j.arab||[]).forEach(q=>ARAB.add(q));
  D.P=j.P.map(a=>{
    const p={q:a[0],n:a[1],en:a[2],by:a[3],nat:a[4],pos:a[5],h:a[6],sl:a[7],car:a[8],nt:a[9],aw:a[10]||[],img:a[11],nat2:a[12],mgr:a[13]};
    p.clubs=new Set(p.car.map(c=>c[0]));
    p.leagues=new Set(p.car.map(c=>(D.T[c[0]]||[])[1]).filter(Boolean));
    p.awards=new Set(p.aw.map(x=>x[0]));
    p.arab=ARAB.has(p.nat);
    p.fame=p.sl+(p.arab?45:0);
    p.k=[norm(p.n),norm(p.en)];
    const w=p.n.split(/\s+/); p.last=w.length>1?w.slice(1).join(' '):p.n;
    p.kl=norm(p.last);
    p.mainClub=mainClub(p);
    return p;
  });
  D.P.forEach(p=>D.byQ[p.q]=p);
  D.famous=D.P.slice().sort((a,b)=>b.fame-a.fame);
  D.ready=true;
}
const team=q=>D.T[q]||['؟'];
const tName=q=>team(q)[0];
const cName=q=>(D.C[q]||['؟'])[0];
const flag=q=>(D.C[q]||['',''])[1]||'';
const posName=p=>p.pos||'—';
function mainClub(p){ // النادي الذي لعب له أكثر مباريات
  let best=null,bv=-1;
  for(const c of p.car){const v=(c[3]||0)+(c[5]?0:5);if(v>bv&&!c[5]){bv=v;best=c[0];}}
  return best||(p.car[0]&&p.car[0][0]);
}
function totals(p){let a=0,g=0,known=true;for(const c of p.car){if(c[3]==null)known=false;a+=c[3]||0;g+=c[4]||0;}return {apps:known?a:null,goals:known?g:null};}
function age(p){return p.by?(new Date().getFullYear()-p.by):null;}

/* بحث اللاعبين */
function findPlayers(q,limit=8,filter){
  const x=norm(q); if(x.length<2)return [];
  const out=[];
  for(const p of D.P){
    if(filter&&!filter(p))continue;
    let s=-1;
    for(const k of p.k){if(!k)continue; if(k===x)s=Math.max(s,4); else if(k.startsWith(x))s=Math.max(s,3); else if(k.includes(x))s=Math.max(s,1);}
    if(p.kl===x)s=Math.max(s,4); else if(p.kl.startsWith(x))s=Math.max(s,2.5);
    if(s>=0)out.push([s+Math.min(p.fame,300)/300,p]);
  }
  return out.sort((a,b)=>b[0]-a[0]).slice(0,limit).map(a=>a[1]);
}
function playerLine(p){return flag(p.nat)+' '+esc(p.n)+'<small>'+esc(tName(p.mainClub))+(p.by?' · '+AR(p.by):'')+'</small>';}

/* حقل البحث التلقائي */
function bindAC(input,list,onPick,opts){
  opts=opts||{};let items=[],hl=0;
  const paint=()=>{list.innerHTML=items.map((p,i)=>'<button type="button" class="ac-it'+(i===hl?' hl':'')+(opts.isUsed&&opts.isUsed(p)?' used':'')+'" data-i="'+i+'">'+playerLine(p)+'</button>').join('');};
  input.addEventListener('input',()=>{items=findPlayers(input.value,8,opts.filter);hl=0;paint();});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){hl=Math.min(hl+1,items.length-1);paint();e.preventDefault();}
    else if(e.key==='ArrowUp'){hl=Math.max(hl-1,0);paint();e.preventDefault();}
    else if(e.key==='Enter'){e.preventDefault();if(items[hl])choose(items[hl]);}
  });
  list.addEventListener('mousedown',e=>e.preventDefault());
  list.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)choose(items[+b.dataset.i]);});
  function choose(p){if(opts.isUsed&&opts.isUsed(p)){toast('استخدمت هذا اللاعب من قبل');return;}input.value='';items=[];paint();onPick(p);}
}
function acHTML(id,ph){return '<div class="ac"><input class="field" id="'+id+'" placeholder="'+esc(ph||'اكتب اسم لاعب…')+'" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><div class="ac-list" id="'+id+'L"></div></div>';}
function pickPlayerSheet(title,sub,onPick,opts){
  openSheet('<h3>'+title+'</h3>'+(sub?'<p class="muted small" style="margin:0 0 10px">'+sub+'</p>':'')+acHTML('pk'),s=>{
    const i=$('#pk',s);bindAC(i,$('#pkL',s),p=>{closeSheet();onPick(p);},opts);setTimeout(()=>i.focus(),60);
  });
}

/* =================== الفئات (أندية، دول، دوريات، جوائز) =================== */
function catTest(c){
  switch(c.k){
    case 'club':return p=>p.clubs.has(c.v);
    case 'nat':return p=>p.nat===c.v||p.nat2===c.v;
    case 'lg':return p=>p.leagues.has(c.v)&&p.nat!==c.v;
    case 'aw':return p=>p.awards.has(c.v);
    case 'cont':return p=>(D.C[p.nat]||[])[2]===c.v;
    case 'pos':return p=>p.pos===c.v;
  }
  return ()=>false;
}
function catLabel(c){
  switch(c.k){
    case 'club':return tName(c.v);
    case 'nat':return cName(c.v);
    case 'lg':return 'لعب في '+cName(c.v);
    case 'aw':return D.A[c.v]||'جائزة';
    case 'cont':return 'من '+c.v;
    case 'pos':return c.v;
  }
}
function catIcon(c){
  if(c.k==='nat')return '<span class="em" style="background:transparent;font-size:1.5rem">'+flag(c.v)+'</span>';
  if(c.k==='lg')return '<span class="em" style="background:var(--fill2);font-size:1.1rem">'+flag(c.v)+'</span>';
  if(c.k==='aw')return '<span class="em" style="background:#C9A24A">🏆</span>';
  const t=team(c.v),col=(t[4]&&t[4][0])||'#10654F';
  return '<span class="em" style="background:'+col+';color:'+(isLight(col)?'#111':'#fff')+'">'+esc((t[0]||'').replace(/^(نادي|ال)/,'').trim().charAt(0))+'</span>';
}
function catHead(c){return catIcon(c)+esc(catLabel(c));}
function isLight(hex){const h=hex.replace('#','');if(h.length<6)return false;const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (r*299+g*587+b*114)/1000>165;}
/* مجموعة الفئات المتاحة: الأندية الأكثر لاعبين، الدول، الدوريات، الجوائز */
let _cats=null;
function allCats(){
  if(_cats)return _cats;
  const club={},nat={},lg={},aw={};
  for(const p of D.P){
    if(p.fame<35)continue;
    p.clubs.forEach(c=>club[c]=(club[c]||0)+1);
    nat[p.nat]=(nat[p.nat]||0)+1;
    p.leagues.forEach(l=>{if(l!==p.nat)lg[l]=(lg[l]||0)+1;});
    p.awards.forEach(a=>{if(D.A[a])aw[a]=(aw[a]||0)+1;});
  }
  const mk=(o,k,min)=>Object.keys(o).filter(x=>o[x]>=min&&(k!=='club'||D.T[x])).map(v=>({k,v,n:o[v]}));
  // الفئات العامة: أندية ودوريات ومنتخبات يعرفها الجمهور العربي
  const POP=new Set(['England','Spain','Italy','Germany','France','Portugal','Netherlands','Turkey','Saudi Arabia','Egypt','Morocco','Tunisia','Algeria','Qatar','United Arab Emirates','Brazil','Argentina','Scotland','United States']);
  const popC=q=>POP.has((D.C[q]||[])[5]);
  const clubAll=mk(club,'club',25);
  _cats={clubAll,club:clubAll.filter(c=>popC((D.T[c.v]||[])[1])).sort((a,b)=>b.n-a.n).slice(0,48),nat:mk(nat,'nat',40).filter(c=>(D.C[c.v]||[])[5]!=='Japan'),lg:mk(lg,'lg',40).filter(c=>popC(c.v)&&!['Egypt','Morocco','Tunisia','Algeria','Argentina','Brazil','Scotland'].includes((D.C[c.v]||[])[5])),aw:mk(aw,'aw',6)};
  _cats.all=[].concat(_cats.club,_cats.nat,_cats.lg,_cats.aw);
  return _cats;
}
function catKey(c){return c.k+':'+c.v;}
function playersFor(cats,minFame){const ts=cats.map(catTest);return D.P.filter(p=>p.fame>=(minFame||0)&&ts.every(t=>t(p)));}
/* مطابقة لاعب مختلف لكل خانة */
function matchCells(sets,taken){
  const own={};const res=new Array(sets.length).fill(null);const tk=new Set(taken||[]);
  function tryCell(i,seen){for(const pid of sets[i]){if(tk.has(pid)||seen.has(pid))continue;seen.add(pid);if(own[pid]===undefined||tryCell(own[pid],seen)){own[pid]=i;res[i]=pid;return true;}}return false;}
  for(let i=0;i<sets.length;i++){if(sets[i]===null)continue;if(!tryCell(i,new Set()))return null;}
  return res;
}
/* شبكة صفوف × أعمدة قابلة للحل */
function buildGrid(r,rowsN,colsN,opt){
  opt=opt||{};const C=allCats();const minAns=opt.minAns||2,minFame=opt.minFame||40;
  const poolR=C.club,poolC=[].concat(C.club,C.nat,C.aw,C.lg);
  for(let t=0;t<6000;t++){
    const rows=pickN(poolR,rowsN,r);
    const avail=poolC.filter(c=>!rows.some(x=>catKey(x)===catKey(c)));
    const cols=pickN(avail,colsN,r);
    if(cols.filter(c=>c.k!=='club').length>2)continue;
    const sets=[];let ok=true;
    for(const a of rows){for(const b of cols){const s=playersFor([a,b],minFame).map(p=>p.q);if(s.length<minAns){ok=false;break;}sets.push(s);}if(!ok)break;}
    if(!ok)continue;
    if(!matchCells(sets))continue;
    return {rows,cols,sets};
  }
  return null;
}
function gridSets(g){const s=[];for(const a of g.rows)for(const b of g.cols)s.push(D.P.filter(p=>catTest(a)(p)&&catTest(b)(p)).map(p=>p.q));return s;}

    const keys=Object.keys(rows).map(Number).sort((a,b)=>a-b);

      const y=r===0?88:(keys.length>1?74-(ri-1)*(60/Math.max(1,keys.length-2)):50);

      const span=n===2?30:n===3?50:72;idx.forEach((pi,ci)=>{const x=n===1?50:(50+span/2-ci*(span/(n-1)));out[pi]={x,y:Math.max(12,y),i:pi};});

    const opts=[p.n,w[w.length-1],w.slice(-2).join(' '),w.slice(1).join(' ')];

    if(mode==='daily'){const m=this.todays();this.st=dayState('m11',()=>fresh(m));if(this.st.mid!==m.id)this.st=Object.assign({day:DAY},fresh(m));}
    else{let m;do{m=this.pool()[Math.floor(Math.random()*this.pool().length)];}while(this.st&&m.id===this.st.mid&&this.pool().length>1);this.st=fresh(m);}

     '<div class="hist">'+hist+'</div><div class="btns" style="margin-top:10px"><button class="btn danger" onclick="M11.giveUpAsk()">استسلام</button></div></div>';
    $('#m11f').addEventListener('submit',e=>{e.preventDefault();this.guess($('#m11in').value);});
  },
  tilesFor(g,i){
    const k=[...this.key(this.m.xi[i])],gg=[...norm(g)],disp=letters(g);
    const res=new Array(gg.length).fill('miss'),cnt={};
    k.forEach((c,j)=>{if(gg[j]!==c)cnt[c]=(cnt[c]||0)+1;});
    gg.forEach((c,j)=>{if(c===k[j])res[j]='ok';});
    gg.forEach((c,j)=>{if(res[j]!=='ok'&&cnt[c]>0){res[j]='near';cnt[c]--;}});
    const show=disp.length===gg.length?disp:gg;
    return '<div class="tiles sm">'+gg.map((c,j)=>'<div class="tile '+res[j]+'">'+esc(show[j])+'</div>').join('')+'</div>';
  },
  next(){const st=this.st,n=this.m.xi.length;for(let k=1;k<=n;k++){const j=(this.sel+k)%n;if(!st.solved[j]&&!st.fail[j])return j;}return -1;},
  checkEnd(){const st=this.st;if(this.m.xi.every((p,i)=>st.solved[i]||st.fail[i])){st.done=true;if(this.mode==='daily')recordResult('m11',Object.keys(st.solved).length===11);}},
  guess(v){

/* =================== من اللاعب؟ (Who Are Ya) =================== */
function curClub(p){
  for(let i=p.car.length-1;i>=0;i--){const c=p.car[i];if(c[2]==null&&c[1]&&c[1]>=2010)return c[0];}
  return null;
}
function isActive(p){return !!curClub(p)&&(!p.by||p.by>=1984);}
function photoURL(p,w){return p.img?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(p.img)+'?width='+(w||240):null;}

  MAX:8,

  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    if(mode==='daily'){const t=dailyPick(this.pool(),'who');this.st=dayState('who',()=>({t:t.q,g:[],done:false,win:false}));if(this.st.t!==t.q)this.st={day:DAY,t:t.q,g:[],done:false,win:false};}

/* =================== بوكس تو بوكس: شبكة الكورة =================== */
function countryOfName(en){return Object.keys(D.C).find(q=>D.C[q][5]===en);}
const GRID={
  SECS:180,
  LEAGUES:[['global','عالمي',null],['eng','إنجلترا','England'],['esp','إسبانيا','Spain'],['ita','إيطاليا','Italy'],['ksa','السعودية','Saudi Arabia']],
  make(seed,lg){
    const r=rng(seed);
    if(!lg)return buildGrid(r,3,3,{minFame:35});
    const cq=countryOfName(this.LEAGUES.find(x=>x[0]===lg)[2]);
    const C=allCats();
    const clubs=C.clubAll.filter(c=>(D.T[c.v]||[])[1]===cq&&c.n>=30);
    const nats=C.nat;
    for(let t=0;t<5000;t++){
      const rows=pickN(clubs,3,r);
      const cols=pickN(clubs.filter(c=>!rows.includes(c)).concat(nats,nats),3,r);
      if(new Set(cols.map(catKey)).size<3)continue;
      const sets=[];let ok=true;
      for(const a of rows){for(const b of cols){const s=playersFor([a,b],0).map(p=>p.q);if(s.length<1){ok=false;break;}sets.push(s);}if(!ok)break;}
      if(ok&&matchCells(sets))return {rows,cols,sets};
    }
    return buildGrid(r,3,3,{minFame:35});
  },
  start(mode,lg){
    mode=mode||this.mode||'daily';this.mode=mode;if(lg!==undefined)this.lg=lg;lg=this.lg||null;
    const key='grid'+(lg?'-'+lg:'');
    if(mode==='daily'){
      let st=store.get('day:'+key,null);
      if(!st||st.day!==DAY){const g=this.make(hashStr(key+DAY),lg);st={day:DAY,rows:g.rows,cols:g.cols,cells:{},extra:0,used:[],t0:null,done:false};}
      this.st=st;
    } else {const g=this.make(Math.floor(Math.random()*4e9),lg);this.st={rows:g.rows,cols:g.cols,cells:{},extra:0,used:[],t0:null,done:false};}
    this.key=key;this.sets=gridSets(this.st);this.draw();this.tick();
  },
  stop(){clearInterval(this._iv);},
  save(){if(this.mode==='daily'){store.set('day:'+this.key,this.st);store.set('day:grid',{day:DAY,done:this.st.done});}},
  left(){const st=this.st;if(!st.t0)return this.SECS;return Math.max(0,this.SECS-Math.floor((Date.now()-st.t0)/1000));},
  tick(){
    clearInterval(this._iv);
    this._iv=setInterval(()=>{
      if(!this.st.t0||this.st.done)return;
      const l=this.left();const el=$('#gtime');if(el)el.textContent=AR(Math.floor(l/60))+':'+AR(String(l%60).padStart(2,'0'));

  },
  finish(){const st=this.st;if(st.done)return;st.done=true;closeSheet();if(this.mode==='daily')recordResult('grid',Object.keys(st.cells).length===9);this.save();this.draw();},
  draw(){
    const st=this.st;let rev=null;

    let foot;

    else foot='<div class="card"><div class="tagrow"><div><b class="disp num" id="gtime">'+AR(Math.floor(l/60))+':'+AR(String(l%60).padStart(2,'0'))+'</b> <span class="muted small">'+(st.t0?'':'يبدأ الوقت مع أول اختيار')+'</span></div><span class="pill a">'+AR(n)+' من ٩'+(st.extra?' · إضافية '+AR(st.extra):'')+'</span></div><div class="timer" style="margin-top:8px"><i id="gbar" style="width:'+(l*100/this.SECS)+'%"></i></div><p class="muted small" style="margin:8px 0 0">بعد إكمال الشبكة استمر في ذكر لاعبين صحيحين لأي خانة لزيادة نقاطك حتى ينتهي الوقت.</p><div style="text-align:center"><button class="btn danger" onclick="GRID.finish()">إنهاء</button></div></div>';
    screen('شبكة الكورة','grid',modeSeg('GRID',this.mode)+'<div class="chips" style="margin:10px 0">'+lgs+'</div><div class="stack"><div class="card" style="padding:12px">'+h+'</div>'+foot+'</div>');
  },
  open(k){
    const st=this.st;if(st.done)return;
    if(!st.t0){st.t0=Date.now();this.save();}
    const a=st.rows[Math.floor(k/3)],b=st.cols[k%3];

  },
  guess(k,p){
    const st=this.st;if(st.done)return;

  share(){const st=this.st;let g='';for(let i=0;i<3;i++){for(let j=0;j<3;j++)g+=st.cells[i*3+j]!==undefined?'🟩':'⬜';g+='\n';}share('تحدّي الكورة · شبكة الكورة #'+DAYNO+'\n'+Object.keys(st.cells).length+'/9 · '+(Object.keys(st.cells).length+st.extra)+' إجابة\n'+g);}
};

    let top;
    if(st.done)top=resultCard({em:st.win?'🎯':'😔',title:t.n,sub:flag(t.nat)+' '+esc(cName(t.nat))+'<br>'+(st.win?'عرفته في '+AR(st.g.length)+' من '+AR(MAX)+' محاولات':'انتهت المحاولات'),daily:this.mode==='daily',game:'career',share:'CAREER.share()',again:"CAREER.start('free')",againLabel:'مسيرة أخرى'});
    else top='<div class="card"><div class="tagrow"><b class="disp">من صاحب هذه المسيرة؟</b><span class="pill num">'+AR(left)+' محاولات</span></div><p class="muted small" style="margin:4px 0 10px">عدد المحاولات = عدد الأندية، وكل تخمين خاطئ يكشف النادي التالي.</p>'+acHTML('cin')+(wrong?'<div class="wrong" style="margin-top:10px">'+wrong+'</div>':'')+'</div>';
    const lv=Object.keys(this.LV).map(k=>'<button class="chip '+(k===this.lv?'on':'')+'" onclick="CAREER.start(CAREER.mode,\''+k+'\')">'+this.LV[k][0]+'</button>').join('');

/* =================== مولّد أسئلة القوائم (لاعبون يحققون شرطًا) =================== */
function catQuestion(cats){
  const lab=cats.map(c=>{
    if(c.k==='club')return 'لعبوا لنادي '+tName(c.v);
    if(c.k==='nat')return 'من '+cName(c.v);
    if(c.k==='lg')return 'أجانب لعبوا في دوري '+cName(c.v);
    if(c.k==='aw')return 'فازوا بجائزة '+(D.A[c.v]||'');
    return catLabel(c);
  });
  return 'لاعبون '+lab.join(' و');
}
/* يرجع سؤالًا عشوائيًا: {t, cats, ans:[players sorted by fame]} */
function makeQuestion(r,opt){
  opt=opt||{};const C=allCats();const minA=opt.min||8,maxA=opt.max||400;
  for(let t=0;t<3000;t++){
    const kind=r();let cats;
    if(kind<0.35)cats=[pickN(C.club,1,r)[0]];
    else if(kind<0.7)cats=[pickN(C.club,1,r)[0],pickN(C.nat,1,r)[0]];
    else if(kind<0.85)cats=[pickN(C.club,2,r)].flat();
    else if(kind<0.93)cats=[pickN(C.lg,1,r)[0]];
    else cats=[pickN(C.aw.filter(c=>c.n>=8),1,r)[0]];
    if(cats.some(c=>!c))continue;
    const ans=playersFor(cats,opt.minFame||0).sort((a,b)=>b.fame-a.fame);
    if(ans.length<minA||ans.length>maxA)continue;
    if(opt.famousTop&&ans.slice(0,opt.famousTop).some(p=>p.fame<opt.topFame))continue;
    return {t:catQuestion(cats),cats,ans};
  }
  return null;
}

/* =================== القائمة العشرية (TenaBall) =================== */
const TENA={
  start(mode,tension){

    if(mode==='daily'){const l=dailyPick(lists,'tena');this.st=store.get('day:'+key,null);if(!this.st||this.st.day!==DAY||this.st.l!==l.id)this.st=Object.assign({day:DAY},fresh(l));}
    else{const l=lists[Math.floor(Math.random()*lists.length)];this.st=fresh(l);}
    this.key=key;this.draw();
  },
  L(){return D.L.find(x=>x.id===this.st.l);},
  lives(){return this.tension?5:3;},
  save(){if(this.mode==='daily'){store.set('day:'+this.key,this.st);store.set('day:tena',{day:DAY,done:this.st.done});}},
  draw(){
    const st=this.st,L=this.L(),n=L.a.length,left=this.lives()-st.w.length;
    const rows=L.a.map((a,i)=>{const f=st.f.includes(i);return '<div class="'+(f?'f pop':(st.done?'m':''))+'"><b class="num">'+AR(a[2]||i+1)+'</b><span style="flex:1;min-width:0">'+(f||st.done?esc(a[0]):'')+'</span>'+((f||st.done)&&a[3]!=null?'<span class="muted small num">'+AR(a[3])+'</span>':'')+'</div>';}).join('');
    let top;
    if(st.done){
      const win=st.f.length===n;
      top=resultCard({em:win?'🏆':'📋',title:win?'القائمة كاملة!':'انتهت المحاولات',sub:'وجدت '+AR(st.f.length)+' من '+AR(n)+(this.tension?' · النقاط '+AR(st.pts):''),daily:this.mode==='daily',game:'tena',share:'TENA.share()',again:"TENA.start('free')",againLabel:'قائمة أخرى'});
    } else top='<div class="card"><div class="tagrow"><span class="pill a num">'+AR(st.f.length)+' / '+AR(n)+'</span>'+(this.tension?'<span class="pill g num">×'+AR(st.mult)+' · '+AR(st.pts)+' نقطة</span>':'')+livesHTML(left,this.lives(),true)+'</div>'+
      '<form id="tf" style="display:flex;gap:8px;margin-top:12px" autocomplete="off"><input class="field" id="tin" placeholder="اكتب إجابة…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"><button class="btn" type="submit">أضف</button></form>'+
      (st.w.length?'<div class="wrong" style="margin-top:10px">'+st.w.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>':'')+'<div style="text-align:center;margin-top:6px"><button class="btn danger small" onclick="TENA.end()">استسلام وعرض الإجابات</button></div></div>';
    const modes='<div class="chips" style="margin:10px 0"><button class="chip '+(!this.tension?'on':'')+'" onclick="TENA.start(TENA.mode,false)">كلاسيكي · ٣ أرواح</button><button class="chip '+(this.tension?'on':'')+'" onclick="TENA.start(TENA.mode,true)">التوتر 🥶 · ٥ أرواح ونقاط</button></div>';
    screen('القائمة العشرية','tena',modeSeg('TENA',this.mode)+modes+'<div class="stack"><div class="card"><h2 style="font-size:1.2rem;font-weight:800">'+esc(L.t)+'</h2><div class="muted small">'+esc(L.sub||'')+'</div></div>'+top+'<div class="card"><div class="ans" style="grid-template-columns:1fr">'+rows+'</div></div></div>');
    if(!st.done)$('#tf').addEventListener('submit',e=>{e.preventDefault();this.guess($('#tin').value);});
  },
  guess(v){
    v=v.trim();if(!v)return;const st=this.st,L=this.L();
    const i=L.a.findIndex(a=>[a[0]].concat(a[1]||[]).some(x=>same(v,x)));

};

 help:'<h3>طريقة لعب «القائمة العشرية»</h3><ol><li>سؤال له قائمة مرتبة (حتى ١٠ إجابات)، مثل أكثر الأندية فوزًا ببطولة.</li><li>اكتب الإجابات بأي ترتيب، وكل إجابة صحيحة تظهر في مركزها.</li><li><b>الكلاسيكي:</b> ٣ أرواح، وكل خطأ يخسرك روحًا.</li><li><b>التوتر:</b> ٥ أرواح، والنقاط = رقم المركز × المضاعف. يبدأ المضاعف ×٥ وينقص ١ مع كل خطأ، فابدأ بالمراكز المتأخرة.</li></ol><p class="muted small">القوائم محسوبة من سجلات أبطال البطولات في ويكي بيانات ومن أرقام اللاعبين في ويكيبيديا.</p>'});

/* =================== كلمة اللاعب (Football Wordle) =================== */
const WORD={
  MAX:6,
  KB:[['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح','ج','د'],['ش','س','ي','ب','ل','ا','ت','ن','م','ك','ط'],['⌫','ظ','ز','و','ر','ذ','↵']],
  pool(){
    if(this._p)return this._p;
    const out=[];for(const p of D.famous.slice(0,350)){const w=p.n.split(/\s+/);if(w.length<2)continue;const k=norm(w[w.length-1]);if(k.length>=4&&k.length<=6&&/^[ء-ي]+$/.test(k))out.push({q:p.q,k});}
    this._valid=new Set(D.P.map(p=>{const w=p.n.split(/\s+/);return norm(w[w.length-1]);}));
    return this._p=out;
  },
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;const pool=this.pool();
    const t=mode==='daily'?dailyPick(pool,'word'):pool[Math.floor(Math.random()*pool.length)];
    const fresh=()=>({t:t.q,k:t.k,g:[],done:false,win:false});
    this.st=mode==='daily'?dayState('word',fresh):fresh();if(mode==='daily'&&this.st.t!==t.q)this.st=Object.assign({day:DAY},fresh());
    this.cur='';this.draw();this.bindKeys();
  },
  stop(){document.removeEventListener('keydown',this._kh);},
  bindKeys(){
    document.removeEventListener('keydown',this._kh);
    this._kh=e=>{if(e.ctrlKey||e.metaKey||e.altKey||$('#scrim'))return;if(e.key==='Enter'){this.key('↵');e.preventDefault();}else if(e.key==='Backspace'){this.key('⌫');e.preventDefault();}else{const c=norm(e.key);if(c.length===1&&/[ء-ي]/.test(c)){this.key(c);e.preventDefault();}}};
    document.addEventListener('keydown',this._kh);
  },
  save(){if(this.mode==='daily')saveDay('word',this.st);},
  score(g){
    const k=[...this.st.k],gg=[...g],res=new Array(gg.length).fill('miss'),cnt={};
    k.forEach((c,j)=>{if(gg[j]!==c)cnt[c]=(cnt[c]||0)+1;});
    gg.forEach((c,j)=>{if(c===k[j])res[j]='ok';});
    gg.forEach((c,j)=>{if(res[j]!=='ok'&&cnt[c]>0){res[j]='near';cnt[c]--;}});
    return res;
  },
  draw(){
    const st=this.st,L=st.k.length;
    const rows=[];for(let i=0;i<this.MAX;i++){
      const g=st.g[i];
      if(g){const r=this.score(g);rows.push('<div class="tiles">'+[...g].map((c,j)=>'<div class="tile '+r[j]+'">'+c+'</div>').join('')+'</div>');}
      else if(i===st.g.length&&!st.done){rows.push('<div class="tiles" id="wcur">'+Array.from({length:L},(_,j)=>'<div class="tile '+(this.cur[j]?'':'empty')+'">'+(this.cur[j]||'')+'</div>').join('')+'</div>');}
      else rows.push('<div class="tiles">'+Array.from({length:L},()=>'<div class="tile empty"></div>').join('')+'</div>');
    }
    const ks={};st.g.forEach(g=>{const r=this.score(g);[...g].forEach((c,j)=>{const o=ks[c];if(r[j]==='ok'||(r[j]==='near'&&o!=='ok')||!o)ks[c]=r[j];});});
    const kb='<div class="kb">'+this.KB.map(r=>'<div class="r">'+r.map(c=>'<button class="'+(c.length>1||c==='⌫'||c==='↵'?'w ':'')+(ks[c]||'')+'" onclick="WORD.key(\''+c+'\')">'+(c==='↵'?'إدخال':c==='⌫'?'حذف':c)+'</button>').join('')+'</div>').join('')+'</div>';
    const t=D.byQ[st.t];
    const res=st.done?resultCard({em:st.win?'🎉':'😔',title:t.n,sub:(st.win?'في '+AR(st.g.length)+' محاولات':'الكلمة: '+st.k),daily:this.mode==='daily',game:'word',share:'WORD.share()',again:"WORD.start('free')",againLabel:'كلمة أخرى'}):'';
    screen('كلمة اللاعب','word',modeSeg('WORD',this.mode)+'<div class="stack" style="margin-top:12px"><div class="muted small" style="text-align:center">اسم عائلة لاعب من '+AR(L)+' حروف</div><div class="wgrid">'+rows.join('')+'</div>'+res+(st.done?'':kb)+'</div>');
  },
  key(c){
    const st=this.st;if(st.done)return;const L=st.k.length;
    if(c==='⌫'){this.cur=this.cur.slice(0,-1);}
    else if(c==='↵'){
      if(this.cur.length<L){toast('الكلمة ناقصة');shake($('#wcur'));return;}
      if(!this._valid.has(this.cur)){toast('ليس اسم لاعب في قاعدتنا');shake($('#wcur'));return;}
      st.g.push(this.cur);this.cur='';
      if(st.g[st.g.length-1]===st.k){st.done=true;st.win=true;}else if(st.g.length>=this.MAX)st.done=true;
      if(st.done&&this.mode==='daily')recordResult('word',st.win);
      this.save();
    } else if(this.cur.length<L)this.cur+=c;
    this.draw();
  },
  share(){const st=this.st;share('تحدّي الكورة · كلمة اللاعب #'+DAYNO+'\n'+(st.win?st.g.length:'X')+'/'+this.MAX+'\n'+st.g.map(g=>this.score(g).map(r=>r==='ok'?'🟩':r==='near'?'🟨':'⬛').join('')).join('\n'));}
};

/* =================== فطيرة الألوان (Who Ate All the Pies) =================== */
function distKm(a,b){const R=6371,t=x=>x*Math.PI/180;const dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)));}
function bearingArrow(a,b){const t=x=>x*Math.PI/180;const y=Math.sin(t(b[1]-a[1]))*Math.cos(t(b[0])),x=Math.cos(t(a[0]))*Math.sin(t(b[0]))-Math.sin(t(a[0]))*Math.cos(t(b[0]))*Math.cos(t(b[1]-a[1]));const d=(Math.atan2(y,x)*180/Math.PI+360)%360;return ['⬆️','↗️','➡️','↘️','⬇️','↙️','⬅️','↖️'][Math.round(d/45)%8];}

  start(mode){

    this.st=mode==='daily'?dayState('pies',fresh):fresh();if(mode==='daily'&&this.st.t!==t)this.st=Object.assign({day:DAY},fresh());
    this.draw();
  },

  pie(cols){const n=cols.length;let a=0;return 'conic-gradient('+cols.map(c=>{const s=a;a+=360/n;return c+' '+s+'deg '+a+'deg';}).join(',')+')';},
  cmp(g,t){
    const G=D.T[g],T=D.T[t],out=[];
    out.push({c:G[1]===T[1]?'ok':((D.C[G[1]]||[])[2]===(D.C[T[1]]||[])[2]?'near':''),v:'<span class="big">'+flag(G[1])+'</span>'+esc(cName(G[1]))});

/* =================== اللاعب الأقرب (Contextinho) =================== */
const CTX={
  pool(){if(!this._p)this._p=D.famous.slice(0,3000);return this._p;},
  sim(a,b){
    let s=0;if(a.nat===b.nat)s+=6;else if((D.C[a.nat]||[])[2]===(D.C[b.nat]||[])[2])s+=1.5;
    a.clubs.forEach(c=>{if(b.clubs.has(c))s+=5;});a.leagues.forEach(l=>{if(b.leagues.has(l))s+=1.2;});
    if(a.pos&&a.pos===b.pos)s+=2;if(a.by&&b.by)s+=Math.max(0,3-Math.abs(a.by-b.by)/3);
    a.awards.forEach(x=>{if(b.awards.has(x))s+=1;});
    return s+Math.min(a.fame,b.fame)/400;
  },
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    const top=D.famous.slice(0,400);const t=mode==='daily'?dailyPick(top,'ctx'):top[Math.floor(Math.random()*top.length)];

    const T=D.byQ[this.st.t];
    const ranked=D.P.filter(p=>p!==T).map(p=>[this.sim(T,p),p.q]).sort((a,b)=>b[0]-a[0]);
    this.rank={};this.rank[T.q]=1;ranked.forEach((x,i)=>this.rank[x[1]]=i+2);this.N=ranked.length+1;

    else top='<div class="card"><div class="tagrow"><b class="disp">ابحث عن اللاعب السري</b><span class="pill num">'+AR(st.g.length)+' محاولة</span></div><p class="muted small" style="margin:4px 0 10px">كل تخمين يظهر ترتيبه في القرب من اللاعب السري. رقم ١ هو اللاعب نفسه.</p>'+acHTML('xin')+'<div style="text-align:center;margin-top:6px"><button class="btn danger small" onclick="CTX.giveUp()">استسلام</button></div></div>';
    const last=st.g.length&&!st.done?'<div class="card" style="text-align:center"><span class="muted small">آخر تخمين</span><div class="big-num num" style="color:'+this.color(this.rank[st.g[st.g.length-1]])+'">'+AR(this.rank[st.g[st.g.length-1]])+'</div><b>'+esc(D.byQ[st.g[st.g.length-1]].n)+'</b></div>':'';
    screen('اللاعب الأقرب','ctx',modeSeg('CTX',this.mode)+'<div class="stack" style="margin-top:12px">'+top+last+(rows?'<div class="card">'+rows+'</div>':'')+'</div>');
    if(!st.done)bindAC($('#xin'),$('#xinL'),p=>this.guess(p.q),{isUsed:p=>st.g.includes(p.q)});

/* =================== الروابط (Football Connections) =================== */
const CONN={
  make(seed){
    const r=rng(seed),C=allCats();
    const pool=[].concat(C.club,C.nat,C.aw,C.lg);
    for(let t=0;t<4000;t++){
      const cats=pickN(pool,4,r);
      if(new Set(cats.map(c=>c.k)).size<2)continue;
      const tests=cats.map(catTest);
      const groups=[];let ok=true;const used=new Set();
      for(let i=0;i<4;i++){
        // لاعبون يحققون هذه الفئة فقط دون الفئات الثلاث الأخرى
        const cand=D.famous.slice(0,2500).filter(p=>tests[i](p)&&tests.every((tt,j)=>j===i||!tt(p))&&!used.has(p.q));
        if(cand.length<4){ok=false;break;}
        const g=pickN(cand.slice(0,40),4,r);g.forEach(p=>used.add(p.q));
        groups.push({c:cats[i],p:g.map(p=>p.q),d:g.reduce((a,p)=>a+p.fame,0)});
      }
      if(!ok)continue;
      groups.sort((a,b)=>b.d-a.d); // الأسهل أولًا
      return groups;
    }
  },
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    const g=this.make(seedFor('conn',mode));
    const order=shuffled(g.flatMap(x=>x.p),rng(seedFor('conn-o',mode)));
    const fresh=()=>({g:g.map(x=>({c:x.c,p:x.p})),order,solved:[],sel:[],lives:4,hint:0,done:false});
    this.st=mode==='daily'?dayState('conn',fresh):fresh();
    this.draw();
  },
  save(){if(this.mode==='daily')saveDay('conn',this.st);},
  draw(){
    const st=this.st;
    const solved=st.solved.map(gi=>{const g=st.g[gi];return '<div class="cgrp g'+gi+' pop"><b>'+esc(catLabel(g.c))+'</b><span>'+g.p.map(q=>esc(D.byQ[q].n)).join('، ')+'</span></div>';}).join('');
    const rest=st.order.filter(q=>!st.solved.some(gi=>st.g[gi].p.includes(q)));
    const grid=st.done?'':'<div class="cg">'+rest.map(q=>'<button class="'+(st.sel.includes(q)?'sel':'')+'" onclick="CONN.tap(\''+q+'\')">'+esc(D.byQ[q].n)+'</button>').join('')+'</div>';
    let foot;
    if(st.done){const win=st.solved.length===4;foot=(win?'':st.g.map((g,gi)=>st.solved.includes(gi)?'':'<div class="cgrp g'+gi+'" style="opacity:.75"><b>'+esc(catLabel(g.c))+'</b><span>'+g.p.map(q=>esc(D.byQ[q].n)).join('، ')+'</span></div>').join(''))+resultCard({em:win?'🔗':'😔',title:win?'وجدت كل الروابط!':'انتهت المحاولات',sub:'أخطاء: '+AR(4-st.lives)+' · تلميحات: '+AR(st.hint),daily:this.mode==='daily',game:'conn',share:'CONN.share()',again:"CONN.start('free')",againLabel:'لعبة أخرى'});}
    else foot='<div class="tagrow"><span class="muted small">الأخطاء المتبقية</span>'+livesHTML(st.lives,4,true)+'</div><div class="btns"><button class="btn sec" onclick="CONN.hintMe()">تلميح</button><button class="btn sec" onclick="CONN.shuf()">خلط</button><button class="btn sec" onclick="CONN.st.sel=[];CONN.draw()">إلغاء التحديد</button><button class="btn" '+(st.sel.length!==4?'disabled':'')+' onclick="CONN.submit()">تحقّق</button></div>'+(st.hintTxt?'<div class="pill g" style="justify-self:center">💡 '+esc(st.hintTxt)+'</div>':'');
    screen('الروابط','conn',modeSeg('CONN',this.mode)+'<div class="stack" style="margin-top:12px"><div class="muted small" style="text-align:center">كوّن ٤ مجموعات من ٤ لاعبين يجمعهم شيء مشترك.</div><div>'+solved+grid+'</div>'+foot+'</div>');
  },
  tap(q){const st=this.st;if(st.sel.includes(q))st.sel=st.sel.filter(x=>x!==q);else if(st.sel.length<4)st.sel.push(q);this.draw();},
  shuf(){this.st.order=shuffled(this.st.order,Math.random);this.draw();},
  hintMe(){const st=this.st;const gi=st.g.findIndex((g,i)=>!st.solved.includes(i));if(gi<0)return;st.hint++;st.hintTxt=catLabel(st.g[gi].c);this.save();this.draw();},
  submit(){
    const st=this.st;if(st.sel.length!==4)return;
    const gi=st.g.findIndex((g,i)=>!st.solved.includes(i)&&st.sel.every(q=>g.p.includes(q)));
    if(gi>=0){st.solved.push(gi);st.sel=[];st.hintTxt=null;if(st.solved.length===4)this.end(true);}
    else{const close=st.g.some((g,i)=>!st.solved.includes(i)&&st.sel.filter(q=>g.p.includes(q)).length===3);st.lives--;toast(close?'قريب! ينقصك لاعب واحد':'ليست مجموعة');if(st.lives<=0)this.end(false);}
    this.save();this.draw();
  },
  end(win){this.st.done=true;if(this.mode==='daily')recordResult('conn',win);},
  share(){const st=this.st,e=['🟨','🟩','🟦','🟪'];share('تحدّي الكورة · الروابط #'+DAYNO+'\n'+st.solved.map(gi=>e[gi].repeat(4)).join('\n')+'\nأخطاء: '+(4-st.lives));}
};

/* =================== بنغو الكورة =================== */
const BINGO={
  make(seed){
    const r=rng(seed),C=allCats();
    const pool=[].concat(C.club,C.nat,C.aw,C.lg);
    for(let t=0;t<500;t++){
      const cats=pickN(pool,16,r);if(cats.filter(c=>c.k==='aw').length>3)continue;
      const tests=cats.map(catTest);
      const cand=D.famous.slice(0,3000).filter(p=>tests.some(t=>t(p)));
      // كل فئة يجب أن يكون لها لاعب واحد على الأقل في القائمة
      const seq=[];const cover=new Array(16).fill(0);
      for(let i=0;i<16;i++){const c=cand.filter(p=>tests[i](p));if(!c.length){seq.length=0;break;}const p=c[Math.floor(r()*Math.min(25,c.length))];if(!seq.includes(p.q))seq.push(p.q);}
      if(!seq.length)continue;
      const extra=pickN(cand.slice(0,800),40,r).map(p=>p.q).filter(q=>!seq.includes(q));
      return {cats,seq:shuffled(seq.concat(extra).slice(0,40),r)};
    }
  },
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    const b=this.make(seedFor('bingo',mode));
    const fresh=()=>({cats:b.cats,seq:b.seq,i:0,filled:{},turns:0,miss:false,wild:true,done:false});
    this.st=mode==='daily'?dayState('bingo',fresh):fresh();
    this.tests=this.st.cats.map(catTest);this.draw();
  },
  save(){if(this.mode==='daily')saveDay('bingo',this.st);},
  draw(){
    const st=this.st,p=D.byQ[st.seq[st.i]];const nf=Object.keys(st.filled).length;
    const cells=st.cats.map((c,k)=>'<button class="'+(st.filled[k]?'done':'')+'" onclick="BINGO.place('+k+')" '+(st.done||st.filled[k]?'disabled':'')+'>'+(st.filled[k]?'<span class="em">✓</span>'+esc(D.byQ[st.filled[k]].n):catIcon(c)+esc(catLabel(c)))+'</button>').join('');
    let top;
    if(st.done)top=resultCard({em:nf===16?'🎉':'🎯',title:nf===16?'بنغو! البطاقة كاملة':'انتهى اللاعبون',sub:'ملأت '+AR(nf)+' من ١٦ في '+AR(st.turns)+' دور',daily:this.mode==='daily',game:'bingo',share:'BINGO.share()',again:"BINGO.start('free')",againLabel:'بطاقة أخرى'});
    else top='<div class="pcard"><div class="mt">اللاعب '+AR(st.i+1)+' من '+AR(st.seq.length)+'</div><div class="nm">'+flag(p.nat)+' '+esc(p.n)+'</div><div class="mt">'+esc(p.pos||'')+(p.by?' · مواليد '+AR(p.by):'')+'</div><div class="btns" style="margin-top:10px;justify-content:center"><button class="btn sec" style="background:rgba(255,255,255,.15);color:#fff" onclick="BINGO.skip()">تخطٍّ</button>'+(st.wild?'<button class="btn" style="background:#E6CC78;color:#1a1405" onclick="BINGO.wildcard()">🃏 الورقة الرابحة</button>':'')+'</div></div>';
    screen('بنغو الكورة','bingo',modeSeg('BINGO',this.mode)+'<div class="stack" style="margin-top:12px">'+top+'<div class="tagrow"><span class="pill a num">'+AR(nf)+' / ١٦</span><span class="muted small">الأدوار: '+AR(st.turns)+'</span></div><div class="bb c4">'+cells+'</div></div>');
  },
  advance(){const st=this.st;st.turns++;st.i++;if(st.miss){st.miss=false;st.i++;st.turns++;toast('فاتك دور بسبب الخطأ');}if(st.i>=st.seq.length||Object.keys(st.filled).length===16)this.end();this.save();this.draw();},
  place(k){
    const st=this.st;if(st.done||st.filled[k])return;const p=D.byQ[st.seq[st.i]];
    if(this.tests[k](p)){st.filled[k]=p.q;toast('✓ صح');}else{st.miss=true;toast('✗ '+p.n+' لا يحقق '+catLabel(st.cats[k]));}
    this.advance();
  },
  skip(){const st=this.st;st.i++;if(st.i>=st.seq.length)this.end();this.save();this.draw();},
  wildcard(){const st=this.st,p=D.byQ[st.seq[st.i]];let n=0;st.cats.forEach((c,k)=>{if(!st.filled[k]&&this.tests[k](p)){st.filled[k]=p.q;n++;}});st.wild=false;toast(n?'🃏 ملأت '+n+' خانات':'🃏 لا توجد خانة مناسبة');this.advance();},
  end(){this.st.done=true;if(this.mode==='daily')recordResult('bingo',Object.keys(this.st.filled).length===16);},
  share(){const st=this.st;let s='';for(let i=0;i<16;i++){s+=st.filled[i]?'🟩':'⬜';if(i%4===3)s+='\n';}share('تحدّي الكورة · بنغو الكورة #'+DAYNO+'\n'+Object.keys(st.filled).length+'/16 في '+st.turns+' دور\n'+s);}
};

 help:'<h3>طريقة لعب «بنغو الكورة»</h3><ol><li>البطاقة فيها ١٦ خانة: أندية ومنتخبات ودوريات وجوائز.</li><li>يظهر لاعب في كل دور، ضعه في خانة واحدة يحققها.</li><li>الخطأ يفوّت عليك اللاعب التالي.</li><li>تستطيع «تخطّي» اللاعب بدون عقوبة.</li><li>🃏 <b>الورقة الرابحة</b> (مرة واحدة): تملأ كل الخانات التي يحققها اللاعب الحالي.</li><li>الهدف إكمال البطاقة بأقل عدد من الأدوار.</li></ol>'});

/* =================== الضغط العالي (Gegenpressure) =================== */
const GEGEN={
  T:10,TARGET:40,
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    const r=rng(seedFor('gegen',mode)),C=allCats();
    this.pool=[].concat(C.club,C.nat,C.lg,C.aw);
    this.r=r;
    const board=pickN(this.pool,9,r);
    const seq=pickN(D.famous.slice(0,1500),100,r).map(p=>p.q);
    this.st={board,seq,i:0,score:0,cnt:{},wild:3,started:false,done:false,lines:0};
    if(mode==='daily'){const d=store.get('day:gegen',null);if(d&&d.day===DAY&&d.done){this.st.done=true;this.st.score=d.score;}}
    this.draw();
  },
  stop(){clearInterval(this._iv);},
  begin(){this.st.started=true;this.next(true);},
  next(first){const st=this.st;if(!first)st.i++;if(st.i>=st.seq.length){this.end();return;}st.dl=Date.now()+this.T*1000;this.draw();this.loop();},
  loop(){clearInterval(this._iv);this._iv=setInterval(()=>{const l=Math.max(0,(this.st.dl-Date.now())/1000);const b=$('#ggbar');if(b)b.style.width=(l*100/this.T)+'%';if(l<=0){clearInterval(this._iv);toast('انتهى الوقت');this.next();}},100);},
  lines(){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return L.filter(l=>l.every(i=>this.st.cnt[i]));},
  clear(){
    const st=this.st,ls=this.lines();if(!ls.length)return;
    const cells=new Set(ls.flat());st.score+=ls.length*3;st.lines+=ls.length;
    cells.forEach(i=>{delete st.cnt[i];let c;do{c=this.pool[Math.floor(this.r()*this.pool.length)];}while(st.board.some(b=>catKey(b)===catKey(c)));st.board[i]=c;});
    toast('🔥 خط كامل! +'+(ls.length*3));
  },
  tap(k){
    const st=this.st;if(!st.started||st.done)return;const p=D.byQ[st.seq[st.i]];
    if(catTest(st.board[k])(p)){st.score++;st.cnt[k]=(st.cnt[k]||0)+1;this.clear();this.next();}
    else{st.score=Math.max(0,st.score-1);if(st.cnt[k])st.cnt[k]--;toast('✗ '+p.n+' لا يحقق '+catLabel(st.board[k])+' (−١)');this.next();}
  },
  skip(){this.next();},
  wildcard(){const st=this.st;if(!st.wild)return;const p=D.byQ[st.seq[st.i]];let n=0;st.board.forEach((c,k)=>{if(catTest(c)(p)){st.score++;st.cnt[k]=(st.cnt[k]||0)+1;n++;}});st.wild--;toast(n?'🃏 +'+n:'🃏 لا توجد فئة مناسبة');this.clear();this.next();},
  end(){
    const st=this.st;clearInterval(this._iv);if(st.done)return;st.done=true;
    if(this.mode==='daily'){recordResult('gegen',st.score>=this.TARGET,st.score);store.set('day:gegen',{day:DAY,done:true,score:st.score});}
    this.draw();
  },
  draw(){

    if(st.done){screen('الضغط العالي','gegen',modeSeg('GEGEN',this.mode)+'<div class="stack" style="margin-top:12px">'+resultCard({em:st.score>=this.TARGET?'🔥':'⚽',title:'نقاطك: '+AR(st.score),sub:(st.score>=this.TARGET?'تجاوزت هدف اليوم ('+AR(this.TARGET)+')':'هدف اليوم '+AR(this.TARGET)+' نقطة')+(st.lines?' · خطوط مكتملة: '+AR(st.lines):''),daily:this.mode==='daily',game:'gegen',share:'GEGEN.share()',again:"GEGEN.start('free')",againLabel:'جولة جديدة'})+'</div>');return;}
    const p=D.byQ[st.seq[st.i]];
    const cells=st.board.map((c,k)=>'<button onclick="GEGEN.tap('+k+')" class="'+(st.cnt[k]?'done':'')+'">'+catIcon(c)+esc(catLabel(c))+(st.cnt[k]?' ●':'')+'</button>').join('');
    const top=!st.started?'<div class="card result"><div class="em">⚡</div><h3>الهدف: '+AR(this.TARGET)+' نقطة</h3><p>١٠٠ لاعب، طابق كل لاعب مع فئة خلال ١٠ ثوانٍ.</p><button class="btn block" onclick="GEGEN.begin()">انطلق</button></div>':
      '<div class="pcard"><div class="tagrow"><span class="mt">النقاط '+AR(st.score)+' / '+AR(this.TARGET)+' · باقي '+AR(st.seq.length-st.i)+' لاعب</span><span class="mt">🃏 '+AR(st.wild)+'</span></div><div class="nm" style="margin-top:6px">'+flag(p.nat)+' '+esc(p.n)+'</div><div class="mt">'+esc(p.pos||'')+'</div><div class="timer" style="margin-top:10px;background:rgba(255,255,255,.2)"><i id="ggbar" style="width:100%;background:#E6CC78"></i></div><div class="btns" style="margin-top:10px;justify-content:center"><button class="btn sec" style="background:rgba(255,255,255,.15);color:#fff" onclick="GEGEN.skip()">تخطٍّ</button>'+(st.wild?'<button class="btn" style="background:#E6CC78;color:#1a1405" onclick="GEGEN.wildcard()">🃏 ورقة رابحة</button>':'')+'</div></div>';
    screen('الضغط العالي','gegen',modeSeg('GEGEN',this.mode)+'<div class="stack" style="margin-top:12px">'+top+'<div class="bb c3">'+cells+'</div></div>');
  },
  share(){share('تحدّي الكورة · الضغط العالي #'+DAYNO+'\n⚡ '+this.st.score+' نقطة'+(this.st.score>=this.TARGET?' ✅':''));}
};
registerGame({id:'gegen',name:'الضغط العالي',desc:'طابق اللاعبين بسرعة وحقق هدف اليوم',color:'linear-gradient(160deg,#F59E0B,#B45309)',ic:'⚡',obj:GEGEN,
 help:'<h3>طريقة لعب «الضغط العالي»</h3><ol><li>يظهر لاعب ومعه ١٠ ثوانٍ، اضغط على فئة يحققها من اللوحة.</li><li>كل إجابة صحيحة = نقطة وعلامة على الفئة.</li><li>أكمل صفًّا أو عمودًا أو قطرًا من العلامات لتحصل على ٣ نقاط إضافية، ثم تتبدل فئاته.</li><li>⏭️ التخطي مجاني. 🃏 ثلاث أوراق رابحة تحسب كل الفئات المناسبة للاعب دفعة واحدة.</li><li>❌ الخطأ يخصم نقطة وعلامة من الفئة. انتهاء الوقت ينقلك للاعب التالي.</li><li>الجولة ١٠٠ لاعب، وهدف اليوم ٤٠ نقطة، وبعدها استمر في رفع نتيجتك.</li></ol>'});

/* =================== كم تعرف؟ (Futbol List A) =================== */
const LISTA={
  SECS:100,
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    const seed=seedFor('lista',mode);
    const q=makeQuestion(rng(seed),{min:25,max:500,famousTop:10,topFame:60});
    this.q=q;
    this.st=mode==='daily'?dayState('lista',()=>({found:[],end:null,done:false})):{found:[],end:null,done:false};
    if(mode==='daily'&&this.st.qt&&this.st.qt!==q.t)this.st={day:DAY,found:[],end:null,done:false};
    this.st.qt=q.t;this.set=new Set(q.ans.map(p=>p.q));this.draw();
  },
  stop(){clearInterval(this._iv);},

  kick(){this.st.end=Date.now()+this.SECS*1000;this.save();this.draw();this.loop();},
  loop(){clearInterval(this._iv);this._iv=setInterval(()=>{const l=this.left();const e=$('#lt');if(e)e.textContent=AR(l);const b=$('#lbar');if(b){b.style.width=Math.min(100,l)+'%';b.parentNode.classList.toggle('warn',l<=10);}if(l<=0){clearInterval(this._iv);this.finish();}},250);},
  finish(){const st=this.st;if(st.done)return;st.done=true;if(this.mode==='daily')recordResult('lista',st.found.length>=10,st.found.length);this.save();this.draw();},
  draw(){
    const st=this.st,q=this.q;
    let body;
    if(!st.end&&!st.done){
      body='<div class="card result"><div class="em">⏱️</div><h3>كم إجابة تعرف؟</h3><p>عند الضغط على «ابدأ» يظهر السؤال ويبدأ عدّاد ١٠٠ ثانية. كل إجابة صحيحة تضيف ٥ ثوانٍ، ولا عقوبة على الخطأ.</p><button class="btn block" onclick="LISTA.kick()">ابدأ</button></div>';
    } else if(st.done){
      const miss=q.ans.filter(p=>!st.found.includes(p.q)).slice(0,12);
      body='<div class="card"><h2 style="font-size:1.1rem;font-weight:800">'+esc(q.t)+'</h2></div>'+resultCard({em:'⚽',title:'وجدت '+AR(st.found.length)+' إجابة',sub:'من أصل '+AR(q.ans.length)+' لاعبًا في قاعدة البيانات',daily:this.mode==='daily',game:'lista',share:'LISTA.share()',again:"LISTA.start('free')",againLabel:'سؤال آخر'})+
        '<div class="card"><div class="muted small" style="margin-bottom:6px">أشهر من فاتك:</div><div class="chips">'+miss.map(p=>'<span class="pill">'+esc(p.n)+'</span>').join('')+'</div></div>';
    } else {

/* =================== المفضّلة الجماهيرية (Fan Favourites) =================== */
/* بدل استطلاع ١٠٠ مشجع نستخدم شهرة اللاعب (عدد لغات ويكيبيديا التي كُتبت عنه) لتقدير نسبة من سيذكره */
function popShares(ans,N){
  const top=ans.slice(0,N),w=top.map(p=>Math.pow(p.fame,2)),s=w.reduce((a,b)=>a+b,0);
  let sh=w.map(x=>Math.max(1,Math.round(x*100/s)));
  const diff=100-sh.reduce((a,b)=>a+b,0);sh[0]+=diff;
  return top.map((p,i)=>({q:p.q,s:sh[i]}));
}
const FANS={
  N:8,
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    const q=makeQuestion(rng(seedFor('fans',mode)),{min:12,max:300,famousTop:4,topFame:80});
    this.q=q;this.board=popShares(q.ans,this.N);
    this.st=mode==='daily'?dayState('fans',()=>({f:[],w:[],done:false})):{f:[],w:[],done:false};
    this.draw();
  },
  save(){if(this.mode==='daily')saveDay('fans',this.st);},
  draw(){
    const st=this.st,left=3-st.w.length,score=this.board.filter(b=>st.f.includes(b.q)).reduce((a,b)=>a+b.s,0);
    const rows=this.board.map((b,i)=>{const f=st.f.includes(b.q),show=f||st.done;return '<div class="'+(f?'f pop':(st.done?'m':''))+'"><b class="num">'+AR(i+1)+'</b><span style="flex:1;min-width:0">'+(show?esc(D.byQ[b.q].n):'')+'</span><span class="num" style="font-family:var(--f-display)">'+(show?AR(b.s):'')+'</span></div>';}).join('');
    let top;
    if(st.done)top=resultCard({em:st.f.length===this.N?'🏆':'📣',title:'نقاطك: '+AR(score),sub:'وجدت '+AR(st.f.length)+' من '+AR(this.N)+' إجابات',daily:this.mode==='daily',game:'fans',share:'FANS.share()',again:"FANS.start('free')",againLabel:'سؤال آخر'});
    else top='<div class="card"><div class="tagrow"><span class="pill a num">'+AR(score)+' نقطة</span>'+livesHTML(left,3,true)+'</div><div style="margin-top:12px">'+answerBox('fin','من الأشهر برأيك؟')+'</div>'+(st.w.length?'<div class="wrong" style="margin-top:10px">'+st.w.map(q=>'<span>'+esc(D.byQ[q].n)+'</span>').join('')+'</div>':'')+'</div>';
    screen('المفضّلة الجماهيرية','fans',modeSeg('FANS',this.mode)+'<div class="stack" style="margin-top:12px"><div class="card"><div class="muted small">سألنا ١٠٠ مشجع أن يذكروا…</div><h2 style="font-size:1.15rem;font-weight:800">'+esc(this.q.t)+'</h2></div>'+top+'<div class="card"><div class="ans" style="grid-template-columns:1fr">'+rows+'</div></div></div>');
    if(!st.done)bindAC($('#fin'),$('#finL'),p=>this.guess(p),{isUsed:p=>st.f.includes(p.q)||st.w.includes(p.q)});
  },
  guess(p){
    const st=this.st;if(st.done)return;
    if(this.board.some(b=>b.q===p.q)){st.f.push(p.q);toast('✓ على اللوحة!');if(st.f.length===this.N)this.finish();}
    else{st.w.push(p.q);toast(this.q.ans.some(a=>a.q===p.q)?'إجابة صحيحة لكنها ليست من الأشهر':'لا يحقق السؤال');if(st.w.length>=3)this.finish();}
    this.save();this.draw();
  },
  finish(){this.st.done=true;if(this.mode==='daily')recordResult('fans',this.st.f.length===this.N);},
  share(){const st=this.st,s=this.board.filter(b=>st.f.includes(b.q)).reduce((a,b)=>a+b.s,0);share('تحدّي الكورة · المفضّلة الجماهيرية #'+DAYNO+'\n'+s+' نقطة · '+st.f.length+'/'+this.N+'\n'+this.board.map(b=>st.f.includes(b.q)?'🟩':'⬜').join(''));}
};

const MINES={
  start(mode,hard){
    mode=mode||this.mode||'daily';this.mode=mode;if(hard!==undefined)this.hard=hard;
    const r=rng(seedFor('mines',mode));

      q=makeQuestion(r,{min:14,max:400});if(!q)continue;

      const tst=q.cats.map(catTest);
      // ألغام مقنعة: لاعبون مشهورون يشاركون في جزء من الشرط
      bad=D.famous.slice(0,1500).filter(p=>!tst.every(t=>t(p))&&(tst.some(t=>t(p))||q.cats.some(c=>c.k==='club'&&p.leagues.has((D.T[c.v]||[])[1]))));

    }
    const nGood=8+Math.floor(r()*7);
    const cells=shuffled(pickN(good.slice(0,60),nGood,r).concat(pickN(bad.slice(0,200),20-nGood,r)),r).map(p=>p.q);

    this.st=mode==='daily'?dayState('mines',()=>({cells,sel:[],done:false})):{cells,sel:[],done:false};
    if(this.st.cells.length!==20)this.st.cells=cells;
    this.draw();
  },
  save(){if(this.mode==='daily')saveDay('mines',this.st);},
  draw(){
    const st=this.st,nGood=st.cells.filter(q=>this.good.has(q)).length;
    const cells=st.cells.map((q,i)=>{const p=D.byQ[q],sel=st.sel.includes(q);let cls='';if(st.done){cls=this.good.has(q)?(sel?'done':'hint'):(sel?'flash':'');}else if(sel)cls='done';return '<button class="'+cls+'" onclick="MINES.tap('+i+')" '+(st.done?'disabled':'')+'>'+(st.done&&!this.good.has(q)?'<span class="em">💣</span>':'')+esc(p.n)+'</button>';}).join('');
    let top;
    if(st.done){const hits=st.sel.filter(q=>this.good.has(q)).length,boom=st.sel.some(q=>!this.good.has(q));top=resultCard({em:boom?'💥':(hits===nGood?'🏆':'✅'),title:boom?'انفجر لغم!':(hits===nGood?'كل الإجابات صحيحة!':'نجوت'),sub:'اخترت '+AR(hits)+' صحيحة من '+AR(nGood),daily:this.mode==='daily',game:'mines',share:'MINES.share()',again:"MINES.start('free')",againLabel:'حقل آخر'});}
    else top='<div class="card"><div class="tagrow"><span class="pill a num">'+AR(st.sel.length)+' محددة</span><span class="muted small">'+(this.hard?'عدد الصحيح مخفي':'اختر '+AR(nGood)+' إجابات صحيحة · '+AR(20-nGood)+' ألغام')+'</span></div><button class="btn block" style="margin-top:10px;background:var(--bad);color:#fff" onclick="MINES.detonate()">💣 فجّر</button></div>';
    const modes='<div class="chips" style="margin:10px 0"><button class="chip '+(!this.hard?'on':'')+'" onclick="MINES.start(MINES.mode,false)">عادي</button><button class="chip '+(this.hard?'on':'')+'" onclick="MINES.start(MINES.mode,true)">صعب</button></div>';
    screen('حقل الألغام','mines',modeSeg('MINES',this.mode)+modes+'<div class="stack"><div class="card"><h2 style="font-size:1.1rem;font-weight:800">'+esc(this.q.t)+'</h2><div class="muted small">حدد كل اللاعبين الصحيحين وتجنب الألغام، ثم اضغط «فجّر».</div></div><div class="bb c4">'+cells+'</div>'+top+'</div>');
  },
  tap(i){const st=this.st;if(st.done)return;const q=st.cells[i];st.sel=st.sel.includes(q)?st.sel.filter(x=>x!==q):st.sel.concat(q);this.save();this.draw();},
  detonate(){const st=this.st;st.done=true;const boom=st.sel.some(q=>!this.good.has(q)),all=st.cells.filter(q=>this.good.has(q)).every(q=>st.sel.includes(q));if(this.mode==='daily')recordResult('mines',!boom&&all);this.save();this.draw();},
  share(){const st=this.st;share('تحدّي الكورة · حقل الألغام #'+DAYNO+'\n'+st.cells.map(q=>this.good.has(q)?(st.sel.includes(q)?'🟩':'⬜'):(st.sel.includes(q)?'💥':'⬛')).join('').replace(/(.{8})/gu,'$1'));}
};

/* =================== أدوات لوحة الخلايا السداسية =================== */
const HEX={
  ROWS:[4,5,4,5,4,5,4], // ٣١ خلية
  cells(){
    if(this._c)return this._c;const out=[];
    this.ROWS.forEach((n,r)=>{for(let c=0;c<n;c++)out.push({r,c,i:out.length});});
    out.forEach(a=>{a.nb=out.filter(b=>{
      if(b===a)return false;
      if(b.r===a.r)return Math.abs(b.c-a.c)===1;
      if(Math.abs(b.r-a.r)!==1)return false;
      return this.ROWS[a.r]===4?(b.c===a.c||b.c===a.c+1):(b.c===a.c-1||b.c===a.c);
    }).map(b=>b.i);});
    return this._c=out;
  },
  html(cls,label,onclick,width){
    const W=Math.min(width||360,560),w=Math.floor(W/5.2),h=w*1.1547;
    const cells=this.cells();
    const body=cells.map(c=>{const x=(this.ROWS[c.r]===4?w/2:0)+c.c*w*1.02,y=c.r*h*0.77;return '<button class="hx '+cls(c.i)+'" style="left:'+x+'px;top:'+y+'px" onclick="'+onclick+'('+c.i+')">'+label(c.i)+'</button>';}).join('');
    return '<div class="hexwrap"><div class="hexb" style="--hw:'+w+'px;width:'+(5*w*1.02)+'px;height:'+(6*h*0.77+h)+'px">'+body+'</div></div>';
  },
  board(r,n){
    const C=allCats();const pool=[].concat(C.club,C.nat,C.lg,C.aw);
    return pickN(pool,n||31,r);
  },
  width(){return Math.min(window.innerWidth-60,560);}
};
function shortCat(c){const l=catLabel(c);return esc(l.replace('لعب في ','دوري ').replace(/^نادي /,''));}

/* =================== خريطة الحرارة (The Heatmap) =================== */
const HEAT={
  start(mode){
    mode=mode||this.mode||'daily';this.mode=mode;
    const fresh=()=>({cats:HEX.board(rng(seedFor('heat',mode))),heat:{},used:[],score:0,moves:0,done:false});
    this.st=mode==='daily'?dayState('heat',fresh):fresh();this.sel=null;this.draw();
  },
  save(){if(this.mode==='daily')saveDay('heat',this.st);},
  draw(){
    const st=this.st,claimed=Object.keys(st.heat).length;
    const board=HEX.html(i=>{const h=st.heat[i]||0;return (this.sel===i?'sel ':'')+(h?'h'+Math.min(5,h):'');},i=>shortCat(st.cats[i]),'HEAT.pick',HEX.width());
    const dens=claimed?(Object.values(st.heat).reduce((a,b)=>a+b,0)/claimed):0;
    let top;
    if(st.done)top=resultCard({em:'🔥',title:'نقاطك: '+AR(st.score),sub:'في '+AR(st.moves)+' حركة · كثافة الحرارة '+AR(dens.toFixed(1)),daily:this.mode==='daily',game:'heat',share:'HEAT.share()',again:"HEAT.start('free')",againLabel:'لوحة جديدة'});
    else top='<div class="card"><div class="tagrow"><span class="pill a num">'+AR(st.score)+' نقطة</span><span class="muted small">'+AR(claimed)+' / ٣١ · '+AR(st.moves)+' حركة</span></div><p class="muted small" style="margin:8px 0 0">اختر خلية ثم اذكر لاعبًا يحققها. ينتشر اختيارك عبر الخلايا المتصلة التي يحققها اللاعب نفسه.</p><div style="text-align:center"><button class="btn danger small" onclick="HEAT.end()">إنهاء</button></div></div>';
    screen('خريطة الحرارة','heat',modeSeg('HEAT',this.mode)+'<div class="stack" style="margin-top:12px">'+top+'<div class="card" style="padding:10px">'+board+'</div></div>');
  },
  pick(i){
    const st=this.st;if(st.done)return;if(st.heat[i]){toast('هذه الخلية محجوزة، ابدأ من خلية فارغة');return;}
    this.sel=i;this.draw();
    pickPlayerSheet(shortCat(st.cats[i]),'اذكر لاعبًا يحقق هذه الفئة.',p=>this.play(i,p),{isUsed:p=>st.used.includes(p.q)});
  },
  play(i,p){
    const st=this.st,cells=HEX.cells();this.sel=null;
    if(!catTest(st.cats[i])(p)){toast('✗ '+p.n+' لا يحقق الفئة');st.moves++;this.save();this.draw();return;}
    st.used.push(p.q);
    const seen=new Set([i]),q=[i];
    while(q.length){const x=q.shift();for(const n of cells[x].nb){if(!seen.has(n)&&catTest(st.cats[n])(p)){seen.add(n);q.push(n);}}}
    let nw=0,re=0;seen.forEach(x=>{if(st.heat[x]){re++;}else nw++;st.heat[x]=(st.heat[x]||0)+1;});
    const pts=nw*(nw+1)/2+re;st.score+=pts;st.moves++;
    toast('🔥 '+AR(seen.size)+' خلايا · +'+AR(pts));
    if(Object.keys(st.heat).length===31)this.end();
    this.save();this.draw();
  },
  end(){const st=this.st;st.done=true;if(this.mode==='daily')recordResult('heat',Object.keys(st.heat).length===31,st.score);this.save();this.draw();},
  share(){share('تحدّي الكورة · خريطة الحرارة #'+DAYNO+'\n🔥 '+this.st.score+' نقطة في '+this.st.moves+' حركة');}
};

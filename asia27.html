<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>دوري توقّعات كأس آسيا ٢٠٢٧</title>
<meta name="theme-color" content="#0a1724">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كأس آسيا ٢٧">
<link rel="manifest" href="manifest-asia.json">
<link rel="apple-touch-icon" href="icon-saff-192.png">
<link rel="icon" type="image/png" href="icon-saff-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
/* هُوية كأس آسيا: أزرق AFC وذهبي — تمييزًا بصريًّا عن أخضر خليجي ٢٧ */
:root{
  --bg:#0a1724; --surface:#15293c; --card:#0f2132;
  --accent1:#2e8bc0; --accent2:#5fb8e8; --accent3:#061320;
  --gold:#e3b23c; --gold-soft:#f5d98b;
  --text:#e9f1f7; --muted:#8aa6bd;
  --line:rgba(255,255,255,.08);
  --ok:#34d399; --bad:#fca5a5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
*{scrollbar-width:thin;scrollbar-color:rgba(46,139,192,.55) transparent;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(46,139,192,.45);border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px 94px;}

.screen{display:none;width:100%;max-width:480px;flex-direction:column;align-items:center;gap:14px;}
.screen.active{display:flex;}

/* ---- الترويسة وتسجيل الدخول ---- */
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:2px;}
.brand-badge{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--accent1),#0b3c5d);border:2px solid var(--gold);
  box-shadow:0 8px 26px rgba(0,0,0,.45);font-size:2.1rem;}
.brand-t{font-size:1.45rem;font-weight:900;color:#fff;text-align:center;line-height:1.25;}
.brand-s{font-size:.84rem;color:var(--muted);text-align:center;line-height:1.7;}
.brand-s b{color:var(--gold-soft);}

.box{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px 18px;display:flex;flex-direction:column;gap:12px;}
.box-title{font-size:.95rem;font-weight:800;color:var(--text);}
input.field,select.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 15px;color:var(--text);font-family:inherit;font-size:1rem;outline:none;}
input.field:focus,select.field:focus{border-color:var(--accent2);}
input.field::placeholder{color:var(--muted);}
.btn{width:100%;padding:14px;border-radius:13px;border:none;font-family:inherit;font-size:1rem;
  font-weight:800;cursor:pointer;transition:opacity .2s,transform .1s;}
.btn:active:not(:disabled){transform:scale(.97);opacity:.9;}
.btn:disabled{background:#16293a!important;color:var(--muted)!important;cursor:default;}
.btn-main{background:linear-gradient(135deg,var(--accent2),var(--accent1));color:#06202f;}
.btn-gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#2a1e00;}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--line);}
.err{font-size:.82rem;color:var(--bad);text-align:center;min-height:18px;line-height:1.6;}

/* ---- شريط التنقّل ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#14304a,#050f18);
  border-top:2px solid var(--gold);box-shadow:0 -10px 30px rgba(0,0,0,.55);
  display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:50;}
.tab{flex:1;max-width:96px;background:none;border:none;color:rgba(255,255,255,.72);font-family:inherit;
  font-size:.7rem;font-weight:800;cursor:pointer;padding:7px 2px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab .ico{font-size:1.15rem;line-height:1;}
.tab.active{color:#fff;background:rgba(227,178,60,.26);}

.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.me-chip{font-size:.85rem;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:7px 14px;display:flex;align-items:center;gap:7px;cursor:pointer;}
.me-chip b{color:#fff;}
.me-chip:hover{border-color:var(--accent1);}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);font-size:1.1rem;cursor:pointer;flex-shrink:0;}
.icon-btn:hover{color:var(--text);border-color:var(--accent1);}
.icon-btn.on{border-color:var(--gold);color:var(--gold-soft);}

.section-title{width:100%;font-size:1rem;font-weight:900;color:var(--text);display:flex;
  align-items:center;justify-content:space-between;gap:8px;}
.hint{width:100%;font-size:.76rem;color:var(--muted);line-height:1.75;}
.notice{width:100%;background:rgba(227,178,60,.09);border:1px solid rgba(227,178,60,.38);
  border-radius:13px;padding:11px 13px;font-size:.78rem;color:var(--gold-soft);line-height:1.7;}
.notice.warn{background:rgba(220,55,55,.10);border-color:rgba(220,55,55,.42);color:var(--bad);}

/* ---- الشرائح ---- */
.chips{width:100%;display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:8px;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
.chips::-webkit-scrollbar{height:4px;}
.chip{flex:0 0 auto;scroll-snap-align:center;background:var(--surface);border:1px solid var(--line);
  color:var(--muted);font-family:inherit;font-size:.8rem;font-weight:800;padding:7px 14px;
  border-radius:20px;cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--accent1);border-color:var(--accent1);color:#fff;}

.sub-tabs{display:flex;gap:6px;width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:12px;padding:4px;}
.sub-tab{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-weight:800;
  font-size:.86rem;padding:9px 6px;border-radius:9px;cursor:pointer;}
.sub-tab.active{background:var(--accent1);color:#fff;}

/* ---- بطاقة المباراة ---- */
.match{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;display:flex;flex-direction:column;gap:12px;}
.match.finished{opacity:.62;}
.match.locked{border-color:rgba(255,255,255,.14);}
.match-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:.7rem;
  color:var(--muted);gap:8px;}
.hc-l{justify-self:start;}.hc-c{justify-self:center;text-align:center;}.hc-r{justify-self:end;}
.grp-badge{background:rgba(46,139,192,.3);color:#fff;border-radius:8px;padding:2px 9px;font-weight:800;white-space:nowrap;}
.status-badge{font-weight:900;white-space:nowrap;font-size:.62rem;letter-spacing:.4px;padding:3px 9px;border-radius:8px;}
.status-badge.open{background:rgba(52,211,153,.2);color:#6ee7b7;}
.status-badge.locked{background:rgba(255,255,255,.1);color:var(--muted);}
.status-badge.soon{background:rgba(255,255,255,.08);color:var(--muted);}
.status-badge.finished{background:rgba(255,255,255,.1);color:var(--muted);}
.match-meta{width:100%;font-size:.69rem;color:var(--muted);text-align:center;line-height:1.6;}
.match-meta .prov{color:var(--gold-soft);}
.teams{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.team{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0;}
.team .flagimg{width:46px;height:31px;object-fit:cover;border-radius:5px;box-shadow:0 1px 5px rgba(0,0,0,.45);}
.team .ph{width:46px;height:31px;border:1px dashed rgba(255,255,255,.2);border-radius:5px;}
.team .tname{font-size:.86rem;font-weight:800;line-height:1.3;}
.team .tslot{font-size:.72rem;font-weight:700;color:var(--muted);line-height:1.4;}
.vs{font-size:.78rem;color:var(--muted);font-weight:800;padding:0 4px;}

/* ---- مُدخل النتيجة ---- */
.stepper{display:flex;align-items:center;justify-content:center;gap:9px;}
.stp{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);font-size:1.25rem;font-weight:800;cursor:pointer;font-family:inherit;line-height:1;}
.stp:active{transform:scale(.93);}
.stp:disabled{opacity:.35;cursor:default;}
.stv{min-width:46px;text-align:center;font-size:1.5rem;font-weight:900;color:#fff;}
.pred-row{display:flex;align-items:center;justify-content:center;gap:14px;}
.pen-row{display:flex;flex-direction:column;gap:7px;background:rgba(227,178,60,.08);
  border:1px solid rgba(227,178,60,.35);border-radius:12px;padding:10px;}
.pen-lbl{font-size:.76rem;font-weight:800;color:var(--gold-soft);text-align:center;}
.pen-opts{display:flex;gap:7px;}
.pen-opt{flex:1;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--text);font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer;}
.pen-opt.on{border-color:var(--gold);background:rgba(227,178,60,.22);color:var(--gold-soft);}
.act-row{display:flex;gap:8px;}
.x2-btn{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:12px 13px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-family:inherit;
  font-size:.84rem;font-weight:900;cursor:pointer;white-space:nowrap;}
.x2-btn.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(227,178,60,.3),rgba(227,178,60,.12));color:var(--gold-soft);}
.x2-btn:disabled{opacity:.45;cursor:default;}
.save-btn{flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent2),var(--accent1));
  color:#06202f;font-family:inherit;font-size:.92rem;font-weight:900;cursor:pointer;}
.save-btn:disabled{background:#16293a;color:var(--muted);cursor:default;}
.locked-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:.86rem;}
.locked-box .lb{color:var(--muted);font-weight:800;font-size:.76rem;}
.locked-box .lv{font-weight:900;color:#fff;font-size:1rem;}
.pts-pill{font-size:.78rem;font-weight:900;padding:4px 10px;border-radius:999px;}
.pts-pill.p5{background:rgba(52,211,153,.22);color:#6ee7b7;}
.pts-pill.p3{background:rgba(46,139,192,.24);color:#9bd4f0;}
.pts-pill.p0{background:rgba(255,255,255,.08);color:var(--muted);}
.x2-tag{font-size:.68rem;font-weight:900;color:#2a1e00;background:var(--gold);border-radius:6px;padding:2px 6px;}

/* ---- توقّعات البطولة ---- */
.tour-card{width:100%;background:linear-gradient(155deg,rgba(227,178,60,.16),rgba(227,178,60,.03) 55%,rgba(255,255,255,.03));
  border:1.5px solid rgba(227,178,60,.5);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;}
.tour-card h3{font-size:1.05rem;font-weight:900;color:var(--gold-soft);}
.tour-row{display:flex;flex-direction:column;gap:6px;}
.tour-row label{font-size:.82rem;color:var(--muted);font-weight:800;display:flex;justify-content:space-between;gap:8px;}
.tour-row .pts-tag{color:var(--gold-soft);white-space:nowrap;}

/* ---- جداول ---- */
.gr-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px;display:flex;flex-direction:column;gap:8px;}
.gr-card h4{font-size:.98rem;font-weight:900;color:var(--gold-soft);}
.gr-tbl{width:100%;border-collapse:collapse;font-size:.84rem;}
.gr-tbl th{font-size:.68rem;font-weight:800;color:var(--muted);text-align:center;padding:6px 3px;border-bottom:1px solid var(--line);}
.gr-tbl th:nth-child(2){text-align:right;}
.gr-tbl td{padding:8px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);font-weight:700;}
.gr-tbl tr:last-child td{border-bottom:none;}
.gr-tbl td.gr-team{text-align:right;}
.gr-team{display:flex;align-items:center;gap:6px;font-weight:800;}
.gr-team img.flag{width:26px;height:17px;object-fit:cover;border-radius:3px;flex-shrink:0;}
.gr-tbl tr.adv td{background:rgba(52,211,153,.09);}
.gr-tbl tr.adv td:first-child{box-shadow:inset 3px 0 0 var(--ok);}
.gr-tbl tr.third td{background:rgba(227,178,60,.09);}
.gr-tbl tr.third td:first-child{box-shadow:inset 3px 0 0 var(--gold);}
.gr-tbl tr.out td{color:var(--muted);}
.gr-tbl tr.out td:first-child{box-shadow:inset 3px 0 0 #4b5563;}
.legend{display:flex;gap:13px;font-size:.72rem;color:var(--muted);flex-wrap:wrap;padding-top:3px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle;}

/* ---- الترتيب العام ---- */
.ld-row{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;padding:11px 13px;}
.ld-row.me{border-color:var(--accent1);background:rgba(46,139,192,.1);}
.ld-rank{min-width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.88rem;background:rgba(255,255,255,.07);color:var(--muted);flex-shrink:0;}
.ld-row:nth-child(1) .ld-rank{background:linear-gradient(135deg,#f5d98b,#c99700);color:#2a1e00;}
.ld-row:nth-child(2) .ld-rank{background:linear-gradient(135deg,#e2e8f0,#9aa5b1);color:#1a2430;}
.ld-row:nth-child(3) .ld-rank{background:linear-gradient(135deg,#e3b58a,#a9682f);color:#2a1400;}
.ld-name{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.ld-name .nm{font-weight:800;font-size.95rem;color:#fff;font-size:.95rem;}
.ld-name .sub{font-size:.71rem;color:var(--muted);font-weight:700;}
.ld-pts{font-weight:900;font-size:1.25rem;color:var(--gold-soft);flex-shrink:0;}
.ld-pts small{font-size:.66rem;color:var(--muted);font-weight:800;display:block;text-align:center;}

/* ---- الشجرة ---- */
.br-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px;}
.br-grid{display:flex;direction:rtl;gap:10px;min-width:100%;align-items:stretch;}
.br-col{display:flex;flex-direction:column;flex:1 1 0;min-width:150px;}
.br-col-h{text-align:center;padding:7px 0;font-weight:900;color:var(--gold-soft);font-size:.76rem;
  background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:8px;}
.br-col-body{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:9px;min-height:320px;}
.br-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px;
  display:flex;flex-direction:column;gap:4px;}
.br-meta{font-size:.6rem;color:var(--muted);font-weight:800;display:flex;justify-content:space-between;gap:6px;}
.br-meta .no{color:var(--gold-soft);}
.br-team{display:flex;align-items:center;gap:6px;padding:2px 0;min-width:0;}
.br-team img.flag{width:28px;height:19px;object-fit:cover;border-radius:3px;flex-shrink:0;}
.br-team .ph{width:28px;height:19px;flex-shrink:0;border:1px dashed rgba(255,255,255,.18);border-radius:3px;}
.br-team .nm{flex:1;font-weight:800;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.br-team .sc{font-weight:900;min-width:13px;text-align:center;font-size:.8rem;}
.br-team.tba .nm{color:var(--muted);font-weight:700;font-size:.68rem;white-space:normal;}
.br-team.win .nm,.br-team.win .sc{color:var(--gold-soft);}
.br-team.lose .nm,.br-team.lose .sc{color:var(--muted);}

/* ---- أفضل الثوالث ---- */
.tp-row{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.86rem;}
.tp-row.in{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08);}
.tp-rank{min-width:26px;font-weight:900;color:var(--muted);text-align:center;flex-shrink:0;}
.tp-row.in .tp-rank{color:var(--ok);}
.tp-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.tp-team{display:flex;align-items:center;gap:7px;font-weight:800;min-width:0;}
.tp-team img.flag{width:26px;height:17px;object-fit:cover;border-radius:3px;flex-shrink:0;}
.tp-team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tp-sub{font-size:.71rem;color:var(--muted);font-weight:700;}
.tp-stats{flex-shrink:0;text-align:left;display:flex;flex-direction:column;gap:2px;}
.tp-pts{font-weight:900;color:var(--gold-soft);font-size:.95rem;}

/* ---- القوانين ---- */
.rule-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;display:flex;flex-direction:column;gap:9px;}
.rule-card h4{font-size:.95rem;font-weight:900;color:var(--gold-soft);}
.rule-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:.86rem;
  line-height:1.65;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.rule-line:last-child{border-bottom:none;}
.rule-line .v{font-weight:900;color:var(--gold-soft);white-space:nowrap;}
.rule-p{font-size:.84rem;line-height:1.85;color:var(--text);}
.rule-p b{color:var(--gold-soft);}

/* ---- الإدارة ---- */
.admin-card{width:100%;background:rgba(220,55,55,.07);border:1.5px solid rgba(220,55,55,.35);
  border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.admin-card h4{font-size:.92rem;font-weight:900;color:var(--bad);}
.adm-grid{display:flex;align-items:center;justify-content:center;gap:10px;}

/* ---- عامّ ---- */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(14px);
  background:#0b2133;border:1px solid var(--accent1);color:var(--text);padding:12px 20px;border-radius:13px;
  font-size:.88rem;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:100;
  box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{width:100%;text-align:center;color:var(--muted);font-size:.86rem;padding:26px 10px;line-height:1.8;}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--accent2);
  border-radius:50%;animation:sp .8s linear infinite;margin:26px auto;}
@keyframes sp{to{transform:rotate(360deg)}}
img.flag{display:inline-block;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.08);object-fit:cover;}
.flagem{display:inline-block;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>

<!-- ⬇︎ تُدمَج هنا ملفّات المصدر عند البناء. لا تعدّل asia27.html مباشرة. -->
<script>
/* ===== demo-backend.js ===== */
/* ===========================================================================
 *  وضع التجربة — قاعدة بيانات وهمية في الذاكرة
 * ---------------------------------------------------------------------------
 *  يُحمَّل فقط عند إضافة ?demo=1 إلى الرابط، ويُبدِل Firebase بنسخة محليّة
 *  مؤقّتة. الغرض ثلاثة:
 *
 *  ١) تجربة التطبيق وتصويره بلا الكتابة في قاعدة البيانات الحقيقية.
 *  ٢) أن يرى اللاعب شكل التطبيق قبل البطولة ببيانات مُفترَضة.
 *  ٣) أن تُفحَص كل الحالات: مباراة انتهت، مباراة مُقفلة، مباراة بانتظار
 *     الفرق، بطاقة مستهلكة، رصيد بطاقات منتهٍ.
 *
 *  ⚠️ لا يكتب شيئًا على الشبكة إطلاقًا. كل تعديل يذهب للذاكرة ويُنسى عند
 *     تحديث الصفحة.
 * =========================================================================== */
(function (root) {
  'use strict';

  /** يبني الحالة الابتدائية للتجربة من الجدول الحقيقي. */
  function seed(schedule) {
    var teams = schedule.teams;
    var matches = schedule.matches;

    var users = {
      Mnajjar3: { name: 'Mnajjar3', ph: 'demo', champion: 'Saudi Arabia', scorer: 'سالم الدوسري', mvp: 'سالم الدوسري', gk: 'نواف العقيدي' },
      Faisal:   { name: 'فيصل', ph: 'demo', champion: 'Japan', scorer: 'تاكيفوسا كوبو', mvp: 'ريتسو دوان', gk: 'زيون سوزوكي' },
      Abdullah: { name: 'عبدالله', ph: 'demo', champion: 'Saudi Arabia', scorer: 'فراس البريكان' },
      Majed:    { name: 'ماجد', ph: 'demo', champion: 'Iran' },
      Turki:    { name: 'تركي', ph: 'demo' },
      Nawaf:    { name: 'نواف', ph: 'demo', champion: 'South Korea', scorer: 'سون هيونغ مين' }
    };
    var keys = Object.keys(users);

    // نتائج أوّل ١٤ مباراة — فيها تعادلات وفوارق، لتظهر الجداول عاملة
    var SCORES = [
      [2, 0], [1, 1], [0, 2], [3, 1], [2, 1], [1, 0], [4, 0],
      [1, 1], [2, 2], [3, 0], [0, 0], [1, 2], [2, 1], [1, 3]
    ];
    var results = {};
    SCORES.forEach(function (sc, i) {
      results[matches[i].id] = { h: sc[0], a: sc[1] };
    });

    // توقّعات: لكل لاعب نمط مختلف، وبطاقات ×٢ موزّعة
    var preds = {};
    // توليد محدَّد (لا عشوائي) حتى تتكرّر الصورة نفسها في كل تشغيل
    function pseudo(i, j) { return (i * 7 + j * 13) % 5; }
    matches.slice(0, 22).forEach(function (m, i) {
      preds[m.id] = {};
      keys.forEach(function (k, j) {
        if (pseudo(i, j) === 4) return;                  // بعضهم لم يتوقّع
        var h = pseudo(i, j) % 3;
        var a = pseudo(i, j + 2) % 3;
        var p = { h: h, a: a };
        if (m.stage !== 'group' && h === a) p.pw = (i + j) % 2 ? 'h' : 'a';
        preds[m.id][k] = p;
      });
    });
    // بطاقات ×٢: Mnajjar3 استهلك خمسًا (الحدّ)، وفيصل اثنتين
    [0, 3, 6, 9, 12].forEach(function (i) {
      if (preds[matches[i].id] && preds[matches[i].id].Mnajjar3) {
        preds[matches[i].id].Mnajjar3.x2 = true;
      }
    });
    [1, 5].forEach(function (i) {
      if (preds[matches[i].id] && preds[matches[i].id].Faisal) {
        preds[matches[i].id].Faisal.x2 = true;
      }
    });

    // نقاط إنذارات لبعض المنتخبات، ليظهر المعيار عاملًا
    var discipline = { Oman: 3, Kuwait: 7, Palestine: 5, Syria: 4 };

    return {
      users: users, predictions: preds, results: results,
      teams: {}, discipline: discipline, lots: {}
    };
  }

  /** يُنشئ مرجعًا وهميًّا يُحاكي الجزء المستخدَم من واجهة Firebase. */
  function makeRoot(state) {
    var listeners = [];   // {path, cb}

    function get(path) {
      var parts = path.split('/').filter(Boolean);
      var node = state;
      for (var i = 0; i < parts.length; i++) {
        if (node == null) return null;
        node = node[parts[i]];
      }
      return node === undefined ? null : node;
    }
    function put(path, value) {
      var parts = path.split('/').filter(Boolean);
      var node = state;
      for (var i = 0; i < parts.length - 1; i++) {
        if (node[parts[i]] == null || typeof node[parts[i]] !== 'object') node[parts[i]] = {};
        node = node[parts[i]];
      }
      if (value === null) delete node[parts[parts.length - 1]];
      else node[parts[parts.length - 1]] = value;
    }
    function fire() {
      listeners.forEach(function (l) {
        l.cb({ val: function () { return get(l.path); } });
      });
    }
    function snapOf(path) { return { val: function () { return get(path); } }; }

    function refAt(path) {
      return {
        child: function (sub) { return refAt(path ? path + '/' + sub : sub); },
        on: function (ev, cb) {
          listeners.push({ path: path, cb: cb });
          cb(snapOf(path));
        },
        once: function () { return Promise.resolve(snapOf(path)); },
        set: function (v) { put(path, v); fire(); return Promise.resolve(); },
        update: function (patch) {
          var cur = get(path) || {};
          Object.keys(patch).forEach(function (k) {
            if (patch[k] === null) delete cur[k];
            else cur[k] = patch[k];
          });
          put(path, cur); fire(); return Promise.resolve();
        },
        remove: function () { put(path, null); fire(); return Promise.resolve(); }
      };
    }
    return refAt('');
  }

  root.ASIA_DEMO = {
    /** يُنشئ الواجهة الوهمية. يُنادى من app.js عند ?demo=1 */
    create: function (schedule) {
      var state = seed(schedule);
      return { root: makeRoot(state), state: state };
    }
  };
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* ===== rules.js ===== */
/* ===========================================================================
 *  قواعد احتساب كأس آسيا ٢٠٢٧
 * ---------------------------------------------------------------------------
 *  هذا الملفّ هو **المرجع الوحيد** لكل حساب في التطبيق: النقاط، بطاقات ×٢،
 *  ترتيب المجموعات، وترتيب أفضل أربعة ثوالث.
 *
 *  وهو منقول من نسخة Swift في AsiaCup2027/Core، وكلتاهما تُختبَران على
 *  **نفس ملفّ الحالات** في AsiaCup2027/shared/rules-fixtures.json. فلو
 *  انحرفت إحداهما عن الأخرى فشل اختبارها فورًا.
 *
 *  القواعد نفسها منقولة من تطبيق خليجي ٢٧ الذي عمل فعليًا مع ٢٩ لاعبًا
 *  حتى نهاية البطولة. لم نُعد اختراع شيء.
 *
 *  يعمل في المتصفّح (window.AsiaRules) وفي node (module.exports).
 * =========================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AsiaRules = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---- نقاط المباراة ---- */

  var EXACT_POINTS = 5;        // نتيجة مطابقة تمامًا
  var DIRECTION_POINTS = 3;    // الاتجاه صحيح فقط
  var PENALTY_BONUS = 1;       // إصابة الفائز بالترجيح

  function sign(n) { return n > 0 ? 1 : (n < 0 ? -1 : 0); }

  /**
   * نقاط التوقّع قبل مضاعفة البطاقة.
   *
   * الرقمان صحيحان ← ٥ · الاتجاه صحيح فقط ← ٣ · الاتجاه خاطئ ← ٠
   * **زائد ١** إذا حُسمت المباراة بالترجيح، وتوقّع اللاعب تعادلًا، وأصاب
   * الفائز بالترجيح.
   *
   * ملاحظة على البونص: لا يُشترط أن يكون التعادل مطابقًا. من توقّع ١-١
   * وانتهت ٢-٢ بالترجيح وأصاب الفائز يأخذ ٣+١ = ٤. ومن توقّع ٢-٢ بالضبط
   * وأصاب الفائز يأخذ ٥+١ = ٦. هذا سلوك خليجي ٢٧ نفسه.
   *
   * @param {{h:number,a:number,pw?:string}} pred توقّع اللاعب
   * @param {{h:number,a:number,pw?:string}} res  النتيجة الفعلية
   * @returns {number|null} null إذا لم يوجد توقّع أو نتيجة
   */
  function points(pred, res) {
    if (!pred || !res) return null;
    var ph = Number(pred.h), pa = Number(pred.a);
    var rh = Number(res.h), ra = Number(res.a);

    var isExact = ph === rh && pa === ra;
    var base = isExact ? EXACT_POINTS
             : (sign(ph - pa) === sign(rh - ra) ? DIRECTION_POINTS : 0);

    var bonus = 0;
    var wentToPenalties = rh === ra && !!res.pw;   // تعادل + فائز بالترجيح
    if (wentToPenalties && pred.pw && ph === pa && pred.pw === res.pw) {
      bonus = PENALTY_BONUS;
    }
    return base + bonus;
  }

  /** النقاط النهائية بعد تطبيق بطاقة ×٢ إن كانت مفعّلة. */
  function score(pred, res) {
    var raw = points(pred, res);
    if (raw === null) return null;
    return pred && pred.x2 ? raw * 2 : raw;
  }

  /* ---- نقاط توقّعات البطولة الأربعة ---- */

  var CHAMPION_POINTS = 5;
  var SCORER_POINTS = 3;
  var MVP_POINTS = 3;
  var GK_POINTS = 3;

  /**
   * كل بند يُحسب فقط عندما يكون توقّع اللاعب موجودًا **و** النتيجة الفعلية
   * معروفة **و** متطابقين. فلا تنزل نقاط قبل أن تُثبَّت النتيجة.
   */
  function tournamentPoints(picks, truth) {
    if (!picks || !truth) return 0;
    var total = 0;
    if (picks.champion && truth.champion && picks.champion === truth.champion) total += CHAMPION_POINTS;
    if (picks.scorer && truth.scorer && picks.scorer === truth.scorer) total += SCORER_POINTS;
    if (picks.mvp && truth.mvp && picks.mvp === truth.mvp) total += MVP_POINTS;
    if (picks.gk && truth.gk && picks.gk === truth.gk) total += GK_POINTS;
    return total;
  }

  /* ---- بطاقات ×٢ ----
   *
   * القاعدة الصارمة المأخوذة من تجربة خليجي ٢٧:
   *   البطاقة المحفوظة في قاعدة البيانات مستهلكة نهائيًا، ولا ترجع إلى
   *   الرصيد أبدًا — لا بالضغط على الزر، ولا بتحديث التوقّع، ولا عند فشل
   *   الحفظ.
   * ولها ثلاث طبقات حماية، كلّها هنا.
   */

  var MAX_BOOSTS = 5;   // خليجي ٢٧ كان ٢ على ١٥ مباراة؛ وهنا ٥١ مباراة

  /**
   * البطاقات المحفوظة فعليًا في قاعدة البيانات. هي المرجع عند الحفظ.
   * @param {Object} preds {معرّف المباراة: {مفتاح اللاعب: توقّع}}
   */
  function savedBoostCount(preds, playerKey, exceptMatchId) {
    var n = 0;
    for (var mid in preds) {
      if (!Object.prototype.hasOwnProperty.call(preds, mid)) continue;
      if (mid === exceptMatchId) continue;
      var p = preds[mid] && preds[mid][playerKey];
      if (p && p.x2) n++;
    }
    return n;
  }

  /**
   * الطبقة الأولى: العدّ المعروض يشمل المسوّدات التي لم تُحفظ بعد.
   * بدونها يستطيع اللاعب تفعيل ×٢ على عشر مباريات ثم حفظها كلها فيتجاوز الحد.
   *
   * اتجاه واحد: المسوّدة **تزيد** العدد فقط، ولا تُلغي بطاقة محفوظة أبدًا.
   */
  function displayedBoostCount(preds, playerKey, drafts, exceptMatchId) {
    drafts = drafts || {};
    var ids = {};
    for (var a in preds) if (Object.prototype.hasOwnProperty.call(preds, a)) ids[a] = 1;
    for (var b in drafts) if (Object.prototype.hasOwnProperty.call(drafts, b)) ids[b] = 1;

    var n = 0;
    for (var mid in ids) {
      if (mid === exceptMatchId) continue;
      var saved = !!(preds[mid] && preds[mid][playerKey] && preds[mid][playerKey].x2);
      var draft = !!(drafts[mid] && drafts[mid].x2);
      if (saved || draft) n++;
    }
    return n;
  }

  /** كم بطاقة بقيت للاعب بحسب ما يُعرض في الواجهة؟ */
  function remainingBoosts(preds, playerKey, drafts) {
    return Math.max(0, MAX_BOOSTS - displayedBoostCount(preds, playerKey, drafts));
  }

  /** هل البطاقة محفوظة فعلًا على هذه المباراة؟ (محفوظة = مستهلكة نهائيًا) */
  function isBoostLocked(preds, matchId, playerKey) {
    return !!(preds[matchId] && preds[matchId][playerKey] && preds[matchId][playerKey].x2);
  }

  /**
   * الطبقة الثانية: ماذا نكتب في حقل x2 عند الحفظ؟
   * @returns {boolean|null} null تعني أن اللاعب طلب بطاقة واستنفد رصيده،
   *   فيجب رفض الطلب وتنبيهه.
   */
  function resolveBoostOnSave(preds, matchId, playerKey, requested) {
    // محفوظة مسبقًا ⇒ تُكتب دائمًا، حتى لا يُلغيها تحديث التوقّع.
    if (isBoostLocked(preds, matchId, playerKey)) return true;
    if (!requested) return false;
    // تحقّق أخير على المحفوظ لا على المعروض.
    if (savedBoostCount(preds, playerKey, matchId) >= MAX_BOOSTS) return null;
    return true;
  }

  /**
   * الطبقة الثالثة (الحارس الأخير): تطبيق الحدّ على بيانات واردة.
   *
   * من فعّل ×٢ على أكثر من MAX_BOOSTS مباراة تُحتسب له أوّل البطاقات فقط
   * — **الأقدم حسب موعد انطلاق المباراة** — ويُلغى الزائد.
   *
   * يعدّل preds في مكانها (كما يفعل خليجي ٢٧) ويُرجع قائمة ما أُلغي.
   * @param {Array} matches مباريات البطولة، لمعرفة موعد الانطلاق
   * @returns {Array<{playerKey:string, matchId:string}>}
   */
  function applyBoostCap(preds, matches) {
    // ترتيب المباريات: الأقدم موعدًا، وعند التساوي يُحسم بالرقم الرسمي
    // حتى يكون الترتيب محدَّدًا لا عشوائيًا.
    var order = {};
    matches.slice().sort(function (x, y) {
      if (x.kickoffMs !== y.kickoffMs) return x.kickoffMs - y.kickoffMs;
      return x.n - y.n;
    }).forEach(function (m, i) { order[m.id] = i; });

    var byPlayer = {};
    for (var mid in preds) {
      if (!Object.prototype.hasOwnProperty.call(preds, mid)) continue;
      var byKey = preds[mid];
      for (var key in byKey) {
        if (!Object.prototype.hasOwnProperty.call(byKey, key)) continue;
        if (byKey[key] && byKey[key].x2) {
          (byPlayer[key] = byPlayer[key] || []).push(mid);
        }
      }
    }

    var cancelled = [];
    Object.keys(byPlayer).forEach(function (key) {
      var ids = byPlayer[key];
      if (ids.length <= MAX_BOOSTS) return;
      ids.sort(function (x, y) {
        // مباراة غير موجودة في الجدول تُدفع إلى الآخر بدل أن تنهار المقارنة.
        var ox = order[x] === undefined ? Infinity : order[x];
        var oy = order[y] === undefined ? Infinity : order[y];
        if (ox !== oy) return ox - oy;
        return x < y ? -1 : (x > y ? 1 : 0);
      });
      ids.slice(MAX_BOOSTS).forEach(function (mid) {
        preds[mid][key].x2 = false;   // لا تُحسب مضاعفة في أيّ شاشة أو ملصق
        cancelled.push({ playerKey: key, matchId: mid });
      });
    });

    cancelled.sort(function (x, y) {
      if (x.playerKey !== y.playerKey) return x.playerKey < y.playerKey ? -1 : 1;
      var ox = order[x.matchId] === undefined ? Infinity : order[x.matchId];
      var oy = order[y.matchId] === undefined ? Infinity : order[y.matchId];
      return ox - oy;
    });
    return cancelled;
  }

  /* ---- ترتيب المجموعات ----
   *
   * الدرس المكتوب في تعليقات خليجي ٢٧، وننقله كما هو:
   * لا تُدخل الترجيح اليدوي داخل دالة المقارنة. لو فعلت، صارت المقارنة غير
   * متعدّية فيخرج ترتيب غير محدَّد:
   *     عُمان قبل العراق باللعب النظيف،
   *     والعراق قبل الكويت أبجديًا،
   *     والكويت قبل عُمان أبجديًا!
   * الحل: رتّب بالمعايير الرقمية أولًا، ثم أعد ترتيب المنتخبات المذكورة في
   * القائمة اليدوية داخل المواضع التي تحتلّها هي نفسها فقط.
   */

  function newRow(team, group) {
    return { team: team, group: group || '', played: 0, won: 0, drawn: 0, lost: 0,
             goalsFor: 0, goalsAgainst: 0, points: 0, disciplinary: 0, gd: 0 };
  }

  /**
   * جدول مجموعة واحدة مرتَّبًا بالكامل.
   * @param {Object} opts {group, teams, matches, results, disciplinary, lotsOrder}
   */
  function groupTable(opts) {
    var group = opts.group;
    var teams = opts.teams;
    var results = opts.results || {};
    var disciplinary = opts.disciplinary || {};
    var lotsOrder = opts.lotsOrder || [];

    var rows = {};
    teams.forEach(function (t) {
      rows[t] = newRow(t, group);
      rows[t].disciplinary = disciplinary[t] || 0;
    });

    var groupMatches = (opts.matches || []).filter(function (m) {
      return m.stage === 'group' && m.group === group;
    });

    var played = {};
    groupMatches.forEach(function (m) {
      var r = results[m.id];
      if (!r) return;
      var home = rows[m.home], away = rows[m.away];
      if (!home || !away) return;
      played[m.id] = r;

      var hg = Number(r.h !== undefined ? r.h : r[0]);
      var ag = Number(r.a !== undefined ? r.a : r[1]);

      home.played++; away.played++;
      home.goalsFor += hg; home.goalsAgainst += ag;
      away.goalsFor += ag; away.goalsAgainst += hg;
      if (hg > ag)      { home.won++;  home.points += 3; away.lost++; }
      else if (hg < ag) { away.won++;  away.points += 3; home.lost++; }
      else              { home.drawn++; away.drawn++; home.points++; away.points++; }
    });

    var list = teams.map(function (t) { return rows[t]; });
    list.forEach(function (r) { r.gd = r.goalsFor - r.goalsAgainst; });
    return sortGroup(list, groupMatches, played, lotsOrder);
  }

  /** نقاط، ثم فضّ التساوي بالمواجهات المباشرة بشكل تكراري. */
  function sortGroup(rows, groupMatches, results, lotsOrder) {
    var byPoints = rows.slice().sort(function (x, y) { return y.points - x.points; });
    var out = [], i = 0;
    while (i < byPoints.length) {
      var j = i;
      while (j + 1 < byPoints.length && byPoints[j + 1].points === byPoints[i].points) j++;
      if (j === i) out.push(byPoints[i]);
      else out = out.concat(rankTied(byPoints.slice(i, j + 1), groupMatches, results, lotsOrder));
      i = j + 1;
    }
    return out;
  }

  /**
   * فضّ التساوي بالمواجهة المباشرة، بشكل تكراري.
   *
   * نقاط المواجهات المباشرة بين المتساويين، ثم فرق الأهداف فيها، ثم الأهداف
   * المسجّلة فيها. ومن بقي متساويًا بعدها يُعاد تجزئته وتُطبَّق القاعدة عليه
   * من جديد بمبارياته وحده. وإن لم تفصل المواجهة المباشرة بين الجميع إطلاقًا،
   * انتقلنا إلى المعايير العامة.
   */
  function rankTied(tied, groupMatches, results, lotsOrder) {
    if (tied.length <= 1) return tied.slice();

    var names = {};
    tied.forEach(function (r) { names[r.team] = 1; });
    var h2h = {};
    tied.forEach(function (r) { h2h[r.team] = { points: 0, gf: 0, ga: 0 }; });

    groupMatches.forEach(function (m) {
      var r = results[m.id];
      if (!r) return;
      if (!names[m.home] || !names[m.away]) return;
      var hg = Number(r.h !== undefined ? r.h : r[0]);
      var ag = Number(r.a !== undefined ? r.a : r[1]);
      var home = h2h[m.home], away = h2h[m.away];
      home.gf += hg; home.ga += ag;
      away.gf += ag; away.ga += hg;
      if (hg > ag)      home.points += 3;
      else if (hg < ag) away.points += 3;
      else            { home.points++; away.points++; }
    });
    Object.keys(h2h).forEach(function (t) { h2h[t].gd = h2h[t].gf - h2h[t].ga; });

    var sorted = tied.slice().sort(function (x, y) {
      var a = h2h[x.team], b = h2h[y.team];
      if (a.points !== b.points) return b.points - a.points;
      if (a.gd !== b.gd) return b.gd - a.gd;
      if (a.gf !== b.gf) return b.gf - a.gf;
      return 0;   // متساويان تمامًا: نحسمه في مرحلة لاحقة لا هنا
    });

    // جمّع من بقي متساويًا تمامًا في إحصاء المواجهة المباشرة
    var buckets = [], i = 0;
    while (i < sorted.length) {
      var j = i;
      while (j + 1 < sorted.length) {
        var a = h2h[sorted[j].team], b = h2h[sorted[j + 1].team];
        if (a.points === b.points && a.gd === b.gd && a.gf === b.gf) j++;
        else break;
      }
      buckets.push(sorted.slice(i, j + 1));
      i = j + 1;
    }

    // لم تفصل المواجهة المباشرة بين أيّ اثنين ⇒ المعايير العامة
    if (buckets.length === 1 && buckets[0].length === tied.length) {
      return rankByOverall(tied, lotsOrder);
    }

    var out = [];
    buckets.forEach(function (b) {
      out = out.concat(rankTied(b, groupMatches, results, lotsOrder));
    });
    return out;
  }

  /**
   * المعايير العامة: فرق الأهداف الكلي، ثم الأهداف المسجّلة، ثم نقاط
   * الإنذارات (الأقلّ أفضل)، ثم القرعة، وإلّا أبجديًا ليكون الناتج محدَّدًا.
   */
  function rankByOverall(rows, lotsOrder) {
    var sorted = rows.slice().sort(function (x, y) {
      if (x.gd !== y.gd) return y.gd - x.gd;
      if (x.goalsFor !== y.goalsFor) return y.goalsFor - x.goalsFor;
      if (x.disciplinary !== y.disciplinary) return x.disciplinary - y.disciplinary;
      return x.team < y.team ? -1 : (x.team > y.team ? 1 : 0);
    });
    return applyLots(sorted, lotsOrder);
  }

  /**
   * يطبّق الترجيح اليدوي (القرعة) بين من تساوى في كل المعايير الرقمية فقط،
   * ودون المساس بترتيب غيره — فتبقى المقارنة متعدّية.
   */
  function applyLots(sorted, lotsOrder) {
    if (!lotsOrder || !lotsOrder.length) return sorted;
    var result = sorted.slice();
    var i = 0;
    while (i < result.length) {
      var j = i;
      while (j + 1 < result.length &&
             result[j + 1].points === result[i].points &&
             result[j + 1].gd === result[i].gd &&
             result[j + 1].goalsFor === result[i].goalsFor &&
             result[j + 1].disciplinary === result[i].disciplinary) j++;
      if (j > i) {
        var slots = [], picks = [];
        for (var k = i; k <= j; k++) {
          if (lotsOrder.indexOf(result[k].team) >= 0) { slots.push(k); picks.push(result[k]); }
        }
        if (picks.length > 1) {
          picks.sort(function (x, y) {
            return lotsOrder.indexOf(x.team) - lotsOrder.indexOf(y.team);
          });
          slots.forEach(function (slot, idx) { result[slot] = picks[idx]; });
        }
      }
      i = j + 1;
    }
    return result;
  }

  /* ---- أفضل أربعة أصحاب مركز ثالث ----
   *
   * منطق جديد لا وجود له في خليجي ٢٧. وفرق جوهري عن ترتيب المجموعة: أصحاب
   * المراكز الثالثة من مجموعات مختلفة، فلا مواجهة مباشرة بينهم، فالمعايير
   * كلّها عامة من البداية.
   */

  var THIRD_PLACE_QUALIFY = 4;

  /** ترتيب أصحاب المراكز الثالثة من الأفضل إلى الأسوأ. */
  function rankThirdPlaced(rows, lotsOrder) {
    var list = rows.map(function (r) {
      var c = newRow(r.team, r.group);
      c.played = r.played === undefined ? 3 : r.played;
      c.points = r.points;
      c.goalsFor = r.goalsFor;
      c.goalsAgainst = r.goalsAgainst;
      c.disciplinary = r.disciplinary || 0;
      c.gd = c.goalsFor - c.goalsAgainst;
      return c;
    });
    var sorted = list.sort(function (x, y) {
      if (x.points !== y.points) return y.points - x.points;
      if (x.gd !== y.gd) return y.gd - x.gd;
      if (x.goalsFor !== y.goalsFor) return y.goalsFor - x.goalsFor;
      if (x.disciplinary !== y.disciplinary) return x.disciplinary - y.disciplinary;
      // تساوٍ تام: بمفتاح المجموعة ثم الاسم حتى يكون الناتج محدَّدًا لا
      // عشوائيًا، ثم تأتي القرعة فتصحّحه.
      if (x.group !== y.group) return x.group < y.group ? -1 : 1;
      return x.team < y.team ? -1 : (x.team > y.team ? 1 : 0);
    });
    return applyLots(sorted, lotsOrder || []);
  }

  /** المتأهّلون الأربعة فقط. */
  function qualifiedThirdPlaced(rows, lotsOrder) {
    return rankThirdPlaced(rows, lotsOrder).slice(0, THIRD_PLACE_QUALIFY);
  }

  /* ---- حالة المباراة ---- */

  /**
   * منقولة من statusOf في خليجي ٢٧:
   * دخلت نتيجتها ⇒ انتهت · انطلقت الصافرة ⇒ مُقفلة · مباراة إقصائية لم
   * يتأكّد طرفاها ⇒ بانتظار الفرق · غير ذلك ⇒ مفتوحة.
   */
  function matchStatus(opts) {
    if (opts.result) return 'finished';
    if (opts.now >= opts.kickoffMs) return 'locked';
    if (opts.isKnockout && !(opts.homeResolved && opts.awayResolved)) return 'awaitingTeams';
    return 'open';
  }

  function canSave(status) { return status === 'open'; }

  /** الفائز بالترجيح إلزامي إذا كانت المباراة إقصائية وتوقّع اللاعب تعادلًا. */
  function requiresPenaltyWinner(isKnockout, pred) {
    return !!isKnockout && Number(pred.h) === Number(pred.a);
  }

  function isValidPrediction(isKnockout, pred) {
    var h = Number(pred.h), a = Number(pred.a);
    if (!isFinite(h) || !isFinite(a)) return false;
    if (h < 0 || a < 0 || h > 30 || a > 30) return false;
    if (requiresPenaltyWinner(isKnockout, pred) && !pred.pw) return false;
    return true;
  }

  /* ---- جدول الترتيب العام ----
   *
   * نقاط اللاعب = مجموع نقاط مبارياته (بعد مضاعفة البطاقات) + نقاط توقّعات
   * البطولة الأربعة.
   *
   * وتوقّع التشكيلة الأساسية **لا يدخل** في الحساب إطلاقًا: تُعرض نتائجه
   * لوحدها، لأنه لم يُتَح للجميع، وحسابه قلب الترتيب في خليجي ٢٧.
   */
  function leaderboard(opts) {
    var players = opts.players || [];
    var preds = opts.preds || {};
    var results = opts.results || {};
    var truth = opts.truth || {};

    var rows = {};
    players.forEach(function (p) {
      rows[p.key] = { key: p.key, name: p.name, matchPoints: 0, tournamentPoints: 0,
                      scoredMatches: 0, exactHits: 0, boostsUsed: 0, total: 0 };
    });

    for (var mid in preds) {
      if (!Object.prototype.hasOwnProperty.call(preds, mid)) continue;
      var byKey = preds[mid];
      for (var key in byKey) {
        if (!Object.prototype.hasOwnProperty.call(byKey, key)) continue;
        var row = rows[key];
        if (!row) continue;              // توقّع لمفتاح بلا لاعب مسجَّل
        var pred = byKey[key];
        // البطاقة تُعدّ مستهلكة فور حفظها، لا بعد انتهاء المباراة.
        if (pred && pred.x2) row.boostsUsed++;
        var res = results[mid];
        if (!res) continue;
        row.matchPoints += score(pred, res);
        row.scoredMatches++;
        if (Number(pred.h) === Number(res.h) && Number(pred.a) === Number(res.a)) {
          row.exactHits++;
        }
      }
    }

    players.forEach(function (p) {
      var row = rows[p.key];
      if (row) row.tournamentPoints = tournamentPoints(p.picks || {}, truth);
    });

    var list = Object.keys(rows).map(function (k) {
      var r = rows[k];
      r.total = r.matchPoints + r.tournamentPoints;
      return r;
    });

    // المجموع، ثم النتائج المطابقة تمامًا، ثم الاسم حتى يكون محدَّدًا.
    return list.sort(function (x, y) {
      if (x.total !== y.total) return y.total - x.total;
      if (x.exactHits !== y.exactHits) return y.exactHits - x.exactHits;
      return x.name < y.name ? -1 : (x.name > y.name ? 1 : 0);
    });
  }

  /* ---- التنسيق العربي ---- */

  var AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';

  /** يحوّل الأرقام الإنجليزية إلى عربية-هندية: 12 ← ١٢ */
  function arNum(n) {
    return String(n).replace(/[0-9]/g, function (d) { return AR_DIGITS[+d]; });
  }

  /** ٠ ← «لا نقاط» · ١ ← «نقطة» · ٢ ← «نقطتان» · ٥ ← «٥ نقاط» */
  function arPoints(n) {
    if (n === 0) return 'لا نقاط';
    if (n === 1) return 'نقطة';
    if (n === 2) return 'نقطتان';
    return arNum(n) + (n >= 3 && n <= 10 ? ' نقاط' : ' نقطة');
  }

  return {
    // نقاط المباراة
    EXACT_POINTS: EXACT_POINTS,
    DIRECTION_POINTS: DIRECTION_POINTS,
    PENALTY_BONUS: PENALTY_BONUS,
    points: points,
    score: score,
    // توقّعات البطولة
    CHAMPION_POINTS: CHAMPION_POINTS,
    SCORER_POINTS: SCORER_POINTS,
    MVP_POINTS: MVP_POINTS,
    GK_POINTS: GK_POINTS,
    tournamentPoints: tournamentPoints,
    // البطاقات
    MAX_BOOSTS: MAX_BOOSTS,
    savedBoostCount: savedBoostCount,
    displayedBoostCount: displayedBoostCount,
    remainingBoosts: remainingBoosts,
    isBoostLocked: isBoostLocked,
    resolveBoostOnSave: resolveBoostOnSave,
    applyBoostCap: applyBoostCap,
    // الترتيب
    groupTable: groupTable,
    THIRD_PLACE_QUALIFY: THIRD_PLACE_QUALIFY,
    rankThirdPlaced: rankThirdPlaced,
    qualifiedThirdPlaced: qualifiedThirdPlaced,
    // حالة المباراة
    matchStatus: matchStatus,
    canSave: canSave,
    requiresPenaltyWinner: requiresPenaltyWinner,
    isValidPrediction: isValidPrediction,
    // الترتيب العام
    leaderboard: leaderboard,
    // التنسيق
    arNum: arNum,
    arPoints: arPoints
  };
});

function flagEmoji(code) {
  if (!code || code.length !== 2) return '🏳️';
  return String.fromCodePoint(

}

  return '<img class="flag flagimg" width="' + w + '" height="' + h + '" alt="' + esc(t.ar) +

    ' onerror="this.outerHTML=\'<span class=&quot;flagem&quot; style=&quot;font-size:' +
    Math.round(h * .92) + 'px;line-height:1&quot;>' + em + '</span>\'">';

var GROUP_AR = { A: 'الأولى', B: 'الثانية', C: 'الثالثة', D: 'الرابعة', E: 'الخامسة', F: 'السادسة' };
var GROUP_NUM = { A: '١', B: '٢', C: '٣', D: '٤', E: '٥', F: '٦' };

 *   "1A" ← «متصدّر المجموعة الأولى»، والمختصر «متصدّر ١»

function slotLabel(code, short) {
  if (!code) return '';

    return short ? role + ' ' + GROUP_NUM[m[2]] : role + ' ' + groupAr(m[2]);

  m = /^3([A-F]{3,4})$/.exec(code);

    var nums = m[1].split('').map(function (g) { return GROUP_NUM[g]; }).join('/');

  }
  m = /^W(\d{2})$/.exec(code);
  if (m) return short ? 'فائز ' + arNum(+m[1]) : 'الفائز من المباراة ' + arNum(+m[1]);
  return '';
}

/** اسم المنتخب أو الخانة، بالنسخة المختصرة للشجرة. */

function arTime(ms) {
  var d = new Date(ms);
  var h = d.getHours(), mm = d.getMinutes();
  var ampm = h < 12 ? 'ص' : 'م';
  var h12 = h % 12 || 12;
  return arNum(h12) + ':' + arNum(mm < 10 ? '0' + mm : mm) + ' ' + ampm;
}

/**
 * يُجهّز المباريات: يحسب موعد القفل لكل مباراة.
 *
 * إن أعلن الاتحاد الآسيوي التوقيت استعملناه. وإن لم يُعلَن — وهو الواقع
 * الآن — فالقفل **مبدئي آمن** في ساعة مبكّرة من يوم المباراة، أبكر من أيّ
 * انطلاق محتمل، فلا يبقى التوقّع مفتوحًا بعد أن تبدأ المباراة.
 *
 * الجانب الذي نخطئ فيه مقصود: القفل المبكّر أهون من قفل متأخّر.
 */
function prepareMatches() {
  MATCHES = D.matches.map(function (m) {
    var kickoffMs, provisional;
    if (m.kickoffUTC) {
      kickoffMs = Date.parse(m.kickoffUTC);
      provisional = false;
    } else {
      // منتصف ليل يوم المباراة بتوقيت غرينتش + ساعة القفل المبدئي
      kickoffMs = Date.parse(m.date + 'T00:00:00Z') + D.provisionalLockUTCHour * 3600000;
      provisional = true;
    }
    return {
      id: m.id, n: m.n, stage: m.stage, group: m.group,
      home: m.home, away: m.away, venue: m.venue, city: m.city,
      date: m.date, kickoffMs: kickoffMs, provisional: provisional
    };
  }).sort(function (x, y) {
    return x.kickoffMs !== y.kickoffMs ? x.kickoffMs - y.kickoffMs : x.n - y.n;
  });
  BY_ID = {};
  MATCHES.forEach(function (m) { BY_ID[m.id] = m; });
}

/* ---- الفرق الفعلية للمباراة (الأدمن يملأ خانات الإقصائيات) ---- */

function teamsOf(m) {
  var o = teamsData[m.id] || {};
  return { home: o.home || m.home, away: o.away || m.away };
}
function resultOf(m) { return resultsData[m.id] || null; }

function statusOf(m) {
  var t = teamsOf(m);
  return R.matchStatus({
    now: Date.now(), kickoffMs: m.kickoffMs, result: resultOf(m),
    isKnockout: isKnockout(m),
    homeResolved: isRealTeam(t.home), awayResolved: isRealTeam(t.away)
  });
}

/* ---------------------------- تسجيل الدخول ---------------------------- */

var configReady = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('YOUR_') !== 0;

/** وضع التجربة: ?demo=1 يُبدِل Firebase بقاعدة بيانات محليّة مؤقّتة. */
var DEMO = /(?:\?|&)demo=1(?:&|$)/.test(location.search);

function initFirebase() {
  if (DEMO) {
    if (!window.ASIA_DEMO) { $('login-err').textContent = 'ملفّ وضع التجربة غير محمَّل.'; return false; }
    var d = window.ASIA_DEMO.create(D);
    ROOT = d.root;
    return true;
  }
  if (!configReady) return false;
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  ROOT = db.ref(DB_ROOT);
  firebase.auth().signInAnonymously().catch(function (e) {
    $('login-err').textContent = 'تعذّر الاتصال بقاعدة البيانات: ' + (e && e.message || e);
  });
  return true;
}

function attemptLogin(name, pin, fromAuto) {
  var key = sanitize(name);
  if (!key) { return loginFail('اكتب اسمك'); }
  if (!pin || pin.length < 4) { return loginFail('الرقم السرّي ٤ أرقام على الأقل'); }
  if (!ROOT) { return loginFail('قاعدة البيانات غير متصلة'); }

  // في وضع التجربة ندخل مباشرة بلا تحقّق — لا بيانات حقيقية تُحمى
  if (DEMO) { loginOK(name, pin); return true; }

  var ph = hashPin(pin);
  var ref = ROOT.child('users/' + key);
  ref.once('value').then(function (snap) {
    var u = snap.val();
    if (!u) {
      // أوّل من يستخدم الاسم يملكه
      return ref.set({ name: name.trim(), ph: ph }).then(function () { loginOK(name, pin); });
    }
    if (u.ph && u.ph !== ph) {
      return loginFail('هذا الاسم مستخدم برقم سرّي مختلف. اختر اسمًا غيره أو تذكّر رقمك.', fromAuto);
    }
    if (!u.ph) return ref.update({ ph: ph }).then(function () { loginOK(name, pin); });
    loginOK(name, pin);
  }).catch(function (e) {
    loginFail('فشل الدخول: ' + (e && e.message || e), fromAuto);
  });
}

function loginFail(msg, fromAuto) {
  if (!fromAuto) $('login-err').textContent = msg;
  try { localStorage.removeItem('asia27_auth'); } catch (e) {}
  return false;
}

function loginOK(name, pin) {
  myName = name.trim();
  myKey = sanitize(name);
  try { localStorage.setItem('asia27_auth', JSON.stringify({ n: myName, p: pin })); } catch (e) {}
  $('me-name').textContent = myName;
  applyAdminUI();
  listen();
  showScreen('s-matches');
}

function logout() {
  if (!confirm('تبي تخرج من حسابك؟')) return;
  try { localStorage.removeItem('asia27_auth'); } catch (e) {}
  location.reload();
}

function isAdminUser() {
  return !!myName && myName.trim().toLowerCase() === ADMIN_NAME.toLowerCase();
}
function applyAdminUI() {
  $('btn-settings').style.display = isAdminUser() ? '' : 'none';
}

/* ---------------------------- شاشة المباريات ---------------------------- */

var FILTERS = [
  { k: 'next', t: 'القادمة' },
  { k: 'open', t: 'مفتوحة للتوقّع' },
  { k: 'mine', t: 'توقّعاتي' },
  { k: 'done', t: 'انتهت' },
  { k: 'all', t: 'الكل' }
];

function buildChips() {
  var box = $('match-chips');
  box.innerHTML = '';
  FILTERS.forEach(function (f) {
    var b = document.createElement('button');
    b.className = 'chip' + (activeFilter === f.k ? ' active' : '');
    b.textContent = f.t;
    b.addEventListener('click', function () { activeFilter = f.k; buildChips(); renderMatches(); });
    box.appendChild(b);
  });
  // شرائح المجموعات والأدوار
  ['A', 'B', 'C', 'D', 'E', 'F'].forEach(function (g) {
    var b = document.createElement('button');
    b.className = 'chip' + (activeFilter === 'g' + g ? ' active' : '');
    b.textContent = 'المجموعة ' + GROUP_NUM[g];
    b.addEventListener('click', function () { activeFilter = 'g' + g; buildChips(); renderMatches(); });
    box.appendChild(b);
  });
  ['R16', 'QF', 'SF', 'FINAL'].forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'chip' + (activeFilter === 's' + s ? ' active' : '');
    b.textContent = STAGE_AR[s];
    b.addEventListener('click', function () { activeFilter = 's' + s; buildChips(); renderMatches(); });
    box.appendChild(b);
  });
}

function filteredMatches() {
  var now = Date.now();
  if (activeFilter === 'all') return MATCHES;
  if (activeFilter === 'done') return MATCHES.filter(function (m) { return !!resultOf(m); });
  if (activeFilter === 'open') return MATCHES.filter(function (m) { return statusOf(m) === 'open'; });
  if (activeFilter === 'mine') {
    return MATCHES.filter(function (m) { return predsData[m.id] && predsData[m.id][myKey]; });
  }
  if (activeFilter.indexOf('g') === 0 && activeFilter.length === 2) {
    return MATCHES.filter(function (m) { return m.group === activeFilter[1]; });
  }
  if (activeFilter.indexOf('s') === 0) {
    var st = activeFilter.slice(1);
    return MATCHES.filter(function (m) { return m.stage === st; });
  }
  // القادمة: ما لم تنتهِ نتيجته، وأقربها زمنيًّا أولًا
  var next = MATCHES.filter(function (m) { return !resultOf(m); });
  return next.length ? next : MATCHES.slice().reverse();
}

function renderBoostBar() {
  var box = $('boost-bar');
  box.innerHTML = '';
  if (!myKey) return;
  var used = R.displayedBoostCount(predsData, myKey, currentDrafts());
  var left = Math.max(0, R.MAX_BOOSTS - used);
  var d = document.createElement('div');
  d.className = 'notice';
  d.innerHTML = '⚡ <b>بطاقات ×٢:</b> بقي لك ' + arNum(left) + ' من ' + arNum(R.MAX_BOOSTS) +
    '. البطاقة تضاعف نقاط مباراة واحدة، و<b>لا ترجع بعد الحفظ أبدًا</b>.';
  box.appendChild(d);

  if (isAdmin && cancelledBoosts.length) {
    var w = document.createElement('div');
    w.className = 'notice warn';
    w.innerHTML = '⚠️ أُلغيت ' + arNum(cancelledBoosts.length) + ' بطاقة زائدة عن الحد: ' +
      cancelledBoosts.map(function (c) {
        var u = usersData[c.playerKey];
        return esc((u && u.name) || c.playerKey) + ' (مباراة ' + arNum(BY_ID[c.matchId] ? BY_ID[c.matchId].n : 0) + ')';
      }).join('، ') + '. تظهر لك وحدك.';
    box.appendChild(w);
  }
}

function currentDrafts() {
  var out = {};
  Object.keys(draft).forEach(function (id) {
    if (draftEdited[id]) out[id] = draft[id];
  });
  return out;
}

/* ---------------------------- توقّعات البطولة ---------------------------- */

/** تُقفل توقّعات البطولة مع انطلاق أوّل مباراة. */
function tournamentLockMs() {
  return MATCHES.length ? MATCHES[0].kickoffMs : Infinity;
}
function tournamentLocked() { return Date.now() >= tournamentLockMs(); }

var TOUR_FIELDS = [
  { k: 'champion', icon: '🏆', label: 'بطل الكأس', pts: 5, teams: true },
  { k: 'scorer', icon: '⚽', label: 'هدّاف البطولة', pts: 3 },
  { k: 'mvp', icon: '⭐', label: 'أفضل لاعب', pts: 3 },
  { k: 'gk', icon: '🧤', label: 'أفضل حارس', pts: 3 }
];

function tournamentCard() {
  var me = usersData[myKey] || {};
  var card = document.createElement('div');
  card.className = 'tour-card';
  var locked = tournamentLocked();
  var truth = truthOf();

  var h = document.createElement('h3');
  h.textContent = '🏆 توقّعات البطولة';
  card.appendChild(h);

  if (locked) {
    var earned = R.tournamentPoints(
      { champion: me.champion, scorer: me.scorer, mvp: me.mvp, gk: me.gk }, truth);
    TOUR_FIELDS.forEach(function (f) {
      var mine = me[f.k], real = truth[f.k];
      var row = document.createElement('div');
      row.className = 'locked-box';
      var state = !mine ? '<span class="pts-pill p0">ما توقّعت</span>'
        : !real ? '<span class="pts-pill p0">بانتظار النتيجة</span>'
        : mine === real ? '<span class="pts-pill p5">+' + arNum(f.pts) + '</span>'
        : '<span class="pts-pill p0">لا نقاط</span>';
      row.innerHTML = '<div><div class="lb">' + f.icon + ' ' + f.label + '</div>' +
        '<div class="lv">' + esc(mine ? (f.teams ? teamAr(mine) : mine) : '—') + '</div></div>' + state;
      card.appendChild(row);
    });
    var tot = document.createElement('div');
    tot.className = 'hint';
    tot.style.textAlign = 'center';
    tot.textContent = 'مجموعك من توقّعات البطولة: ' + R.arPoints(earned);
    card.appendChild(tot);
    return card;
  }

  var sub = document.createElement('div');
  sub.className = 'hint';
  sub.textContent = 'تُقفل مع انطلاق أوّل مباراة. اكتب الاسم كما تحبّ — نحن نقارنه كما كتبته.';
  card.appendChild(sub);

  var inputs = {};
  TOUR_FIELDS.forEach(function (f) {
    var row = document.createElement('div');
    row.className = 'tour-row';
    row.innerHTML = '<label><span>' + f.icon + ' ' + f.label + '</span>' +
      '<span class="pts-tag">' + arNum(f.pts) + ' نقاط</span></label>';
    var el;
    if (f.teams) {
      el = document.createElement('select');
      el.className = 'field';
      el.innerHTML = '<option value="">— اختر منتخبًا —</option>' +
        Object.keys(D.teams).map(function (k) {
          return '<option value="' + esc(k) + '"' + (me[f.k] === k ? ' selected' : '') + '>' +
                 esc(D.teams[k].ar) + '</option>';
        }).join('');
    } else {
      el = document.createElement('input');
      el.className = 'field';
      el.placeholder = 'اكتب اسم اللاعب';
      el.value = me[f.k] || '';
    }
    inputs[f.k] = el;
    row.appendChild(el);
    card.appendChild(row);
  });

  var save = document.createElement('button');
  save.className = 'btn btn-gold';
  save.textContent = '💾 احفظ توقّعات البطولة';
  save.addEventListener('click', function () {
    var patch = {};
    TOUR_FIELDS.forEach(function (f) {
      var v = (inputs[f.k].value || '').trim();
      patch[f.k] = v || null;
    });
    ROOT.child('users/' + myKey).update(patch)
      .then(function () { toast('تم حفظ توقّعات البطولة ✅'); })
      .catch(function (e) { toast('فشل الحفظ: ' + (e && e.message || e)); });
  });
  card.appendChild(save);
  return card;
}

/* ---------------------------- توقّعات بقية اللاعبين ---------------------------- */

/** تُعرض فقط بعد قفل المباراة — قبل ذلك سرّ. */
function othersBlock(m) {
  var all = predsData[m.id] || {};
  var keys = Object.keys(all).filter(function (k) { return k !== myKey; });
  if (!keys.length) return null;

  var res = resultOf(m);
  var wrap = document.createElement('details');
  wrap.style.cssText = 'width:100%;background:var(--surface);border:1px solid var(--line);' +
    'border-radius:12px;padding:10px 12px;';
  var sum = document.createElement('summary');
  sum.style.cssText = 'cursor:pointer;font-size:.82rem;font-weight:800;color:var(--muted)';
  sum.textContent = '👀 توقّعات بقية اللاعبين (' + arNum(keys.length) + ')';
  wrap.appendChild(sum);

  keys.sort(function (a, b) {
    if (!res) return 0;
    return R.score(all[b], res) - R.score(all[a], res);
  }).forEach(function (k) {
    var u = usersData[k] || {};
    var p = all[k];
    var line = document.createElement('div');
    line.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;' +
      'padding:6px 0;font-size:.84rem;border-top:1px solid rgba(255,255,255,.05)';
    var pts = res ? R.score(p, res) : null;
    var raw = res ? R.points(p, res) : null;
    var cls = raw === null ? 'p0' : (raw >= 5 ? 'p5' : raw >= 3 ? 'p3' : 'p0');
    line.innerHTML = '<span style="font-weight:700">' + esc(u.name || k) + '</span>' +
      '<span style="font-weight:800;color:#fff">' + arNum(p.h) + ' — ' + arNum(p.a) +
      (p.x2 ? ' <span class="x2-tag">×٢</span>' : '') + '</span>' +
      (pts === null ? '' : '<span class="pts-pill ' + cls + '">' + R.arPoints(pts) + '</span>');
    wrap.appendChild(line);
  });
  return wrap;
}

function renderMatches() {
  var list = $('matches-list');
  if (!list) return;
  if (!predsLoaded) { list.innerHTML = '<div class="spin"></div>'; return; }
  list.innerHTML = '';
  buildChips();

  if (activeFilter === 'next' || activeFilter === 'open') {
    list.appendChild(tournamentCard());
  }

  var ms = filteredMatches();
  if (!ms.length) {
    list.innerHTML = '<div class="empty">ما فيه مباريات في هذا التصنيف.</div>';
    return;
  }
  ms.forEach(function (m) { list.appendChild(matchCard(m)); });
}

function matchCard(m) {
  var t = teamsOf(m);
  var st = statusOf(m);
  var res = resultOf(m);
  var saved = (predsData[m.id] || {})[myKey] || null;

  var c = document.createElement('div');
  c.className = 'match' + (st === 'finished' ? ' finished' : st === 'locked' ? ' locked' : '');

  // ترويسة: المجموعة/الدور · رقم المباراة · الحالة
  var head = document.createElement('div');
  head.className = 'match-head';
  var label = m.stage === 'group' ? groupAr(m.group) : STAGE_AR[m.stage];
  var stTxt = { open: 'مفتوحة', locked: 'مُقفلة', finished: 'انتهت', awaitingTeams: 'بانتظار الفرق' }[st];
  var stCls = st === 'awaitingTeams' ? 'soon' : st;
  head.innerHTML = '<span class="hc-l grp-badge">' + esc(label) + '</span>' +
    '<span class="hc-c">مباراة ' + arNum(m.n) + '</span>' +
    '<span class="hc-r status-badge ' + stCls + '">' + stTxt + '</span>';
  c.appendChild(head);

  // الطرفان
  var teams = document.createElement('div');
  teams.className = 'teams';
  teams.innerHTML =
    '<div class="team">' + flagHTML(t.home) +
      '<div class="' + (isRealTeam(t.home) ? 'tname' : 'tslot') + '">' + esc(teamAr(t.home)) + '</div></div>' +
    '<div class="vs">×</div>' +
    '<div class="team">' + flagHTML(t.away) +
      '<div class="' + (isRealTeam(t.away) ? 'tname' : 'tslot') + '">' + esc(teamAr(t.away)) + '</div></div>';
  c.appendChild(teams);

  // الموعد والملعب
  var meta = document.createElement('div');
  meta.className = 'match-meta';
  meta.innerHTML = esc(arDate(m.kickoffMs)) + ' — ' + esc(m.venue) + '، ' + esc(m.city) +
    (m.provisional
      ? '<br><span class="prov">⏰ التوقيت الرسمي لم يُعلَن بعد — التوقّع يُقفل ' +
        esc(arTime(m.kickoffMs)) + '</span>'
      : '<br>' + esc(arTime(m.kickoffMs)));
  c.appendChild(meta);

  if (st === 'finished') {
    c.appendChild(finishedBox(m, res, saved));
    var ob = othersBlock(m);
    if (ob) c.appendChild(ob);
    if (isAdmin) c.appendChild(adminBox(m));
    return c;
  }
  if (st === 'awaitingTeams') {
    var w = document.createElement('div');
    w.className = 'hint';
    w.style.textAlign = 'center';
    w.textContent = 'التوقّع يفتح بعد ما يتأكّد الفريقان المتأهّلان.';
    c.appendChild(w);
    return c;
  }
  if (st === 'locked') {
    c.appendChild(lockedBox(m, saved));
    var ob2 = othersBlock(m);
    if (ob2) c.appendChild(ob2);
    if (isAdmin) c.appendChild(adminBox(m));
    return c;
  }
  c.appendChild(predictBox(m, t, saved));
  if (isAdmin) c.appendChild(adminBox(m));
  return c;
}

/* ---------------------------- وضع الإدارة ---------------------------- */

/** إدخال النتيجة الفعلية وتحديد المتأهّلين للخانات الإقصائية. */
function adminBox(m) {
  var t = teamsOf(m);
  var res = resultOf(m) || { h: 0, a: 0, pw: null };
  var d = { h: +res.h || 0, a: +res.a || 0, pw: res.pw || null };

  var box = document.createElement('div');
  box.className = 'admin-card';
  var h = document.createElement('h4');
  h.textContent = '🔧 إدارة — مباراة ' + arNum(m.n);
  box.appendChild(h);

  // تحديد المتأهّلَين في الإقصائيات
  if (isKnockout(m)) {
    [['home', t.home], ['away', t.away]].forEach(function (pair) {
      var row = document.createElement('div');
      row.className = 'tour-row';
      row.innerHTML = '<label>' + (pair[0] === 'home' ? 'الطرف الأول' : 'الطرف الثاني') +
        ' — حاليًّا: ' + esc(teamAr(pair[1])) + '</label>';
      var sel = document.createElement('select');
      sel.className = 'field';
      sel.innerHTML = '<option value="">— لم يتحدّد —</option>' +
        Object.keys(D.teams).map(function (k) {
          return '<option value="' + esc(k) + '"' + (pair[1] === k ? ' selected' : '') + '>' +
                 esc(D.teams[k].ar) + '</option>';
        }).join('');
      sel.addEventListener('change', function () {
        var patch = {};
        patch[pair[0]] = sel.value || null;
        ROOT.child('teams/' + m.id).update(patch)
          .then(function () { toast('تم تحديد المتأهّل ✅'); })
          .catch(function (e) { toast('فشل: ' + (e && e.message || e)); });
      });
      row.appendChild(sel);
      box.appendChild(row);
    });
  }

  // النتيجة
  var grid = document.createElement('div');
  grid.className = 'adm-grid';
  function num(side) {
    var wrap = document.createElement('div');
    wrap.className = 'stepper';
    var mi = document.createElement('button'); mi.className = 'stp'; mi.textContent = '−';
    var vv = document.createElement('div'); vv.className = 'stv'; vv.textContent = arNum(d[side]);
    var pl = document.createElement('button'); pl.className = 'stp'; pl.textContent = '+';

  var penWrap = document.createElement('div');

      .then(function () { toast('تم حفظ النتيجة ✅'); })

/** مُدخل التوقّع: أزرار زيادة/نقصان + الترجيح + بطاقة ×٢ + حفظ */
function predictBox(m, t, saved) {
  if (!draft[m.id]) {
    draft[m.id] = saved
      ? { h: saved.h, a: saved.a, pw: saved.pw || null, x2: !!saved.x2 }
      : { h: 0, a: 0, pw: null, x2: false };
  }
  var d = draft[m.id];
  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:11px';

  // الأرقام — نمرّر refresh مباشرة فلا نحتاج البحث في شجرة العناصر
  var row = document.createElement('div');
  row.className = 'pred-row';
  var stepHome = stepper(m, 'h', function () { refresh(); });
  var stepAway = stepper(m, 'a', function () { refresh(); });
  var sep = document.createElement('div');
  sep.className = 'vs';
  sep.textContent = '—';
  row.appendChild(stepHome.el);
  row.appendChild(sep);
  row.appendChild(stepAway.el);
  wrap.appendChild(row);

  var penBox = document.createElement('div');
  wrap.appendChild(penBox);

  var actions = document.createElement('div');
  actions.className = 'act-row';
  var x2 = document.createElement('button');
  x2.className = 'x2-btn';
  var save = document.createElement('button');
  save.className = 'save-btn';
  actions.appendChild(x2);
  actions.appendChild(save);
  wrap.appendChild(actions);

  function refresh() {
    stepHome.paint();
    stepAway.paint();

    // الترجيح — إلزامي إذا كانت إقصائية والتوقّع تعادل
    if (R.requiresPenaltyWinner(isKnockout(m), d)) {
      if (!penBox.firstChild) {
        var p = document.createElement('div');
        p.className = 'pen-row';
        p.innerHTML = '<div class="pen-lbl">⚽ الإقصائيات ما تنتهي بتعادل — اختر الفائز بالترجيح</div>';
        var opts = document.createElement('div');
        opts.className = 'pen-opts';
        p._buttons = [];
        [['h', t.home], ['a', t.away]].forEach(function (pair) {
          var b = document.createElement('button');
          b.className = 'pen-opt';
          b.textContent = teamAr(pair[1]);
          b.dataset.side = pair[0];
          b.addEventListener('click', function () {
            d.pw = pair[0]; draftEdited[m.id] = true; refresh();
          });
          opts.appendChild(b);
          p._buttons.push(b);
        });
        p.appendChild(opts);
        penBox.appendChild(p);
      }
      penBox.querySelectorAll('.pen-opt').forEach(function (b) {
        b.classList.toggle('on', d.pw === b.dataset.side);
      });
    } else {
      penBox.innerHTML = '';
      if (d.pw) d.pw = null;   // ما عاد تعادلًا ⇒ لا معنى للترجيح
    }

    // بطاقة ×٢
    var locked = R.isBoostLocked(predsData, m.id, myKey);
    var left = R.MAX_BOOSTS - R.displayedBoostCount(predsData, myKey, currentDrafts(), m.id) - (d.x2 ? 1 : 0);
    x2.className = 'x2-btn' + (d.x2 ? ' on' : '');
    x2.disabled = locked || (!d.x2 && left <= 0);
    x2.innerHTML = '<span>⚡</span><span>' +
      (locked ? '×٢ مُستهلكة' : d.x2 ? '×٢ ✓' : '×٢ (' + arNum(Math.max(0, left)) + ')') + '</span>';

    // الحفظ
    var valid = R.isValidPrediction(isKnockout(m), d);
    save.disabled = !valid;
    save.textContent = !valid ? 'اختر الفائز بالترجيح' : (saved ? 'حدّث التوقّع' : 'احفظ التوقّع');
    renderBoostBar();
  }

  x2.addEventListener('click', function () {
    if (R.isBoostLocked(predsData, m.id, myKey)) {
      toast('البطاقة محفوظة على هذي المباراة ولا ترجع'); return;
    }
    if (!d.x2) {
      var left = R.MAX_BOOSTS - R.displayedBoostCount(predsData, myKey, currentDrafts(), m.id);
      if (left <= 0) { toast('استخدمت كل بطاقات ×٢ (' + arNum(R.MAX_BOOSTS) + ')'); return; }
    }
    d.x2 = !d.x2;
    draftEdited[m.id] = true;
    refresh();
  });
  save.addEventListener('click', function () { savePred(m.id); });

  refresh();
  return wrap;
}

/**
 * زرّا زيادة/نقصان لرقم واحد.
 * @returns {{el: HTMLElement, paint: function}} العنصر ودالة إعادة الرسم
 */
function stepper(m, side, onChange) {
  var d = draft[m.id];
  var el = document.createElement('div');
  el.className = 'stepper';
  var minus = document.createElement('button');
  minus.className = 'stp'; minus.textContent = '−';
  minus.setAttribute('aria-label', 'أنقص هدفًا');
  var val = document.createElement('div');
  val.className = 'stv';
  var plus = document.createElement('button');
  plus.className = 'stp'; plus.textContent = '+';
  plus.setAttribute('aria-label', 'أضف هدفًا');

  function paint() {
    val.textContent = arNum(d[side]);
    minus.disabled = d[side] <= 0;
    plus.disabled = d[side] >= 30;
  }
  function bump(delta) {
    d[side] = Math.max(0, Math.min(30, d[side] + delta));
    draftEdited[m.id] = true;
    onChange();
  }
  minus.addEventListener('click', function () { bump(-1); });
  plus.addEventListener('click', function () { bump(1); });

  el.appendChild(minus); el.appendChild(val); el.appendChild(plus);
  paint();
  return { el: el, paint: paint };
}

function savePred(id) {
  var m = BY_ID[id];
  var st = statusOf(m);
  if (st === 'awaitingTeams') { toast('التوقّع يفتح بعد ما تتأكّد الفرق'); renderMatches(); return; }
  if (st !== 'open') { toast('التوقّعات مُقفلة لهذي المباراة'); renderMatches(); return; }
  if (!predsLoaded) { toast('جاري تحميل توقّعك… حاول بعد لحظة'); return; }

  var d = draft[id];
  if (!R.isValidPrediction(isKnockout(m), d)) { toast('اختر الفائز بالترجيح'); return; }

  var data = { h: d.h, a: d.a };
  if (R.requiresPenaltyWinner(isKnockout(m), d)) data.pw = d.pw;

  // قرار البطاقة يمرّ عبر القواعد المُختبَرة، لا بحساب هنا
  var boost = R.resolveBoostOnSave(predsData, id, myKey, !!d.x2);
  if (boost === null) {
    d.x2 = false;
    toast('استخدمت كل بطاقات ×٢ (' + arNum(R.MAX_BOOSTS) + ')');
    renderMatches();
    return;
  }
  if (boost) { d.x2 = true; data.x2 = true; }

  ROOT.child('predictions/' + id + '/' + myKey).set(data)
    .then(function () { draftEdited[id] = false; toast('تم حفظ التوقّع ✅'); })
    .catch(function (e) { toast('فشل الحفظ: ' + (e && e.message || e)); });
}

/* ---------------------------- الترتيب العام ---------------------------- */

function truthOf() {
  var manual = teamsData.__truth__ || {};
  var out = { champion: manual.champion || null, scorer: manual.scorer || null,
              mvp: manual.mvp || null, gk: manual.gk || null };
  if (!out.champion) {
    // البطل يُستنتَج من نتيجة النهائي إن لم يُثبّته الأدمن
    var fm = MATCHES.filter(function (m) { return m.stage === 'FINAL'; })[0];
    if (fm) {
      var r = resultOf(fm);
      if (r) {
        var t = teamsOf(fm), w = null;
        if (+r.h > +r.a) w = t.home;
        else if (+r.a > +r.h) w = t.away;
        else if (r.pw === 'h') w = t.home;
        else if (r.pw === 'a') w = t.away;
        if (w && isRealTeam(w)) out.champion = w;
      }
    }
  }
  return out;
}

function renderLeader() {
  var box = $('leader-list');
  if (!box) return;
  var players = Object.keys(usersData).map(function (k) {
    var u = usersData[k] || {};
    return { key: k, name: u.name || k,

  });
  if (!players.length) { box.innerHTML = '<div class="empty">ما فيه لاعبون بعد.</div>'; return; }

  var table = R.leaderboard({
    players: players, preds: predsData, results: resultsData, truth: truthOf()
  });

  box.innerHTML = '';
  table.forEach(function (r, i) {
    var row = document.createElement('div');
    row.className = 'ld-row' + (r.key === myKey ? ' me' : '');
    row.innerHTML =
      '<div class="ld-rank">' + arNum(i + 1) + '</div>' +
      '<div class="ld-name"><div class="nm">' + esc(r.name) + '</div>' +
      '<div class="sub">' + arNum(r.scoredMatches) + ' مباراة، ' + arNum(r.exactHits) +
      ' مطابقة، ' + arNum(r.boostsUsed) + ' من ' + arNum(R.MAX_BOOSTS) + ' بطاقات</div></div>' +
      '<div class="ld-pts">' + arNum(r.total) + '<small>نقطة</small></div>';

}

  }

  card('⚽ نقاط المباراة',
    '<div class="rule-line"><span>النتيجة مطابقة تمامًا</span><span class="v">٥ نقاط</span></div>' +
    '<div class="rule-line"><span>الاتجاه صحيح فقط (فوز/تعادل/خسارة)</span><span class="v">٣ نقاط</span></div>' +
    '<div class="rule-line"><span>الاتجاه خاطئ</span><span class="v">لا نقاط</span></div>' +
    '<div class="rule-line"><span>توقّعت تعادلًا في مباراة إقصائية وأصبت الفائز بالترجيح</span><span class="v">+١</span></div>' +
    '<div class="rule-p">وبونص الترجيح لا يشترط مطابقة النتيجة: من توقّع ١-١ وانتهت ٢-٢ بالترجيح وأصاب الفائز يأخذ <b>٤</b>. ومن توقّع ٢-٢ بالضبط وأصاب الفائز يأخذ <b>٦</b>.</div>');

  card('⚡ بطاقات ×٢',
    '<div class="rule-line"><span>عدد البطاقات في البطولة كلها</span><span class="v">' + arNum(R.MAX_BOOSTS) + ' بطاقات</span></div>' +
    '<div class="rule-line"><span>أعلى نتيجة ممكنة في مباراة واحدة</span><span class="v">١٢ نقطة</span></div>' +
    '<div class="rule-p">البطاقة تضاعف نقاط المباراة التي تُفعَّل عليها. وقاعدة صارمة: <b>البطاقة المحفوظة مستهلكة نهائيًا ولا ترجع لرصيدك أبدًا</b> — لا بالضغط على الزر، ولا بتحديث التوقّع. فاختر بتدبّر.</div>' +
    '<div class="rule-p">ولو فعّلتها على نتيجة خاطئة، تُستهلك ويبقى حسابك صفرًا في تلك المباراة.</div>');

  card('🏆 توقّعات البطولة',
    '<div class="rule-line"><span>بطل البطولة</span><span class="v">٥ نقاط</span></div>' +
    '<div class="rule-line"><span>هدّاف البطولة</span><span class="v">٣ نقاط</span></div>' +
    '<div class="rule-line"><span>أفضل لاعب</span><span class="v">٣ نقاط</span></div>' +
    '<div class="rule-line"><span>أفضل حارس</span><span class="v">٣ نقاط</span></div>' +
    '<div class="rule-p">تُقفل مع انطلاق أوّل مباراة، ولا تنزل نقاطها إلا بعد أن تُثبَّت النتيجة الفعلية.</div>');

  card('📊 التأهّل وترتيب المجموعات',
    '<div class="rule-line"><span>عدد المنتخبات</span><span class="v">٢٤</span></div>' +
    '<div class="rule-line"><span>المتأهّلون إلى دور الـ١٦</span><span class="v">١٦</span></div>' +
    '<div class="rule-p">يتأهّل أصحاب المركزين الأوّلين من كل مجموعة (١٢ منتخبًا) زائد <b>أفضل أربعة</b> من أصحاب المراكز الثالثة.</div>' +
    '<div class="rule-p">وترتيب المجموعة: النقاط ← المواجهة المباشرة بين المتساويين (نقاطها، فرق أهدافها، أهدافها المسجّلة) ← ومن بقي متساويًا تُعاد عليه القاعدة بمبارياته وحده ← ثم فرق الأهداف الكلي ← الأهداف المسجّلة ← نقاط الإنذارات ← القرعة.</div>');

  card('⏰ متى يُقفل التوقّع؟',
    '<div class="rule-p">التوقّع يُقفل <b>مع صافرة البداية</b>. وبعدها تظهر لك توقّعات بقية اللاعبين.</div>' +
    '<div class="rule-p">والاتحاد الآسيوي <b>لم يُعلن توقيتات الانطلاق بعد</b>. فحتى يُعلنها، يُقفل التوقّع في ساعة مبكّرة من يوم المباراة — أبكر من أيّ انطلاق محتمل — حتى لا يبقى مفتوحًا بعد أن تبدأ المباراة. وستظهر الساعة الدقيقة في بطاقة كل مباراة أوّل ما تُعلَن.</div>');

  card('ℹ️ عن البطولة',
    '<div class="rule-line"><span>المضيف</span><span class="v">السعودية</span></div>' +
    '<div class="rule-line"><span>التاريخ</span><span class="v">٧ يناير — ٥ فبراير ٢٠٢٧</span></div>' +
    '<div class="rule-line"><span>المباريات</span><span class="v">٥١</span></div>' +
    '<div class="rule-line"><span>الملاعب</span><span class="v">٨ في ٣ مدن</span></div>' +
    '<div class="rule-p">الرياض ٣١ مباراة، جدة ١٣، الخبر ٧. والافتتاح <b>السعودية × فلسطين</b> في استاد مدينة الملك فهد، والنهائي في الملعب نفسه.</div>');
}

/* ---------------------------- التنقّل ---------------------------- */

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  var el = $(id);
  if (el) el.classList.add('active');
  document.querySelectorAll('.tab').forEach(function (t) {
    t.classList.toggle('active', t.dataset.screen === id);
  });
  window.scrollTo(0, 0);
  if (id === 's-rules') renderRules();
  if (id === 's-groups') renderGroups();
  if (id === 's-bracket') renderBracket();
  if (id === 's-leader') renderLeader();
}

/* ---------------------------- الإقلاع ---------------------------- */

function boot() {
  prepareMatches();
  renderRules();

  var provisional = MATCHES.filter(function (m) { return m.provisional; }).length;
  $('login-note').innerHTML = '📅 الجدول الكامل محمَّل: <b>' + arNum(MATCHES.length) +
    ' مباراة</b> بتواريخها وملاعبها، من ملفّ الاتحاد الآسيوي الرسمي.' +
    (provisional ? '<br>⏰ توقيتات الانطلاق لم تُعلَن بعد لـ' + arNum(provisional) +
      ' مباراة، فالتوقّع يُقفل في ساعة مبكّرة آمنة من يوم المباراة.' : '');

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { showScreen(t.dataset.screen); });
  });
  document.querySelectorAll('[data-gsub]').forEach(function (b) {
    b.addEventListener('click', function () {
      activeGroupSub = b.dataset.gsub;
      document.querySelectorAll('[data-gsub]').forEach(function (x) {
        x.classList.toggle('active', x === b);
      });
      renderGroups();
    });
  });
  $('me-chip').addEventListener('click', logout);
  $('btn-login').addEventListener('click', function () {
    attemptLogin($('in-name').value, $('in-pin').value, false);
  });
  $('in-pin').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('btn-login').click();
  });
  $('btn-settings').addEventListener('click', function () {
    var code = prompt('رمز الإدارة:');
    if (code === null) return;
    if (code === ADMIN_CODE) {
      isAdmin = !isAdmin;
      $('btn-settings').classList.toggle('on', isAdmin);
      toast(isAdmin ? 'وضع الإدارة مفتوح' : 'وضع الإدارة مُغلق');
      renderAll();
    } else toast('رمز خاطئ');
  });

  if (!initFirebase()) {
    $('login-err').textContent = 'إعدادات Firebase غير مضبوطة.';
    return;
  }
  if (DEMO) {
    // بانر واضح حتى لا يُظنّ أنها بيانات حقيقية
    var b = document.createElement('div');
    b.className = 'notice warn';
    b.innerHTML = '🧪 <b>وضع التجربة:</b> البيانات وهمية وتُنسى عند تحديث الصفحة، ' +
      'ولا شيء يُكتب في قاعدة البيانات. لاستخدام التطبيق فعليًّا احذف <code>?demo=1</code> من الرابط.';
    $('s-login').insertBefore(b, $('s-login').firstChild);
    $('in-name').value = 'Mnajjar3';
    $('in-pin').value = '0000';
    return;
  }
  // دخول تلقائي إن كان الجهاز مسجّلًا من قبل
  try {
    var saved = JSON.parse(localStorage.getItem('asia27_auth') || 'null');
    if (saved && saved.n && saved.p) {
      firebase.auth().onAuthStateChanged(function (u) {
        if (u) attemptLogin(saved.n, saved.p, true);
      });
    }
  } catch (e) {}
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>

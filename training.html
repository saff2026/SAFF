  h+='<div class="card" style="margin-top:6px">';
  ds.forEach(function(s){
      var sc=scoreOf(s), m=mvpOf(s), gc=goalCount(s).g;
      var scorers=Object.keys(gc).sort(function(a,b){return gc[b]-gc[a];}).slice(0,3).map(function(id){return esc(shortName(id))+(gc[id]>1?' ×'+gc[id]:'');}).join('، ');
      h+='<div class="cell tap li" onclick="openSessionDetail(\''+s.id+'\')">'+dateTile(s.date)+'<div class="body"><div class="t">'+esc(s.teams.A.name)+' <span style="display:inline-flex;direction:rtl;gap:5px;margin:0 6px;font-weight:700"><b class="num">'+sc.A+'</b><span class="muted">–</span><b class="num">'+sc.B+'</b></span> '+esc(s.teams.B.name)+'</div>'+
        '</div>'+chev()+'</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}
function openSessionDetail(id){
  openModal('');
  sessionDetailInner(id);
  modalRefresh=function(){ if(!S.sessions[id]){closeModal();return;} sessionDetailInner(id); };
}
function sessionDetailInner(id){
  var s=S.sessions[id]; if(!s)return;
  var m=mvpOf(s), gl=goalCount(s);
  var h=mh(niceDate(s.date));
  var done=s.status==='done';
  if(!done){ m=null; gl={g:{},a:{}}; }
  h+=done?'<div class="card">'+scoreCard(s,niceDate(s.date))+goalsHTML(s,false)+'</div>':'<div class="card">'+upcomingCard(s)+'</div>';
  if(m) h+='<div class="card" style="margin-top:12px"><div class="mvp" onclick="openPlayer(\''+m+'\')"><div class="medal">'+icF('star')+'</div><div class="grow"><div class="k">أفضل لاعب في التمرين</div><div class="n">'+esc(pname(m))+'</div></div>'+rBadge(s.ratings[m])+'</div></div>';
  h+=gh('التشكيلة',!done?lnk('صورة','lineupImage(\''+s.id+'\')','lineupImg2','down'):'')+'<div class="card pad">'+pitchHTML(s,false)+'</div>';
  if(!done&&isCoach) h+=rotationHTML(s,false);
  ([]).forEach(function(t){
    var ids=teamPlayers(s,t).filter(function(x){return x;});
    h+=gh('<span class="dot '+t+'" style="width:13px;height:13px;margin-left:6px"></span>'+esc(s.teams[t].name));
    h+='<div class="card">'+(ids.length?ids.sort(function(a,b){return (s.ratings[b]||0)-(s.ratings[a]||0);}).map(function(pid){return '<div class="cell tap" onclick="openPlayer(\''+pid+'\')"><div class="body"><div class="t">'+(m===pid?'⭐ ':'')+esc(pname(pid))+(teamOf(s,pid)&&teamOf(s,pid).sub?' <span class="tag">بديل</span>':'')+'</div>'+((gl.g[pid]||gl.a[pid])?'<div class="s">'+(gl.g[pid]?gl.g[pid]+' هدف':'')+(gl.g[pid]&&gl.a[pid]?' · ':'')+(gl.a[pid]?gl.a[pid]+' صناعة':'')+'</div>':'')+'</div>'+(done?rBadge(s.ratings[pid]):'')+'</div>';}).join(''):'<div class="cell"><div class="body"><div class="s">—</div></div></div>')+'</div>';
  });
  var bench=participants(s).filter(function(pid){return !teamOf(s,pid);});

  var cis=Object.keys(s.checkin||{}).filter(function(pid){return P(pid);}).sort(function(a,b){return s.checkin[a]-s.checkin[b];});
  if(s.notes) h+=gh('ملاحظات المدرب')+'<div class="card pad" style="white-space:pre-wrap;line-height:1.7;font-size:15px">'+esc(s.notes)+'</div>';
  if(s.upd){
    var rows=Object.keys(s.upd).filter(function(pid){return P(pid);}).map(function(pid){return {id:pid,c:s.upd[pid]};}).sort(function(a,b){return (b.c.ovrA-b.c.ovrB)-(a.c.ovrA-a.c.ovrB);});
    h+='<div id="updSec">'+gh('تغيّر الطاقات')+'<div class="card">'+rows.map(function(x){var c=x.c, dd=c.ovrA-c.ovrB;
      var det=c.d?Object.keys(c.d).map(function(k){var v=c.d[k];return '<span class="tag '+(v>0?'on':'')+'" style="'+(v<0?'color:var(--red)':'')+'">'+ATTR[k]+' <span class="ltr">'+(v>0?'+':'')+v+'</span></span>';}).join(' '):'<span class="small muted">بدون تغيير</span>';
      return '<div class="cell tap ind updrow" onclick="openPlayer(\''+x.id+'\')">'+avatar(x.id)+'<div class="body"><div class="t">'+esc(pname(x.id))+'</div>'+(c.perf!=null?'<div class="s">الأداء <b class="num" style="color:var(--label)">'+c.perf+'</b> · المتوقع <span class="num">'+c.exp+'</span></div>':'')+'<div class="s" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">'+det+'</div></div><span class="num muted">'+c.ovrB+'</span><span class="muted" style="display:inline-flex">'+ic('chev','xs')+'</span><span class="v strong num">'+c.ovrA+'</span></div>';
    }).join('')+'</div></div>';
  }
  if(isCoach&&s.status==='done') h+='<div class="m-foot"><button class="btn tinted" onclick="reopenSession(\''+id+'\')">'+ic('pencil','s')+'إعادة فتح</button><button class="btn danger" id="delSessDetail" onclick="deleteSession(\''+id+'\')">حذف</button></div>';
  setModal(h);
}

/* ---------- الإحصائيات ---------- */
function renderStats(el){
  var st=computeStats(), arr=vals(st).filter(function(x){return P(x.id);}), h=largeTitle('الإحصائيات','');
  var BI={goals:['ball','var(--tint)'],assists:['assist','#0A84FF'],mvp:['star','#D4A93C',1],avg:['trend','#5856D6'],apps:['cal','#FF9500'],w:['trophy','#34C759'],late:['clock','#FF3B30']};
  var board=function(title,key,fmt,filter,limit){
    var a=arr.filter(filter||function(x){return x[key]>0;}).sort(function(x,y){return (y[key]||0)-(x[key]||0)||(y.apps-x.apps);}).slice(0,limit||5);
    var body=a.length?a.map(function(x,i){return '<div class="cell tap" onclick="openPlayer(\''+x.id+'\')"><span class="rank num'+(i<3?' r'+(i+1):'')+'">'+(i+1)+'</span><div class="body"><div class="t">'+esc(pname(x.id))+'</div></div><span class="v strong num">'+(fmt?fmt(x):x[key])+'</span></div>';}).join(''):'<div class="cell"><div class="body"><div class="s">لا توجد بيانات بعد</div></div></div>';
    var bi=BI[key]; return '<div>'+gh('<span class="bh">'+(bi?tile(bi[1],bi[0],bi[2]):'')+title+'</span>')+'<div class="card">'+body+'</div></div>';
  };
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));column-gap:16px">';
  h+=board('الهدّافون','goals');
  h+=board('المايسترو (صناعة الأهداف)','assists');
  h+=board('أفضل لاعب','mvp',function(x){return x.mvp+' <span class="small muted">مرة</span>';});
  h+=board('أعلى معدل تقييم','avg',function(x){return x.avg+' <span class="small muted">('+x.rN+')</span>';},function(x){return x.rN>=2;});
  h+=board('الأكثر حضوراً','apps');
  h+=board('الأكثر فوزاً','w');
  h+=board('الأكثر تأخراً','late',function(x){return x.late+' <span class="small muted">مرة · '+x.lateMin+' د</span>';});
  h+='</div>';

  h+=rulesHTML();
  el.innerHTML=h;
}
function ruleRow(label,val,cls,sub){return '<div class="cell"><div class="body"><div class="t" style="font-size:15px">'+label+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+'</div><span class="rb num '+(cls||'r-no')+'" style="min-width:52px"><span class="ltr">'+val+'</span></span></div>';}
function rulesHTML(){
  var f=function(icon,color,t){return '<div class="cell ind">'+tile(color,icon)+'<div class="body"><div class="t" style="font-size:15px">'+t+'</div></div></div>';};
  var h='<div id="rulesSec">'+gh('نظام التقييم');
  h+='<div class="card" style="overflow:hidden"><div style="padding:20px 18px;background:linear-gradient(135deg,#0E4A35,#06231B);color:#fff">'+
     '<div style="font-size:12px;letter-spacing:.5px;color:#E6CC78;font-weight:700">نموذج تقييم احترافي</div>'+
     '<div style="font-size:21px;font-weight:800;margin:6px 0 8px">تتحدّث الطاقات تلقائياً بعد كل تمرين</div>'+
     '<div style="font-size:14px;line-height:1.75;color:rgba(255,255,255,.82)">يعتمد على منهجية «إيلو» (Elo)، الأساس الرياضي نفسه الذي يعتمده الاتحاد الدولي لكرة القدم (فيفا) في تصنيف المنتخبات منذ 2018، ويقارن أداء كل لاعب بالأداء المتوقع منه.</div></div>'+
     f('star','#D4A93C','تقييم اللجنة الفنيّة')+f('ball','var(--tint)','الأهداف والصناعة حسب المركز')+f('scale','#0A84FF','النتيجة وقوة الفريق المنافس')+f('trend','#5856D6','مستوى اللاعب وخبرته')+f('check','var(--orange)','الالتزام بالحضور')+'</div>';
  return h+'</div>';
}

/* ---------- المدرب والإعدادات ---------- */
function coachClick(){
  if(isCoach){ openSettings(); return; }
  var h=mh('صلاحيات مجلس الإدارة')+'<div style="text-align:center;margin:6px 0 16px"><div class="empty" style="padding:4px 0 0"><div class="ei">'+ic('lock')+'</div></div><div class="small muted">أدخل كلمة السر لتتمكن من الإضافة والتعديل.<br>اللاعبون على المدرج يتفرّجون.</div></div>'+
    '<input class="field num" id="cc" type="password" inputmode="numeric" placeholder="كلمة السر" style="text-align:center;letter-spacing:4px" onkeydown="if(event.key===\'Enter\')coachLogin()"><div class="m-foot"><button class="btn" id="ccBtn" onclick="coachLogin()">دخول</button></div>';
  openModal(h); setTimeout(function(){var e=document.getElementById('cc');if(e)e.focus();},350);
}
function coachLogin(){
  if(document.getElementById('cc').value.trim()===COACH_CODE){isCoach=true;lsSet('saff_tr_coach','1');closeModal();toast('تم تفعيل صلاحيات مجلس الإدارة');render();}
  else{toast('❌ كلمة السر غير صحيحة');var e=document.getElementById('cc');if(e&&e.animate)e.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}],{duration:350});}
}
function openSettings(){
  modalRefresh=null; setTimeout(function(){modalRefresh=function(){openSettingsInner();};},0); openSettingsInner(true);
}
function openSettingsInner(first){
  var h=mh('الإعدادات');
  h+='<div class="card"><div class="cell ind">'+tile(mode==='cloud'?'#0A84FF':'var(--orange)',mode==='cloud'?'upl':'note')+'<div class="body"><div class="t">مكان الحفظ</div><div class="s">'+(mode==='cloud'?'قاعدة البيانات — يراها الجميع':'هذا الجهاز فقط')+'</div></div></div>'+
     '<div class="cell ind">'+tile('var(--tint)','people')+'<div class="body"><div class="t">البيانات</div><div class="s">'+playersArr().length+' لاعب · '+sessArr().length+' تمرين</div></div></div></div>';
  var v2=(S.settings||{}).design!=='classic';
  h+=gh('المظهر')+'<div class="card"><div class="cell tap ind" id="designToggle" onclick="put(\'settings/design\','+(v2?'\'classic\'':'null')+');toast(\''+(v2?'رجعنا للتصميم السابق':'تم تفعيل التصميم الجديد')+'\')">'+tile('#AF52DE','star',true)+'<div class="body"><div class="t">التصميم الجديد</div><div class="s">يتغيّر للجميع فوراً، وتقدر ترجع للتصميم السابق متى ما تبي</div></div><span class="switch'+(v2?' on':'')+'"></span></div></div>';
  h+=gh('النسخ الاحتياطي')+'<div class="card"><div class="cell tap ind" onclick="exportData()">'+tile('#34C759','down')+'<div class="body"><div class="t">تنزيل نسخة احتياطية</div></div>'+chev()+'</div>'+
     '<label class="cell tap ind" style="cursor:pointer">'+tile('#5856D6','upl')+'<div class="body"><div class="t">استرجاع من نسخة احتياطية</div></div>'+chev()+'<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div>';
  h+='<div class="card" style="margin-top:26px"><div class="cell tap" id="logoutBtn" onclick="coachLogout()"><div class="body" style="text-align:center"><div class="t" style="color:var(--red)">الخروج من صلاحيات مجلس الإدارة</div></div></div></div>';
  if(first)openModal(h); else setModal(h);
}
function coachLogout(){isCoach=false;lsDel('saff_tr_coach');closeModal();render();toast('تم الخروج من صلاحيات مجلس الإدارة');}
function exportData(){
  var data={app:'saff-training',v:1,at:new Date().toISOString(),players:S.players,sessions:S.sessions,weeks:S.weeks};
  var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='training-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  toast('تم تنزيل النسخة');
}
function importData(inp){
  var f=inp.files&&inp.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result); if(d.app!=='saff-training')throw 0;
      askConfirm('<b>استبدال كل البيانات الحالية؟</b><br><span class="small">'+Object.keys(d.players||{}).length+' لاعب · '+Object.keys(d.sessions||{}).length+' تمرين</span>',function(){
        var clean=normalize(clone(d)); var strip=function(o){var x=clone(o);Object.keys(x).forEach(function(k){delete x[k].id;});return x;};
        putMany({players:strip(clean.players),sessions:strip(clean.sessions),weeks:clean.weeks});
        closeModal(); toast('تم الاسترجاع');
      },'استبدال');
    }catch(e){toast('❌ الملف غير صالح');}
  };
  r.readAsText(f);
}

/* ---------- النوافذ والتنبيهات ---------- */
var modalRefresh=null;
function openModal(h){ modalRefresh=null; setModal(h); document.getElementById('modal').scrollTop=0; document.getElementById('ov').classList.add('show'); document.body.style.overflow='hidden'; }
function setModal(h){ var m=document.getElementById('modal'); var st=m.scrollTop; m.innerHTML=h; m.scrollTop=st; }
function closeModal(){ document.getElementById('ov').classList.remove('show'); document.body.style.overflow=''; modalRefresh=null; }
var _cf=null;
function askConfirm(msg,yes,yesLabel){
  _cf=yes;
  var danger=yesLabel==='حذف';
  document.getElementById('modal2').innerHTML='<div class="msg">'+msg+'</div><div class="btns"><button onclick="closeConfirm()">إلغاء</button><button id="cfYes" class="'+(danger?'red':'')+'" onclick="var f=_cf;closeConfirm();if(f)f();">'+(yesLabel||'تأكيد')+'</button></div>';
  document.getElementById('ov2').classList.add('show');
}
function closeConfirm(){document.getElementById('ov2').classList.remove('show');_cf=null;}
var _tt=null;
function toast(m){
  var bad=/^(❌|⚠️)/.test(m); m=String(m).replace(/^[^\p{L}\p{N}]+/u,'');
  var t=document.getElementById('toast');
  t.innerHTML='<span style="color:'+(bad?'var(--orange)':'var(--green)')+';display:inline-flex">'+ic(bad?'warn':'check','s')+'</span>'+esc(m);
  t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},2600);
}

/* ---------- التشغيل ---------- */
isCoach = lsGet('saff_tr_coach')==='1';
if(QS.tab&&document.getElementById('pg-'+QS.tab)) curTab=QS.tab;
document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-t')===curTab);});
if(typeof firebase!=='undefined' && !('local' in QS)) startCloud(); else startLocal();
</script>

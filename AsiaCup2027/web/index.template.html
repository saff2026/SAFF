<!--
  ⚠️ ملفّ مولَّد — لا تعدّله بيدك.
  المصادر في AsiaCup2027/web/ ، وإعادة البناء:
      python3 AsiaCup2027/tools/build-web.py
  لماذا ملفّ واحد؟ عامل الخدمة sw.js يخزّن الملفّات الثابتة بأسلوب
  «الكاش أولًا»، فلو كانت السكربتات منفصلة بقي اللاعبون على نسخة قديمة
  بعد كل تعديل. أمّا تصفّح صفحة HTML فهو «الشبكة أولًا» ⇒ تصل التعديلات فورًا.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>دوري توقّعات كأس آسيا ٢٠٢٧</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كأس آسيا ٢٧">
<link rel="manifest" href="manifest-asia.json">
<link rel="apple-touch-icon" href="icon-asia-192.png">
<link rel="icon" type="image/png" href="icon-asia-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
/* ===========================================================================
 *  الهُوية الرسمية لكأس آسيا السعودية ٢٠٢٧ — على خلفية بيضاء
 * ---------------------------------------------------------------------------
 *  الألوان مستخرَجة من المواد الرسمية (صورة القرعة وشعار البطولة) لا مُخمَّنة:
 *    #0C282F  التركوازي الغامق — اللون السائد في المواد الرسمية
 *    #76FA95  الأخضر النعناعي  — لون الهُوية المميِّز
 *
 *  ملاحظة حاكمة في التصميم: تباين الأخضر الرسمي على الأبيض ١٫٣٢:١ فقط،
 *  فلا يصلح للنصّ إطلاقًا. استُعمل للتعبئة والتمييز والخلفيات، والنصّ كلّه
 *  بالتركوازي الغامق (تباينه ١٥٫٤:١). وحيث لزم أخضرُ نصٍّ استُعمل #117A3D
 *  (تباينه ٥٫٤:١) لا الأخضر الفاتح.
 * =========================================================================== */
:root{
  --bg:#FFFFFF;
  --surface:#F3F8F5;          /* أبيض مائل للنعناعي */
  --card:#FFFFFF;
  --ink:#0C282F;              /* التركوازي الرسمي — كل النصوص */
  --ink-2:#51696E;            /* نصّ ثانوي */
  --ink-3:#8AA0A4;            /* نصّ خافت */
  --brand:#0C282F;
  --mint:#76FA95;             /* الأخضر الرسمي — تعبئة لا نصّ */
  --mint-soft:#DFFDE8;
  --mint-line:#A8F0BE;
  --green:#117A3D;            /* أخضر صالح للنصّ */
  --line:rgba(12,40,47,.13);
  --line-2:rgba(12,40,47,.07);
  --ok:#117A3D; --bad:#B42318;
  --shadow:0 1px 2px rgba(12,40,47,.05), 0 6px 18px rgba(12,40,47,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
*{scrollbar-width:thin;scrollbar-color:rgba(46,139,192,.55) transparent;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(46,139,192,.45);border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}
body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px 94px;
  background:var(--bg);}

.screen{display:none;width:100%;max-width:480px;flex-direction:column;align-items:center;gap:14px;}
.screen.active{display:flex;}

/* ---- الترويسة وتسجيل الدخول ---- */
.brand{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-bottom:2px;padding:22px 0 6px;width:100%;}
/* نقش المثلّثات من الهُوية الرسمية — مثلّثات حقيقية حادّة، لا تدرّجات
   ضبابية. يظهر خلف الشعار وحده فيبقى بقيّة التطبيق أبيض نظيفًا. */
.brand::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'>\
<g fill='%2376FA95'>\
<path d='M0 0h30L0 30z'/><path d='M60 0h30L60 30z'/>\
<path d='M120 60V30L90 60z'/><path d='M30 90h30L30 60z'/>\
<path d='M90 120h30L90 90z'/><path d='M0 90v30l30-30z'/>\
</g></svg>");
  background-size:76px 76px;opacity:.26;
  /* يتلاشى قبل أن يصل إلى العنوان، فلا يزاحم قراءته */
  -webkit-mask-image:radial-gradient(ellipse 62% 54% at 50% 30%, #000 0%, transparent 72%);
  mask-image:radial-gradient(ellipse 62% 54% at 50% 30%, #000 0%, transparent 72%);}
.brand > *{position:relative;z-index:1;}
.brand-badge{height:104px;width:auto;display:block;}
.brand-t{font-size:1.4rem;font-weight:900;color:var(--ink);text-align:center;line-height:1.3;}
.brand-s{font-size:.84rem;color:var(--ink-2);text-align:center;line-height:1.8;}
.brand-s b{color:var(--ink);font-weight:800;}

.box{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:20px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);}
.box-title{font-size:.95rem;font-weight:800;color:var(--ink);}
input.field,select.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 15px;color:var(--ink);font-family:inherit;font-size:1rem;outline:none;}
input.field:focus,select.field:focus{border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 3px var(--mint-soft);}
input.field::placeholder{color:var(--ink-3);}
.btn{width:100%;padding:14px;border-radius:13px;border:none;font-family:inherit;font-size:1rem;
  font-weight:800;cursor:pointer;transition:opacity .2s,transform .1s;}
.btn:active:not(:disabled){transform:scale(.97);opacity:.9;}
.btn:disabled{background:var(--surface)!important;color:var(--ink-3)!important;cursor:default;
  box-shadow:none!important;}
.btn-main{background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(12,40,47,.22);}
.btn-gold{background:var(--mint);color:var(--ink);box-shadow:0 2px 10px rgba(118,250,149,.45);}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.err{font-size:.82rem;color:var(--bad);text-align:center;min-height:18px;line-height:1.6;}

/* ---- شريط التنقّل ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--brand);
  border-top:3px solid var(--mint);box-shadow:0 -6px 24px rgba(12,40,47,.18);
  display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:50;}
.tab{flex:1;max-width:96px;background:none;border:none;color:rgba(255,255,255,.78);font-family:inherit;
  font-size:.7rem;font-weight:800;cursor:pointer;padding:7px 2px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab .ico{font-size:1.15rem;line-height:1;}
.tab.active{color:var(--ink);background:var(--mint);}

.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.me-chip{font-size:.85rem;color:var(--ink-2);background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:7px 14px;display:flex;align-items:center;gap:7px;cursor:pointer;
  box-shadow:var(--shadow);}
.me-chip b{color:var(--ink);}
.me-chip:hover{border-color:var(--brand);}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:1.1rem;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow);}
.icon-btn:hover{color:var(--ink);border-color:var(--brand);}
.icon-btn.on{border-color:var(--green);background:var(--mint-soft);color:var(--green);}

.section-title{width:100%;font-size:1rem;font-weight:900;color:var(--ink);display:flex;
  align-items:center;justify-content:space-between;gap:8px;}
.hint{width:100%;font-size:.76rem;color:var(--ink-2);line-height:1.75;}
.notice{width:100%;background:var(--mint-soft);border:1px solid var(--mint-line);
  border-radius:13px;padding:11px 13px;font-size:.78rem;color:var(--ink);line-height:1.75;}
.notice b{color:var(--ink);}
.notice.warn{background:#FEF3F2;border-color:#FDA29B;color:#912018;}
.notice.warn b{color:#912018;}

/* ---- الشرائح ---- */
.chips{width:100%;display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:8px;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
.chips::-webkit-scrollbar{height:4px;}
.chip{flex:0 0 auto;scroll-snap-align:center;background:var(--card);border:1px solid var(--line);
  color:var(--ink-2);font-family:inherit;font-size:.8rem;font-weight:800;padding:7px 14px;
  border-radius:20px;cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}

.sub-tabs{display:flex;gap:6px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:4px;}
.sub-tab{flex:1;background:none;border:none;color:var(--ink-2);font-family:inherit;font-weight:800;
  font-size:.86rem;padding:9px 6px;border-radius:9px;cursor:pointer;}
.sub-tab.active{background:var(--brand);color:#fff;}

/* ---- بطاقة المباراة ---- */
.match{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);}
.match.finished{background:var(--surface);}
.match.locked{border-color:var(--line);}
.match-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:.7rem;
  color:var(--ink-2);gap:8px;}
.hc-l{justify-self:start;}.hc-c{justify-self:center;text-align:center;}.hc-r{justify-self:end;}
.grp-badge{background:var(--brand);color:#fff;border-radius:8px;padding:3px 10px;font-weight:800;white-space:nowrap;}
.status-badge{font-weight:900;white-space:nowrap;font-size:.62rem;letter-spacing:.4px;padding:3px 9px;border-radius:8px;}
.status-badge.open{background:var(--mint);color:var(--ink);}
.status-badge.locked{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);}
.status-badge.soon{background:var(--surface);color:var(--ink-3);border:1px solid var(--line-2);}
.status-badge.finished{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);}
.match-meta{width:100%;font-size:.69rem;color:var(--ink-2);text-align:center;line-height:1.6;}
.match-meta .prov{color:var(--green);font-weight:700;}
.teams{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.team{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0;}
.team .flagimg{width:46px;height:31px;object-fit:cover;border-radius:5px;
  box-shadow:0 1px 4px rgba(12,40,47,.22);}
.team .ph{width:46px;height:31px;border:1.5px dashed var(--line);border-radius:5px;}
.team .tname{font-size:.86rem;font-weight:800;line-height:1.3;}
.team .tslot{font-size:.72rem;font-weight:700;color:var(--ink-3);line-height:1.4;}
.vs{font-size:.78rem;color:var(--ink-2);font-weight:800;padding:0 4px;}

/* ---- مُدخل النتيجة ---- */
.stepper{display:flex;align-items:center;justify-content:center;gap:9px;}
.stp{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font-size:1.25rem;font-weight:800;cursor:pointer;font-family:inherit;line-height:1;}
.stp:hover:not(:disabled){border-color:var(--brand);background:var(--mint-soft);}
.stp:active{transform:scale(.93);}
.stp:disabled{opacity:.35;cursor:default;}
.stv{min-width:46px;text-align:center;font-size:1.5rem;font-weight:900;color:var(--ink);}
.pred-row{display:flex;align-items:center;justify-content:center;gap:14px;}
.pen-row{display:flex;flex-direction:column;gap:7px;background:var(--mint-soft);
  border:1px solid var(--mint-line);border-radius:12px;padding:10px;}
.pen-lbl{font-size:.76rem;font-weight:800;color:var(--ink);text-align:center;}
.pen-opts{display:flex;gap:7px;}
.pen-opt{flex:1;padding:9px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font-family:inherit;font-size:.82rem;font-weight:800;cursor:pointer;}
.pen-opt.on{border-color:var(--brand);background:var(--brand);color:#fff;}
.act-row{display:flex;gap:8px;}
.x2-btn{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:12px 13px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;
  font-size:.84rem;font-weight:900;cursor:pointer;white-space:nowrap;}
.x2-btn.on{border-color:var(--mint-line);background:var(--mint);color:var(--ink);}
.x2-btn:disabled{opacity:.42;cursor:default;}
.save-btn{flex:1;padding:12px;border-radius:12px;border:none;background:var(--brand);
  color:#fff;font-family:inherit;font-size:.92rem;font-weight:900;cursor:pointer;
  box-shadow:0 2px 10px rgba(12,40,47,.2);}
.save-btn:disabled{background:var(--surface);color:var(--ink-3);cursor:default;box-shadow:none;}
.locked-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:.86rem;}
.locked-box .lb{color:var(--ink-2);font-weight:800;font-size:.76rem;}
.locked-box .lv{font-weight:900;color:var(--ink);font-size:1rem;}
.pts-pill{font-size:.78rem;font-weight:900;padding:4px 10px;border-radius:999px;}
.pts-pill.p5{background:var(--mint);color:var(--ink);}
.pts-pill.p3{background:var(--mint-soft);color:var(--ink);border:1px solid var(--mint-line);}
.pts-pill.p0{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);}
.x2-tag{font-size:.68rem;font-weight:900;color:var(--ink);background:var(--mint);border-radius:6px;padding:2px 6px;}

/* ---- توقّعات البطولة ---- */
.tour-card{width:100%;background:var(--mint-soft);
  border:1.5px solid var(--mint-line);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);}
.tour-card h3{font-size:1.05rem;font-weight:900;color:var(--ink);}
.tour-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:1.02rem;font-weight:900;color:var(--ink);cursor:pointer;list-style:none;}
.tour-sum::-webkit-details-marker{display:none;}
.tour-sum::after{content:'▾';font-size:.9rem;color:var(--ink-2);transition:transform .2s;}
.tour-card[open] .tour-sum::after{transform:rotate(180deg);}
.tour-badge{font-size:.72rem;font-weight:800;color:var(--ink);background:#fff;
  border:1px solid var(--mint-line);border-radius:999px;padding:3px 10px;white-space:nowrap;
  margin-inline-start:auto;}
.tour-row{display:flex;flex-direction:column;gap:6px;}
.tour-row label{font-size:.82rem;color:var(--ink-2);font-weight:800;display:flex;justify-content:space-between;gap:8px;}
.tour-row .pts-tag{color:var(--green);white-space:nowrap;font-weight:900;}

/* ---- جداول ---- */
.gr-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);}
.gr-card h4{font-size:.98rem;font-weight:900;color:var(--ink);
  border-inline-start:4px solid var(--mint);padding-inline-start:9px;}
.gr-tbl{width:100%;border-collapse:collapse;font-size:.84rem;}
.gr-tbl th{font-size:.68rem;font-weight:800;color:var(--ink-2);text-align:center;padding:6px 3px;border-bottom:1px solid var(--line);}
.gr-tbl th:nth-child(2){text-align:right;}
.gr-tbl td{padding:8px 3px;text-align:center;border-bottom:1px solid var(--line-2);font-weight:700;}
.gr-tbl tr:last-child td{border-bottom:none;}
.gr-tbl td.gr-team{text-align:right;}
.gr-team{display:flex;align-items:center;gap:6px;font-weight:800;}
.gr-team img.flag{width:26px;height:17px;object-fit:cover;border-radius:3px;flex-shrink:0;
  box-shadow:0 0 0 1px var(--line);}
.gr-tbl tr.adv td{background:var(--mint-soft);}
.gr-tbl tr.adv td:first-child{box-shadow:inset 3px 0 0 var(--green);}
.gr-tbl tr.third td{background:#FFFBEB;}
.gr-tbl tr.third td:first-child{box-shadow:inset 3px 0 0 #D9A404;}
.gr-tbl tr.out td{color:var(--ink-3);}
.gr-tbl tr.out td:first-child{box-shadow:inset 3px 0 0 var(--line);}
.legend{display:flex;gap:13px;font-size:.72rem;color:var(--ink-2);flex-wrap:wrap;padding-top:3px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle;}

/* ---- الترتيب العام ---- */
.ld-row{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow);}
.ld-row.me{border-color:var(--brand);border-width:1.5px;background:var(--mint-soft);}
.ld-rank{min-width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.88rem;background:var(--surface);color:var(--ink-2);flex-shrink:0;
  border:1px solid var(--line);}
.ld-row:nth-child(1) .ld-rank{background:var(--mint);color:var(--ink);border-color:var(--mint-line);}
.ld-row:nth-child(2) .ld-rank{background:#E6EEF0;color:var(--ink);border-color:#C9D8DB;}
.ld-row:nth-child(3) .ld-rank{background:#F6E6D4;color:#6B3F17;border-color:#E3C9AA;}
.ld-name{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.ld-name .nm{font-weight:800;font-size:.95rem;color:var(--ink);}
.ld-name .sub{font-size:.71rem;color:var(--ink-2);font-weight:700;}
.ld-pts{font-weight:900;font-size:1.3rem;color:var(--ink);flex-shrink:0;text-align:center;}
.ld-pts small{font-size:.63rem;color:var(--ink-3);font-weight:800;display:block;}

/* ---- الشجرة ---- */
.br-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px;}
.br-grid{display:flex;direction:rtl;gap:10px;min-width:100%;align-items:stretch;}
.br-col{display:flex;flex-direction:column;flex:1 1 0;min-width:150px;}
.br-col-h{text-align:center;padding:8px 0;font-weight:900;color:#fff;font-size:.76rem;
  background:var(--brand);border-radius:8px;margin-bottom:8px;}
.br-col-body{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:9px;min-height:320px;}
.br-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px;
  display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);}
.br-meta{font-size:.6rem;color:var(--ink-3);font-weight:800;display:flex;justify-content:space-between;gap:6px;}
.br-meta .no{color:var(--green);}
.br-team{display:flex;align-items:center;gap:6px;padding:2px 0;min-width:0;}
.br-team img.flag{width:28px;height:19px;object-fit:cover;border-radius:3px;flex-shrink:0;}
.br-team .ph{width:28px;height:19px;flex-shrink:0;border:1.5px dashed var(--line);border-radius:3px;}
.br-team .nm{flex:1;font-weight:800;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.br-team .sc{font-weight:900;min-width:13px;text-align:center;font-size:.8rem;}
.br-team.tba .nm{color:var(--ink-3);font-weight:700;font-size:.68rem;white-space:normal;}
.br-team.win .nm,.br-team.win .sc{color:var(--green);font-weight:900;}
.br-team.lose .nm,.br-team.lose .sc{color:var(--ink-3);}

/* ---- أفضل الثوالث ---- */
.tp-row{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.86rem;
  box-shadow:var(--shadow);}
.tp-row.in{border-color:var(--mint-line);background:var(--mint-soft);}
.tp-rank{min-width:26px;font-weight:900;color:var(--ink-2);text-align:center;flex-shrink:0;}
.tp-row.in .tp-rank{color:var(--ok);}
.tp-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.tp-team{display:flex;align-items:center;gap:7px;font-weight:800;min-width:0;}
.tp-team img.flag{width:26px;height:17px;object-fit:cover;border-radius:3px;flex-shrink:0;}
.tp-team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tp-sub{font-size:.71rem;color:var(--ink-2);font-weight:700;}
.tp-stats{flex-shrink:0;text-align:left;display:flex;flex-direction:column;gap:2px;}
.tp-pts{font-weight:900;color:var(--ink);font-size:1.05rem;}

/* ---- القوانين ---- */
.rule-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);}
.rule-card h4{font-size:.95rem;font-weight:900;color:var(--ink);
  border-inline-start:4px solid var(--mint);padding-inline-start:9px;}
.rule-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:.86rem;
  line-height:1.65;padding:8px 0;border-bottom:1px solid var(--line-2);}
.rule-line:last-child{border-bottom:none;}
.rule-line .v{font-weight:900;color:var(--ink);white-space:nowrap;
  background:var(--mint-soft);border-radius:7px;padding:2px 9px;}
.rule-p{font-size:.84rem;line-height:1.9;color:var(--ink-2);}
.rule-p b{color:var(--ink);font-weight:800;}

/* ---- الإدارة ---- */
.admin-card{width:100%;background:#FEF6F5;border:1.5px solid #FDA29B;
  border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.admin-card h4{font-size:.92rem;font-weight:900;color:#912018;}
.adm-grid{display:flex;align-items:center;justify-content:center;gap:10px;}

/* ---- عامّ ---- */
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--brand);border:1px solid var(--brand);color:#fff;padding:12px 20px;border-radius:13px;
  font-size:.88rem;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:100;
  box-shadow:0 10px 30px rgba(12,40,47,.3);max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{width:100%;text-align:center;color:var(--ink-3);font-size:.86rem;padding:26px 10px;line-height:1.8;}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .8s linear infinite;margin:26px auto;}
@keyframes sp{to{transform:rotate(360deg)}}
img.flag{display:inline-block;border-radius:2px;box-shadow:0 0 0 1px var(--line);object-fit:cover;}
.flagem{display:inline-block;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
